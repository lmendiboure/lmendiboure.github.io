<body>
<header class="topbar"><div class="shell topbar-inner"><div class="brand"><div class="brand-mark">IoT</div><div><strong>Systems Design · Session 1</strong><span>7 aligned activities · Work / Restitution</span></div></div><div class="progress" id="stopProgress" aria-label="Class checkpoints"></div><div class="top-actions"><button class="icon-btn" id="fullscreenBtn" type="button">Fullscreen</button></div></div></header>
<main><section class="scene" id="scene"></section></main>
<div class="controls simple-controls"><div class="shell controls-inner"><div class="control-group"><button class="btn" id="backBtn" type="button">← Back</button></div><div class="screen-count" id="screenCount"></div><div class="control-group"><button class="btn primary" id="advanceBtn" type="button">Start restitution →</button></div><span class="keyhint">←/→ navigate · F fullscreen</span></div></div>
<script>

const checkpoints=[
{
 label:'Activity 1',title:'Map the IoT landscape',workTime:'6–7 min',restTime:'5–6 min',next:'Build architecture v1',
 work:{q:'Map first. Define later.',copy:'Classify the eight connected physical systems. Use one main domain and an optional second domain when the boundary is genuinely ambiguous.',items:[['OUTPUT','Eight classified cases with a defensible primary domain.'],['BE READY TO DEFEND','One case that could reasonably belong to two domains.'],['GUARDRAIL','Do not search for an IoT definition yet. Use the systems in front of you.']]},
 rest:{board:{id:'landscape-capture',type:'capture',title:'Class board · What repeats across the cases?',prompt:'Add only short recurring features after groups have committed.',placeholder:'e.g. physical entity'},questions:[['COMPARE','Where did groups classify the same case differently — and why?'],['LOOK ACROSS CASES','What repeats even when the application domain changes?'],['BOUNDARY','Is “connected” alone enough to call something IoT?']],challenge:'A Raspberry Pi hosts a normal web page but senses or controls nothing in the physical world. Would you call that IoT?',takeaway:{text:'For this course, IoT systems connect physical entities that are observed or acted upon to digital services through communication and computation. “Connected” alone is not a useful boundary.',chain:['physical world','sense / act','communicate','digital service']},reality:{kind:'examples',items:[['Cold chain','condition → history / alert'],['Smart metering','consumption → monitoring / operation'],['Industrial monitoring','machine condition → maintenance']],question:'Same skeleton, different domain: what is invariant, and what can change completely?'}}
},
{
 label:'Activity 2',title:'Build architecture v1',workTime:'10–12 min',restTime:'6–7 min',next:'Expose communication requirements',
 work:{q:'Build Architecture v1 from responsibilities and flows.',copy:'Use the campus mission. Draw the components you think are needed and label the information that moves between them.',items:[['OUTPUT','A readable end-to-end Architecture v1 with labelled flows.'],['BE READY TO DEFEND','One essential component and the responsibility it performs.'],['GUARDRAIL','A product or protocol name is not an architectural responsibility.']]},
 rest:{board:{id:'architecture-structure',type:'structure',title:'Class architecture · Build the minimum model the room can justify',prompt:'Add 4–6 boxes, then connect only information flows that groups can name.',placeholder:'e.g. Sensors'},questions:[['COMPARE','What did groups mean by “component”? Function, physical box, product — or a mixture?'],['COUNT TWO WAYS','How many responsibilities exist? How many physical devices?'],['FOLLOW THE DATA','Which labelled flows expose dependencies that boxes alone hide?']],challenge:'One Raspberry Pi senses, stores, computes and serves the dashboard. How many responsibilities exist — and how many physical boxes?',takeaway:{text:'Separate responsibilities before products: Sense / Act · Communicate · Compute · Store · Use. These are responsibilities, not mandatory layers or devices.',chain:['Sense / Act','Communicate','Compute','Store','Use']},reality:{kind:'chain',chain:['30 measurement points','Campus communication','Ingest / compute','Time-series store','Dashboard / alerts'],question:'One defensible design, not “the answer”: which boxes could merge, move or replicate while preserving the service?'}}
},
{
 label:'Activity 3',title:'Expose communication requirements',workTime:'6–8 min',restTime:'5–6 min',next:'Discover communication patterns',
 work:{q:'Turn the campus mission into explicit constraints.',copy:'Select what matters, choose your Top 3, and tie at least one priority to a particular information flow.',items:[['OUTPUT','Relevant constraints + a Top 3.'],['BE READY TO DEFEND','One priority using evidence from the mission or Architecture v1.'],['GUARDRAIL','Commit your Top 3 before the class tally. Do not choose a radio yet.']]},
 rest:{board:{id:'requirements-compare',type:'compare',title:'Class tally · Which requirement drove your group most?',prompt:'Count one dominant driver per group only after each group has committed.',categories:['Energy budget','Data volume / throughput','Latency','Reliability','Range','Scale','Mobility','Infrastructure','Cost']},questions:[['COMPARE','Why did different groups rank different constraints first?'],['COMPARE FLOWS','Should periodic sensor data and abnormal-condition alerts share the same priorities?'],['PRECISION','When someone says “fast”, do they mean low latency or high data rate?']],challenge:'The indoor sensor is mains-powered while the outdoor node remains battery-powered. Should Energy still matter equally for every flow?',takeaway:{text:'Requirements become useful when attached to a specific flow: range, data volume/throughput, latency, reliability, energy, scale, mobility, infrastructure and cost.',chain:['flow','dominant requirements','candidate solutions']},reality:{kind:'metrics',metrics:[['≈0.69 MB/day','30 nodes · 4×32-bit values · 1 report/min'],['≈1.73 GB/day','100 kB image every 5 s']],question:'Same campus, radically different traffic. Which requirement should be reconsidered first when a CO₂ sensor becomes a camera?'}}
},
{

 work:{q:'Start from the communication problem — not from a standard name.',copy:'Use distance, data, energy and available infrastructure to reason about the network shape before revealing a technology family.',items:[['OUTPUT','A mental map of the five network shapes used in the activity.'],['BE READY TO DEFEND','Why one shape implies different infrastructure from another.'],['GUARDRAIL','Do not stop for a class correction here. Continue directly to Activity 5.']]}
},
{

},
{

 rest:{board:{id:'technology-compare',type:'compare',title:'Class position · Back on campus',prompt:'Tally each group’s campus checkpoint position after the transfer cases.',categories:['One family could be enough','Mixed design plausible','Not enough information']},questions:[['COMPARE','Why did some groups accept one family while others preferred a mixed design or withheld a decision?'],['EVIDENCE','Which transfer case or network shape supports your campus position?'],['ASSUMPTION','What fact could flip your choice? Power, coverage, traffic, latency, layout?']],challenge:'A LoRaWAN sensor still reaches its gateway, but the gateway loses its upstream Internet path. Which part of the architecture failed?',takeaway:{text:'Reason in this order: communication problem → network shape → technology family → implicit dependencies. A technology choice can also commit you to gateways, operator coverage, spectrum, topology or upstream services.',chain:['Problem','Network shape','Technology family','Implicit dependencies']},reality:{kind:'tech',metrics:[['125 kb/s','BLE LE Coded S=8'],['2 Mb/s','BLE LE 2M'],['0.25–5.47 kb/s','LoRa EU DR0–DR5 · physical bit rate'],['PHY + MAC','IEEE 802.15.4 scope']],question:'These numbers/scopes do not choose for you. Which requirement or infrastructure assumption makes them relevant?',sources:[['Bluetooth SIG','https://www.bluetooth.com/bluetooth-le-primer/'],['LoRa Alliance','https://resources.lora-alliance.org/technical-specifications/rp002-1-0-5-lorawan-regional-parameters'],['IEEE 802.15.4','https://standards.ieee.org/ieee/802.15.4/11041/']]}}
},
{
 label:'Activity 7',title:'Stress-test and revise',workTime:'8–10 min',restTime:'6–8 min',next:'Session complete',
 work:{q:'What happens when one assumption changes?',copy:'Stress-test Architecture v1, make one concrete structural revision, and explain the causal chain that justifies Architecture v2.',items:[['OUTPUT','Architecture v2 with at least one structural edit.'],['CAUSAL CHAIN','Changed assumption → requirement under pressure → architectural response.'],['BE READY TO DEFEND','One residual risk v2 still does not solve.']]},
 rest:{board:null,questions:[['DESIGN DELTA','What changed structurally between v1 and v2?'],['CAUSE','Which changed assumption and requirement justified that change?'],['RESIDUAL RISK','What failure or trade-off remains unresolved?']],challenge:'Replace one CO₂ sensor with a camera sending images every few seconds. Which part of your reasoning should be revisited first — and why?',takeaway:{text:'A defensible IoT design links need → functions → architecture → information flows → requirements → candidate technologies, then revises the design when assumptions change.',chain:['Need','Functions','Architecture','Flows','Requirements','Technology','Challenge','Revision']},reality:{kind:'delta',chain:['Upstream Internet unavailable','Alert availability / latency threatened','Local decision + buffering','Cloud sync later'],question:'The architectural move is justified by a changed requirement — not by “edge is better”. What residual dependency still remains?'}}

let stop=0,mode='work';
const scene=document.getElementById('scene'),screenCount=document.getElementById('screenCount');
const revealState={};
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
const BOARD_STORAGE='iot-projector-liveboards-v16';let boardState={};try{boardState=JSON.parse(sessionStorage.getItem(BOARD_STORAGE)||'{}')||{}}catch(_){boardState={}}
function saveBoards(){try{sessionStorage.setItem(BOARD_STORAGE,JSON.stringify(boardState))}catch(_){}}
function boardData(b){if(!boardState[b.id])boardState[b.id]=b.type==='capture'?{items:[]}:b.type==='structure'?{nodes:[],edges:[]}:{counts:{}};return boardState[b.id]}
function boardHead(b){return `<div class="live-board-head"><div><strong>${esc(b.title)}</strong><span>${esc(b.prompt)}</span></div><span class="live-board-kind">${esc(b.type)}</span></div>`}
function captureBoard(b,d){return `<div class="live-board" data-board="${esc(b.id)}" data-kind="capture">${boardHead(b)}<div class="live-board-body"><form class="board-form" data-capture-form><input name="idea" maxlength="70" autocomplete="off" placeholder="${esc(b.placeholder||'Add a short class idea')}" aria-label="Add class idea"><button class="board-mini-btn primary" type="submit">Add idea</button><button class="board-mini-btn ghost" type="button" data-board-reset>Clear</button></form>${d.items.length?`<div class="capture-items">${d.items.map((x,i)=>`<span class="capture-chip">${esc(x)}<button type="button" data-capture-remove="${i}" aria-label="Remove ${esc(x)}">×</button></span>`).join('')}</div>`:`<div class="board-empty">Class ideas appear here after groups have committed.</div>`}<div class="board-principle">Memory of the discussion, not a transcript or a vote.</div></div></div>`}
function nodePositions(n){const cols=n<=5?Math.max(2,n):3,rows=Math.ceil((n||1)/cols),xs=[];for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols),x=100+(cols===1?0:c*(800/(cols-1))),y=75+r*(rows>1?145:0);xs.push([x,y])}return xs}
function structureSvg(b,d){if(!d.nodes.length)return `<div class="board-empty">Add a few class components or responsibilities, then connect only flows the room can justify.</div>`;const pos=nodePositions(d.nodes.length),marker='arrow-'+b.id.replace(/[^a-z0-9]/gi,'');let edges=d.edges.map(e=>{const a=pos[e.from],z=pos[e.to];if(!a||!z)return '';const dx=z[0]-a[0],dy=z[1]-a[1],len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,x1=a[0]+90*ux,y1=a[1]+28*uy,x2=z[0]-90*ux,y2=z[1]-28*uy,mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${marker})"></line>${e.label?`<text class="edge-text" x="${mx}" y="${my-8}">${esc(e.label.slice(0,32))}</text>`:''}`}).join('');let nodes=d.nodes.map((x,i)=>`<g><rect class="node" x="${pos[i][0]-90}" y="${pos[i][1]-28}" width="180" height="56" rx="13"></rect><text class="node-text" x="${pos[i][0]}" y="${pos[i][1]}">${esc(x.length>22?x.slice(0,21)+'…':x)}</text></g>`).join('');return `<div class="structure-canvas"><svg viewBox="0 0 1000 320" role="img" aria-label="Collective class architecture"><defs><marker id="${marker}" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#72869b"></path></marker></defs>${edges}${nodes}</svg></div>`}
function structureBoard(b,d){const opts=d.nodes.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');return `<div class="live-board" data-board="${esc(b.id)}" data-kind="structure">${boardHead(b)}<div class="live-board-body"><div class="structure-toolbar"><form class="board-form" data-node-form><input name="node" maxlength="45" autocomplete="off" placeholder="${esc(b.placeholder||'Add component or responsibility')}" aria-label="Add component"><button class="board-mini-btn primary" type="submit">Add box</button><button class="board-mini-btn ghost" type="button" data-structure-undo>Undo</button></form>${d.nodes.length>=2?`<form class="board-form structure-edge" data-edge-form><select name="from" aria-label="Flow from">${opts}</select><span>→</span><select name="to" aria-label="Flow to">${opts}</select><input name="label" maxlength="38" autocomplete="off" placeholder="flow label" aria-label="Flow label"><button class="board-mini-btn" type="submit">Add flow</button></form>`:''}</div>${structureSvg(b,d)}<div class="board-principle">Collective model from student contributions — not a hidden reference architecture.</div></div></div>`}
function compareBoard(b,d){return `<div class="live-board" data-board="${esc(b.id)}" data-kind="compare">${boardHead(b)}<div class="live-board-body"><div class="compare-grid">${b.categories.map((c,i)=>`<div class="compare-item"><strong>${esc(c)}</strong><div class="compare-actions"><button type="button" data-compare="${i}" data-delta="-1">−</button><button type="button" data-compare="${i}" data-delta="1">+</button></div><div class="compare-count">${d.counts[c]||0}</div></div>`).join('')}</div><div class="board-principle">Commit first. Aggregate second. The majority is not the answer.</div></div></div>`}
function liveBoardBody(b){const d=boardData(b);return b.type==='capture'?captureBoard(b,d):b.type==='structure'?structureBoard(b,d):compareBoard(b,d)}
function workScreen(c){return `<div class="phase-kicker">WORK</div><div class="work-simple"><div class="work-simple-main"><h2>${esc(c.work.q)}</h2><p>${esc(c.work.copy)}</p><span class="work-time">Work target · ${esc(c.workTime)}</span></div><div class="work-deliverables">${c.work.items.map(x=>`<div class="work-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></div>`}
function takeawayBody(t){return `<div class="takeaway-text">${esc(t.text)}</div>${t.chain?`<div class="takeaway-chain" style="margin-top:9px">${t.chain.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}`}
function realityBody(r){if(!r)return '';let h='<div class="mini-reality">';if(r.kind==='examples')h+=`<div class="mini-metrics">${r.items.map(x=>`<div class="mini-metric"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(r.kind==='metrics'||r.kind==='tech')h+=`<div class="mini-metrics">${r.metrics.map(x=>`<div class="mini-metric"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(r.kind==='chain'||r.kind==='delta')h+=`<div class="mini-chain">${r.chain.map((x,i)=>`${i?'<b>→</b>':''}<span>${esc(x)}</span>`).join('')}</div>`;h+=`<p><strong>Interpret it:</strong> ${esc(r.question)}</p>`;if(r.sources)h+=`<div class="reality-source">Official sources: ${r.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</div>`;return h+'</div>'}
function restScreen(c){const r=c.rest,rv=revealState[stop]||{};const panel=rv.panel||null;const main=r.board?liveBoardBody(r.board):`<div class="no-board"><div class="phase-kicker">Compare your artifacts</div><h3>Architecture v1 → Architecture v2</h3><p>Keep both versions visible. The collective restitution is the design delta and its causal explanation, not a new class diagram.</p><div class="delta-row"><div class="delta-card"><b>v1</b><span>Original design under original assumptions</span></div><div class="delta-arrow">→</div><div class="delta-card"><b>v2</b><span>Structural change justified by the incident</span></div></div></div>`;return `<div class="phase-kicker">RESTITUTION</div><div class="restitution-grid"><div class="restitution-main">${main}</div><aside class="discussion-panel"><h3>Discuss</h3>${r.questions.map(q=>`<div class="discussion-q"><b>${esc(q[0])}</b><span>${esc(q[1])}</span></div>`).join('')}<div class="test-idea"><b>Test the idea</b><span>${esc(r.challenge)}</span></div><div class="reveal-actions"><button class="reveal-btn ${panel==='takeaway'?'active':''}" type="button" data-reveal="takeaway">${panel==='takeaway'?'Hide':'Show'} takeaway</button><button class="reveal-btn ${panel==='reality'?'active':''}" type="button" data-reveal="reality">${panel==='reality'?'Hide':'Show'} reality</button></div><div class="reveal-card takeaway ${panel==='takeaway'?'visible':''}"><b class="head">Takeaway</b>${takeawayBody(r.takeaway)}</div><div class="reveal-card reality ${panel==='reality'?'visible':''}"><b class="head">Reality check</b>${realityBody(r.reality)}</div></aside></div>`}
function renderProgress(){document.getElementById('stopProgress').innerHTML=checkpoints.map((c,i)=>`<button type="button" aria-label="${esc(c.label)} · ${esc(c.title)}" class="${i<stop?'visited':''} ${i===stop?'active':''}" data-jump="${i}"></button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{stop=+b.dataset.jump;mode='work';render()})}
function render(){const c=checkpoints[stop],hasRest=!!c.rest;if(mode==='rest'&&!hasRest)mode='work';scene.dataset.stop=stop;scene.classList.toggle('live-board-mode',mode==='rest'&&!!c.rest?.board);scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">${esc(c.label)} of 7 · ${mode==='work'?'Class work':'Class restitution'}</div><h1>${esc(c.title)}</h1></div><div><span class="mode-pill">${mode==='work'?'WORK':'RESTITUTION'}</span></div></div><div class="shell stage simple-stage ${mode==='rest'&&c.rest?.board?'live-board-stage':''}"><div class="phase-content">${mode==='work'?workScreen(c):restScreen(c)}</div></div>`;screenCount.textContent=`${stop+1}/7 · ${mode==='work'?'WORK':'RESTITUTION'}`;document.documentElement.style.setProperty('--accent',getComputedStyle(scene).getPropertyValue('--accent'));document.getElementById('backBtn').disabled=stop===0&&mode==='work';const btn=document.getElementById('advanceBtn');btn.textContent=mode==='work'?(hasRest?'Start restitution →':(stop===checkpoints.length-1?'Session complete':'Next activity →')):(stop===checkpoints.length-1?'Session complete':'Next activity →');renderProgress()}
function advance(){const c=checkpoints[stop];if(mode==='work'&&c.rest){mode='rest'}else if(stop<checkpoints.length-1){stop++;mode='work'}render()}
function back(){if(mode==='rest'){mode='work'}else if(stop>0){stop--;mode=checkpoints[stop].rest?'rest':'work'}render()}
scene.addEventListener('submit',e=>{const host=e.target.closest('.live-board');if(!host)return;e.preventDefault();const b=checkpoints[stop].rest?.board;if(!b)return;const d=boardData(b);if(e.target.matches('[data-capture-form]')){const v=(new FormData(e.target).get('idea')||'').trim();if(v&&!d.items.includes(v)){d.items.push(v);saveBoards();render()}}if(e.target.matches('[data-node-form]')){const v=(new FormData(e.target).get('node')||'').trim();if(v&&!d.nodes.includes(v)){d.nodes.push(v);saveBoards();render()}}if(e.target.matches('[data-edge-form]')){const f=new FormData(e.target),from=+f.get('from'),to=+f.get('to'),label=(f.get('label')||'').trim();if(Number.isInteger(from)&&Number.isInteger(to)&&from!==to){d.edges.push({from,to,label});saveBoards();render()}}});
scene.addEventListener('click',e=>{if(e.target.matches('[data-reveal]')){const k=e.target.dataset.reveal;revealState[stop]=revealState[stop]||{};revealState[stop].panel=revealState[stop].panel===k?null:k;render();return}const host=e.target.closest('.live-board');if(!host)return;const b=checkpoints[stop].rest?.board;if(!b)return;const d=boardData(b);if(e.target.matches('[data-capture-remove]')){d.items.splice(+e.target.dataset.captureRemove,1);saveBoards();render()}else if(e.target.matches('[data-compare]')){const cat=b.categories[+e.target.dataset.compare],delta=+e.target.dataset.delta;d.counts[cat]=Math.max(0,(d.counts[cat]||0)+delta);saveBoards();render()}else if(e.target.matches('[data-structure-undo]')){if(d.edges.length)d.edges.pop();else if(d.nodes.length){const gone=d.nodes.length-1;d.nodes.pop();d.edges=d.edges.filter(x=>x.from!==gone&&x.to!==gone)}saveBoards();render()}else if(e.target.matches('[data-board-reset]')){if(confirm('Clear this class board?')){delete boardState[b.id];saveBoards();render()}}});
document.getElementById('advanceBtn').onclick=advance;document.getElementById('backBtn').onclick=back;document.getElementById('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();advance()}else if(e.key==='ArrowLeft'){e.preventDefault();back()}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});render();

</script>
</body>
</html>
