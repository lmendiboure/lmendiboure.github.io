<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 1 Projector — IoT Systems Design</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 1 · Architecture & use cases</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":1,"activities":[{"title":"Map the IoT landscape","workTime":"6–7 min","stopTime":"6–7 min","work":{"question":"Map first. Define later.","support":"Select four connected physical systems from at least three domains, then mark the case that most challenges a simple IoT definition.","produce":["Four varied cases + one boundary-test case.","One short reason why that case challenges your definition."],"guardrail":"Do not turn this into a taxonomy quiz. The domain tags are scaffolding; the system boundary is the learning target."},"stop":{"question":"You tested several very different cases. What do you take away: what makes them feel like IoT — and where does that definition start to break?","complements":["The same systems skeleton can support monitoring, metering, tracking, remote control or automation; the purpose changes more than the underlying physical-to-digital logic.","Lifecycle concerns such as configuration, updates and asset management can matter even when the primary service is simple monitoring."],"probeTitle":"What stays common — and what actually changes?","probe":["Across monitoring, tracking, control and automation, what structure do you keep seeing?","When the service changes, which parts of the system change — and which do not?"]}},{"title":"Build a design baseline","workTime":"10–12 min","stopTime":"7–8 min","work":{"question":"Build a defensible baseline from responsibilities and flows.","support":"Use Case file 01. Separate known facts from assumptions, then draw only the responsibilities and labelled information flows your group can defend.","produce":["A baseline with at least three responsibilities/components and two labelled flows.","One component your group considers essential, with the responsibility it performs."],"guardrail":"A product or protocol name is not an architectural responsibility."},"stop":{"question":"You built several baselines. What do you take away: what was essential in every design, and what could vary?","complements":["Keep three questions separate: what responsibility exists, where it is deployed, and which product/technology implements it.","Responsibilities can move or be replicated across device, gateway and platform without changing the service they perform.","Identity, time, observability, configuration, updates and security cut across several responsibilities rather than forming one extra mandatory box."],"probeTitle":"Can you separate three different design questions?","probe":["What must the system do?","Where can that responsibility be placed?","Which product or technology could implement it?"]}},{"title":"From monitoring to control","workTime":"7–9 min","stopTime":"6–7 min","work":{"question":"What does the acknowledgement prove — and what is still missing?","support":"Follow one chain of evidence: command sent, digital acknowledgement returned, physical effect still to be established, operator authority still to place.","produce":["What the acknowledgement lets you claim — and what it does not.","The observation you would use to justify a claim about physical action."],"guardrail":"“Command sent” and “action performed” are different claims."},"stop":{"question":"You followed a command toward the physical world. What can an acknowledgement let you claim — and what can it not?","complements":["Distinguish controller state from physical state: an internal “open” flag is weaker evidence than an independent observation of the damper position or airflow.","A control design also needs an explicit response to missing or contradictory feedback: safe/default behaviour is part of the architecture, not only an implementation detail."],"probeTitle":"What would make the claim stronger?","probe":["What evidence would convince you that the physical world really changed?","Where should human authority appear if the operator must remain in control?"]}},{"title":"Expose communication requirements","workTime":"8–10 min","stopTime":"6–7 min","work":{"question":"Rank the system, then test one real flow.","support":"Choose the three communication constraints that dominate the campus design. Then repeat the ranking for one actual flow from your baseline.","produce":["A system Top 3 + a Top 3 for one named flow.","One difference between the rankings — or a reason they remain identical."],"guardrail":"A system-wide ranking is a summary, not a guarantee that every flow has the same priorities."},"stop":{"question":"You ranked the whole system, then one concrete flow. What changed — and why?","complements":["Latency and throughput are different quantities: a low-rate command may need low latency, while a camera can tolerate more delay but demand far more throughput.","Order of magnitude matters: periodic scalar sensing can be tiny compared with image traffic, even on the same campus.","Changing the energy source or payload can reorder the dominant requirements without changing the physical location."],"probeTitle":"Which requirements belong to the flow, and which belong to the whole system?","probe":["Which requirement became more important for your chosen flow?","Which system-wide priority remained important across several flows?"]}},{"title":"Discover network shapes","workTime":"7–8 min","stopTime":"","work":{"question":"Build a campus hypothesis, then identify what evidence could overturn it.","support":"Compare the five network shapes against the campus evidence. Keep one leading option and one alternative, then identify the missing site fact most likely to reverse your choice.","produce":["One leading option + one alternative.","The fact driving your choice + the missing fact most likely to change it."],"guardrail":"A shortlist is not a final technology choice. Do not force students through five reveal clicks."}},{"title":"Audit technology scope","workTime":"9–11 min","stopTime":"","work":{"question":"When you choose a technology family, what else comes with that choice?","support":"Take your leading option, your alternative and one contrasting family. For each, identify the infrastructure or stack commitment that comes with the technology name.","produce":["For three families: the extra infrastructure or stack commitment you inherit.","One hidden commitment that matters to your campus design."],"guardrail":"Do not turn this back into acronym recognition or fixed-range memorisation. These names sit at different abstraction levels."}},{"title":"Choose under constraints","workTime":"8–10 min","stopTime":"9–11 min","work":{"question":"Choose one fit. Then change the assumption that matters most.","support":"Commit one deployment choice, identify the assumption doing most of the work, then change that assumption and decide whether your choice still holds.","produce":["One deployment decision + its key assumption.","What happens to your choice when that assumption changes."],"guardrail":"A technology choice is conditional. “Not enough information” remains valid only when the missing fact is named."},"stop":{"question":"You chose a fit, then broke its key assumption. What survived — and what had to change?","complements":["The shortlisted names do not all sit at the same abstraction level: IEEE 802.15.4 is a PHY/MAC building block, while LoRaWAN and cellular IoT imply wider network infrastructure.","A mixed design can be more defensible than one universal technology when different flows have different constraints.","State the fact that could reverse the decision — coverage, power, traffic, latency or layout — so the choice has a visible validity domain."],"probeTitle":"What was really carrying your decision?","probe":["Which assumption did most of the work in your original choice?","When you changed the assumption, did that justify one family, a mixed design, or waiting for one missing fact?"]}},{"title":"Stress-test and revise","workTime":"9–11 min","stopTime":"7–8 min","work":{"question":"Start from the incident. What change does it actually justify?","support":"Choose one incident. Trace the assumption it breaks, what is affected first, which requirement comes under pressure, and the minimum design change that follows.","produce":["Incident → broken assumption → affected part/flow → requirement → design change.","The residual risk or new dependency that remains after the change."],"guardrail":"Do not pick a generic robustness pattern before diagnosing your own architecture. More components is not automatically more robust."},"stop":{"question":"You stress-tested your baseline with an incident. What is the smallest change you can now justify?","complements":["Robustness is always relative to a failure model and an acceptable degraded behaviour; “more components” is not automatically “more robust”.","A mitigation can create a new dependency or cost. Recording that residual risk prevents the revision from being presented as a universal fix.","The useful engineering artefact is the causal justification for the change, not a new architecture version number."],"probeTitle":"A fix is not the end of the reasoning.","probe":["What exactly does your change fix?","What new dependency, cost or residual risk does the change introduce?"]}}],"conclusion":{"title":"What we keep from Session 1","subtitle":"A defensible IoT design is a chain of justified decisions.","takeaways":["Start from the physical service and the responsibilities needed to sense, communicate, decide, act and observe — not from a favourite technology.","Communication choices only become meaningful once the flows, constraints and deployment assumptions are explicit.","A design is defensible only while its key assumptions hold; when evidence changes, revise the minimum necessary and keep the residual risk visible."],"modelLabel":"THE DESIGN LOGIC WE KEEP","model":["Service need","Responsibilities + flows","Requirements","Technology fit","Assumptions","Re-test"],"nextLabel":"NEXT","next":"We know what must communicate. How should these components actually exchange information?"}};</script><script src="../assets/projector.js"></script></body></html>
