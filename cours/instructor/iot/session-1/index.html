<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Session 1 Projector — IoT Systems Design</title><link href="../assets/projector.css" rel="stylesheet"/></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 1 · Architecture &amp; use cases</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":1,"activities":[{"title":"Map the IoT landscape","workTime":"5 min","stopTime":"5 min","work":{"question":"Map first. Define later.","support":"Select four contrasting connected physical systems, then mark the case that most challenges a simple IoT definition.","produce":["Four varied cases + one boundary-test case.","Be ready to explain why that case challenges your current definition."]},"stop":{"question":"You tested several very different cases. What do you take away: what makes them feel like IoT — and where does that definition start to break?","probeTitle":"What stays common — and what actually changes?","probe":["Across monitoring, tracking, control and automation, what structure keeps reappearing?","When the service changes, which parts of the system change — and which do not?"],"complements":["IoT is useful here as a systems lens linking physical entities to digital services through sensing/actuation, communication and computation.","The application domain changes, but recurring responsibilities and information flows let us compare very different systems."]}},{"title":"Build a design baseline","workTime":"8 min","stopTime":"6 min","work":{"question":"Build a defensible baseline from responsibilities and flows.","support":"Use the campus case file. Build only what you can defend from the evidence, then mark one unresolved assumption that could materially change the baseline.","produce":["At least three responsibilities/components and two labelled flows.","One unresolved assumption that remains open."]},"stop":{"question":"You built several baselines from the same service brief. What was essential in every design, what could vary — and which assumptions mattered most?","probeTitle":"Can you separate three different design questions?","probe":["What must the system do?","Where could that responsibility be placed, and which technology might later implement it?"],"complements":["Keep responsibility, placement and implementation separate: they are different design decisions.","Identity, time, observability, configuration, updates and security can cut across several responsibilities rather than becoming one extra mandatory box."]}},{"title":"From monitoring to control","workTime":"6 min","stopTime":"6 min","work":{"question":"What does the acknowledgement prove — and what is still missing?","support":"Follow one chain: command sent, digital acknowledgement returned, physical effect still to be established, operator authority still to place.","produce":["The strongest claim supported by the acknowledgement — and what it cannot prove.","The physical observation needed to close the claim + where operator override belongs."]},"stop":{"question":"You followed a command toward the physical world. What can an acknowledgement let you claim — and what can it not?","probeTitle":"What would make the claim stronger?","probe":["What evidence would convince you that the physical world really changed?","Where should human authority appear if the operator must remain in control?"],"complements":["Controller state and physical state are different evidence: an internal “open” flag is weaker than an independent observation of damper position or airflow.","A control architecture also needs a response to missing or contradictory feedback."]}},{"title":"Expose communication requirements","workTime":"6 min","stopTime":"5 min","work":{"question":"Rank the system, then test one real flow.","support":"Choose the three communication constraints that dominate the campus design, then repeat the ranking for one actual flow from your baseline.","produce":["A system Top 3 + a Top 3 for one named flow.","One difference between the rankings — or a reason they remain identical."]},"stop":{"question":"You ranked the whole system, then one concrete flow. What changed — and why?","probeTitle":"Which requirements belong to the flow, and which belong to the whole system?","probe":["Which requirement became more important for your chosen flow?","Which system-wide priority stayed important across several flows?"],"complements":["Latency and throughput are different quantities: a low-rate command may need low latency, while image traffic may tolerate more delay but demand much more throughput.","Changing payload, power source or physical location can reorder the dominant requirements without changing the overall service."]}},{"title":"Compare communication technologies","workTime":"10 min","stopTime":"7 min","work":{"question":"Use the same deployment facts to compare the five communication families.","support":"Read the comparison map, then try a few concrete deployments. There is no hidden method: distance/context, traffic, device constraints and infrastructure are the four questions to keep.","produce":["At least three concrete cases with a technology choice.","For each case, one deployment fact that explains the fit."]},"stop":{"question":"Now that you have tried the cases, what actually distinguishes these five communication families?","probeTitle":"Read the comparison by deployment consequence — not by brand familiarity.","probe":["Which families depend mainly on local infrastructure? Which rely on gateways or operator infrastructure?","Which families are natural for richer traffic, and which are designed for small/infrequent constrained-device traffic?"],"complements":["The useful comparison is qualitative: traffic, energy/device constraints, topology and infrastructure dependency. Avoid memorising one fixed “range” number.","IEEE 802.15.4 is mainly a lower-layer building block; LoRaWAN and cellular IoT already imply a wider network architecture."],"visual":{"kicker":"AFTER THE CASES · REFERENCE COMPARISON","title":"Same four questions for every family","table":{"columns":["Family","Typical relationship","Traffic / device profile","Infrastructure / dependency","Strong fit when…"],"rows":[{"cells":["Wi-Fi","device ↔ access point ↔ IP network","richer traffic; usually less energy-constrained","local WLAN / APs","managed WLAN exists or higher traffic matters"]},{"cells":["Bluetooth LE","device ↔ nearby peer / phone / gateway","low-energy, nearby devices","nearby peer, phone or gateway","battery device communicates locally to something nearby"]},{"cells":["IEEE 802.15.4","device ↔ low-power local network; upper stack still needed","small local traffic; constrained nodes","border router / upper networking stack depends on design","low-power local sensing/control is needed"]},{"cells":["LoRaWAN","end device → gateway(s) → network server → application","tiny / infrequent traffic; low power","gateways + network server / service","wide-area low-rate sensing with gateway coverage"]},{"cells":["NB-IoT / LTE-M","device → base station → operator network → application","IoT traffic over managed cellular access","operator coverage + subscription/service","sites are distributed and local access infrastructure is undesirable"]}],"note":"These are design tendencies, not fixed range guarantees. Environment, variant and deployment still matter."},"callout":"A technology choice is really an architecture + infrastructure choice, not just a radio name."}}},{"title":"Return to the campus decision","workTime":"7 min","stopTime":"7 min","work":{"question":"What can we defend for the campus with the information we actually have?","support":"Do not solve another transfer case. Choose only a campus position — one family, a mixed design, or not enough evidence yet — then name the missing deployment fact that could still change it.","produce":["One campus position.","One missing fact that could still change that position."]},"stop":{"question":"What can we defend for this campus now — and what do we still need to measure or verify?","probeTitle":"Separate the decision from the missing evidence.","probe":["Which part of the campus brief supports your position?","Which missing fact would you check first before procurement?"],"complements":["A mixed design can be more defensible than forcing one access family onto links with different constraints.","“Not enough information yet” is an engineering position only when the missing information is named explicitly."]}}],"conclusion":{"title":"What we keep from Session 1","subtitle":"A communication technology is the end of a reasoning chain, not the starting point.","takeaways":["Start from the physical service and explicit responsibilities/flows, not from a favourite technology.","Communication choices become meaningful only after the requirements of the actual flows are explicit.","There is no universal winner: distance, traffic, device constraints and available infrastructure determine which family is a good fit."],"modelLabel":"THE DESIGN LOGIC WE KEEP","model":["Service need","Responsibilities + flows","Per-flow requirements","Compare technologies","Campus facts","Defended choice"],"nextLabel":"NEXT","next":"We have defended a communication path. How should components exchange messages through that path?"},"recap":{"title":"Session 1 — the system we are designing","subtitle":"Keep this picture in mind for the rest of the course: an IoT system connects a physical situation to digital services through devices, communication and computation. The boxes can change; the responsibilities and flows are what matter.","resumeActivity":5,"definition":{"title":"IoT = a physical service supported by connected sensing, communication, computation and sometimes actuation.","text":"It is not simply ‘an object on the Internet’. The purpose is to observe, understand, alert, optimise or act on a real-world situation."},"useCases":["monitoring","metering","tracking","alerting","automation","control","predictive maintenance","energy optimisation"],"architecture":[{"badge":"P","level":"Physical world","equipment":"room · machine · person · door · air · energy flow","roles":["phenomenon to observe","effect to influence"]},{"badge":"D","level":"Field devices","equipment":"sensor · actuator · meter · camera · badge reader","roles":["sense / measure","act locally","expose device state"],"linkFromPrevious":"↔","linkLabel":"measure / act"},{"badge":"G","level":"Gateway / local node","equipment":"gateway · access point · building controller · edge box","roles":["relay / connect","aggregate / buffer","translate / local logic"],"linkFromPrevious":"↔","linkLabel":"telemetry / commands"},{"badge":"S","level":"Digital services","equipment":"dashboard · historian · alerting · automation · analytics","roles":["store / analyse","alert / coordinate","manage devices"],"linkFromPrevious":"↔","linkLabel":"data / control / management"},{"badge":"U","level":"People / operations","equipment":"occupant · operator · maintenance · owner","roles":["interpret / decide","override / configure","maintain / improve"],"linkFromPrevious":"↔","linkLabel":"information / actions"}],"architectureNote":"Typical flows include telemetry, commands, acknowledgements, physical-state feedback and configuration. The gateway/local node is optional: some devices connect directly to services, while other deployments contain several local/edge tiers.","responsibilityRows":[{"label":"Sense & act","where":"mostly field devices","text":"Measurements and physical actions happen close to the phenomenon."},{"label":"Filter, aggregate, translate","where":"device ↔ gateway ↔ service","text":"These functions can move depending on energy, bandwidth, latency and available compute."},{"label":"Decide / control","where":"device ↔ gateway ↔ service","text":"Fast or autonomous control may stay local; global optimisation may be remote."},{"label":"Store, analyse, visualise","where":"local cache ↔ remote history","text":"Short-term state can stay local while long-term history and analytics live remotely."}],"blocks":[{"title":"Architecture before products","points":["First identify the service, responsibilities and flows; only then attach implementation choices."]},{"title":"Message received ≠ physical effect achieved","points":["Commands, acknowledgements and independent physical feedback are different evidence."]},{"title":"Requirements belong to flows","points":["Latency, data volume, range, energy and infrastructure can differ from one flow to another."]}],"chainLabel":"THE REASONING CHAIN ALREADY BUILT","chain":["service need","responsibilities + flows","monitoring / control evidence","per-flow communication requirements"],"focus":"TODAY · Use the requirements we already identified to compare Wi-Fi, Bluetooth LE, IEEE 802.15.4, LoRaWAN and cellular IoT.","crossCutting":"Identity, security, time, configuration, software updates and device management cut across several levels rather than belonging to one mandatory box."}};</script><script src="../assets/projector.js"></script></body></html>
