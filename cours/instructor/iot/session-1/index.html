<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Session 1 Projector — IoT Systems Design</title><link href="../assets/projector.css" rel="stylesheet"/></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 1 · Architecture &amp; use cases</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":1,"activities":[{"title":"Map the IoT landscape","workTime":"5 min","stopTime":"5 min","work":{"question":"Map first. Define later.","support":"Select four contrasting connected physical systems, then mark the case that most challenges a simple IoT definition.","produce":["Four varied cases + one boundary-test case.","Be ready to explain why that case challenges your current definition."]},"stop":{"question":"You tested several very different cases. What do you take away: what makes them feel like IoT — and where does that definition start to break?","probeTitle":"What stays common — and what actually changes?","probe":["Across monitoring, tracking, control and automation, what structure keeps reappearing?","When the service changes, which parts of the system change — and which do not?"],"complements":["IoT is useful here as a systems lens linking physical entities to digital services through sensing/actuation, communication and computation.","The application domain changes, but recurring responsibilities and information flows let us compare very different systems."]}},{"title":"Build a design baseline","workTime":"8 min","stopTime":"6 min","work":{"question":"Build a defensible baseline from responsibilities and flows.","support":"Use the campus case file. Build only what you can defend from the evidence, then mark one unresolved assumption that could materially change the baseline.","produce":["At least three responsibilities/components and two labelled flows.","One unresolved assumption that remains open."]},"stop":{"question":"You built several baselines from the same service brief. What was essential in every design, what could vary — and which assumptions mattered most?","probeTitle":"Can you separate three different design questions?","probe":["What must the system do?","Where could that responsibility be placed, and which technology might later implement it?"],"complements":["Keep responsibility, placement and implementation separate: they are different design decisions.","Identity, time, observability, configuration, updates and security can cut across several responsibilities rather than becoming one extra mandatory box."]}},{"title":"From monitoring to control","workTime":"6 min","stopTime":"6 min","work":{"question":"What does the acknowledgement prove — and what is still missing?","support":"Follow one chain: command sent, digital acknowledgement returned, physical effect still to be established, operator authority still to place.","produce":["The strongest claim supported by the acknowledgement — and what it cannot prove.","The physical observation needed to close the claim + where operator override belongs."]},"stop":{"question":"You followed a command toward the physical world. What can an acknowledgement let you claim — and what can it not?","probeTitle":"What would make the claim stronger?","probe":["What evidence would convince you that the physical world really changed?","Where should human authority appear if the operator must remain in control?"],"complements":["Controller state and physical state are different evidence: an internal “open” flag is weaker than an independent observation of damper position or airflow.","A control architecture also needs a response to missing or contradictory feedback."]}},{"title":"Expose communication requirements","workTime":"6 min","stopTime":"5 min","work":{"question":"Rank the system, then test one real flow.","support":"Choose the three communication constraints that dominate the campus design, then repeat the ranking for one actual flow from your baseline.","produce":["A system Top 3 + a Top 3 for one named flow.","One difference between the rankings — or a reason they remain identical."]},"stop":{"question":"You ranked the whole system, then one concrete flow. What changed — and why?","probeTitle":"Which requirements belong to the flow, and which belong to the whole system?","probe":["Which requirement became more important for your chosen flow?","Which system-wide priority stayed important across several flows?"],"complements":["Latency and throughput are different quantities: a low-rate command may need low latency, while image traffic may tolerate more delay but demand much more throughput.","Changing payload, power source or physical location can reorder the dominant requirements without changing the overall service."]}},{"title":"From network shape to technology","workTime":"12 min","stopTime":"","work":{"question":"How can we satisfy the communication requirements we already established?","support":"First compare possible network structures against the known requirements and deployment evidence. Only after that, reveal the candidate technology families and audit what each name actually commits the design to.","produce":["One leading network structure + one challenger + the fact driving the ranking + the missing fact that could overturn it.","For the linked technology candidates: the infrastructure, ownership or stack commitment hidden behind each name."]}},{"title":"Defend the campus communication strategy","workTime":"8 min","stopTime":"8 min","work":{"question":"Test one choice, then return to the campus decision.","support":"Commit one transfer-case choice, flip the assumption doing most of the work, then return to campus: one family, a mixed design, or not enough evidence yet?","produce":["One transfer decision + its key assumption + what happens after that assumption changes.","One campus stance + the missing fact that could still reverse it."]},"stop":{"question":"You tested a choice, challenged its key assumption, then returned to campus. What can we defend now — and what evidence could still make us change that choice?","probeTitle":"What is your decision actually conditional on?","probe":["Which assumption carried most of your original choice?","Does one family really fit every flow, or is a mixed design / insufficient evidence more defensible?"],"complements":["The candidate names do not all sit at the same abstraction level: IEEE 802.15.4 is a PHY/MAC building block, while LoRaWAN and cellular IoT imply wider network infrastructure.","A defensible choice names the fact that could reverse it — coverage, power, traffic, latency or layout — so its validity domain remains visible."]}}],"conclusion":{"title":"What we keep from Session 1","subtitle":"A communication technology is the end of a reasoning chain, not the starting point.","takeaways":["Start from the physical service and explicit responsibilities/flows, not from a favourite technology.","Communication choices become meaningful only after per-flow constraints and network structure are explicit.","A technology decision is conditional: infrastructure, ownership and missing deployment evidence can still change the answer."],"modelLabel":"THE DESIGN LOGIC WE KEEP","model":["Service need","Responsibilities + flows","Requirements","Network shape","Technology family","Validity domain"],"nextLabel":"NEXT","next":"We have defended a communication path. How should components exchange messages through that path?"},"recap":{"title":"What we already know from Session 1","subtitle":"This is the shared starting point for today. These are the ideas already established — not a quiz and not the next activity.","resumeActivity":5,"blocks":[{"label":"1 · Model the system before choosing technology","title":"A useful IoT design makes responsibilities and information flows explicit.","points":["The service tells us what must be sensed, decided, stored, communicated or acted on; products and protocols come later.","Responsibilities, placement and implementation are different design decisions, and unresolved assumptions should remain visible."]},{"label":"2 · Digital evidence and physical evidence are different","title":"A message or acknowledgement can prove communication without proving that the physical world changed.","points":["Telemetry, commands, acknowledgements and physical-state feedback are different flows with different meanings.","For control, a convincing claim needs evidence of the resulting physical state and any required human authority."]},{"label":"3 · Communication requirements belong to concrete flows","title":"Different flows can require different latency, range, throughput, energy or infrastructure properties.","points":["A low-rate command can still be latency-sensitive; a measurement stream may tolerate delay but carry more data.","That is why we characterised real flows before discussing how to connect them."]}],"chainLabel":"WHAT WE HAVE ALREADY ESTABLISHED","chain":["Service need","Responsibilities + flows","Control evidence","Per-flow requirements"],"focus":"TODAY · How can we satisfy those communication requirements?"}};</script><script src="../assets/projector.js"></script></body></html>
