<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 1 Projector — IoT Systems Design</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 1 · Projector</small></div><div class="progress" id="progress"></div><div class="top-actions"><a class="btn optional" href="notes.html">Notes</a><a class="btn optional" href="../../../iot/session-1/">Student</a><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":1,"activities":[{"title":"Map the IoT landscape","workTime":"6–7 min","stopTime":"6–7 min","work":{"question":"Map first. Define later.","support":"Select four connected physical systems from at least three domains, then mark the case that most challenges a simple IoT definition.","produce":["Four varied cases + one boundary-test case.","One short reason why that case challenges your definition."],"guardrail":"Do not turn this into a taxonomy quiz. The domain tags are scaffolding; the system boundary is the learning target."},"stop":{"question":"Where did groups classify the same case differently — and why?","compare":"Use two or three student artefacts first. Resolve one disagreement or boundary before revealing the complementary anchor.","complements":["The same systems skeleton can support monitoring, metering, tracking, remote control or automation; the purpose changes more than the underlying physical-to-digital logic.","Lifecycle concerns such as configuration, updates and asset management can matter even when the primary service is simple monitoring."]}},{"title":"Build a design baseline","workTime":"10–12 min","stopTime":"7–8 min","work":{"question":"Build a defensible baseline from responsibilities and flows.","support":"Use Case file 01. Separate known facts from assumptions, then draw only the responsibilities and labelled information flows your group can defend.","produce":["A baseline with at least three responsibilities/components and two labelled flows.","One component your group considers essential, with the responsibility it performs."],"guardrail":"A product or protocol name is not an architectural responsibility."},"stop":{"question":"What did groups mean by “component”? Function, physical box, product — or a mixture?","compare":"Use two or three student artefacts first. Resolve one disagreement or boundary before revealing the complementary anchor.","complements":["Keep three questions separate: what responsibility exists, where it is deployed, and which product/technology implements it.","Responsibilities can move or be replicated across device, gateway and platform without changing the service they perform.","Identity, time, observability, configuration, updates and security cut across several responsibilities rather than forming one extra mandatory box."]}},{"title":"From monitoring to control","workTime":"7–9 min","stopTime":"6–7 min","work":{"question":"Close the evidence gap, then audit its boundaries.","support":"Follow the command chain one claim at a time: command sent, digital acknowledgement returned, physical effect still to be established, operator authority still to place.","produce":["Your decisions on acknowledgement, physical-state evidence and operator authority.","The observation you would use to justify a claim about physical action."],"guardrail":"“Command sent” and “action performed” are different claims."},"stop":{"question":"Which groups added acknowledgement, state feedback, or both?","compare":"Use two or three student artefacts first. Resolve one disagreement or boundary before revealing the complementary anchor.","complements":["Distinguish controller state from physical state: an internal “open” flag is weaker evidence than an independent observation of the damper position or airflow.","A control design also needs an explicit response to missing or contradictory feedback: safe/default behaviour is part of the architecture, not only an implementation detail."]}},{"title":"Expose communication requirements","workTime":"8–10 min","stopTime":"6–7 min","work":{"question":"Rank the system, then test one real flow.","support":"Choose the three communication constraints that dominate the campus design. Then repeat the ranking for one actual flow from your baseline.","produce":["A system Top 3 + a Top 3 for one named flow.","One difference between the rankings — or a reason they remain identical."],"guardrail":"A system-wide ranking is a summary, not a guarantee that every flow has the same priorities."},"stop":{"question":"What changed when groups moved from the system Top 3 to one specific flow?","compare":"Use two or three student artefacts first. Resolve one disagreement or boundary before revealing the complementary anchor.","complements":["Latency and throughput are different quantities: a low-rate command may need low latency, while a camera can tolerate more delay but demand far more throughput.","Order of magnitude matters: periodic scalar sensing can be tiny compared with image traffic, even on the same campus.","Changing the energy source or payload can reorder the dominant requirements without changing the physical location."]}},{"title":"Discover network shapes","workTime":"7–8 min","stopTime":"","work":{"question":"Build a campus hypothesis, then identify how it could be falsified.","support":"Compare the five network shapes against the campus evidence. Keep one leading hypothesis and one challenger, then identify what missing site fact could reverse the ranking.","produce":["One leading network-shape hypothesis + one challenger.","The current deciding fact + the missing fact most likely to change your choice."],"guardrail":"A shortlist is not a final technology choice. Do not force students through five reveal clicks."}},{"title":"Audit technology scope","workTime":"9–11 min","stopTime":"","work":{"question":"What else are you choosing when you choose the technology name?","support":"Audit your leading hypothesis, your challenger and one contrasting family. For each, identify the architectural commitment that comes with the technology name.","produce":["Three technology-scope audits.","One hidden infrastructure or stack commitment that matters to your campus design."],"guardrail":"Do not turn this back into acronym recognition or fixed-range memorisation. These names sit at different abstraction levels."}},{"title":"Choose under constraints","workTime":"8–10 min","stopTime":"9–11 min","work":{"question":"Commit one fit, then break its decisive assumption.","support":"Commit one deployment choice, identify the assumption doing most of the work, then invert that assumption and decide whether the choice still holds.","produce":["One deployment decision + its decisive assumption.","A counterfactual judgement and the resulting campus position."],"guardrail":"A technology choice is conditional. “Not enough information” remains valid only when the missing fact is named."},"stop":{"question":"Why did some groups accept one family while others preferred a mixed design or withheld a decision?","compare":"Use two or three student artefacts first. Resolve one disagreement or boundary before revealing the complementary anchor.","complements":["The shortlisted names do not all sit at the same abstraction level: IEEE 802.15.4 is a PHY/MAC building block, while LoRaWAN and cellular IoT imply wider network infrastructure.","A mixed design can be more defensible than one universal technology when different flows have different constraints.","State the fact that could reverse the decision — coverage, power, traffic, latency or layout — so the choice has a visible validity domain."]}},{"title":"Stress-test and revise","workTime":"9–11 min","stopTime":"7–8 min","work":{"question":"Diagnose the baseline first. Record the justified change second.","support":"Choose one incident. Trace what assumption it breaks, which scope is hit first, which requirement comes under pressure, and what minimum design change follows.","produce":["Incident → assumption → affected scope → requirement → design change.","The residual risk or new dependency that remains after the change."],"guardrail":"Do not pick a generic robustness pattern before diagnosing your own architecture. More components is not automatically more robust."},"stop":{"question":"What structural change is justified relative to the defended baseline?","compare":"Use two or three student artefacts first. Resolve one disagreement or boundary before revealing the complementary anchor.","complements":["Robustness is always relative to a failure model and an acceptable degraded behaviour; “more components” is not automatically “more robust”.","A mitigation can create a new dependency or cost. Recording that residual risk prevents the revision from being presented as a universal fix.","The useful engineering artefact is the causal justification for the change, not a new architecture version number."]}}]};</script><script src="../assets/projector.js"></script></body></html>
