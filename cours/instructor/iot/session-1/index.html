<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"/><meta content="width=device-width,initial-scale=1" name="viewport"/><title>Session 1 Projector — IoT Systems Design</title><link href="../assets/projector.css" rel="stylesheet"/></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 1 · Architecture &amp; use cases</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":1,"activities":[{"title":"Map the IoT landscape","workTime":"5 min","stopTime":"5 min","work":{"question":"Map first. Define later.","support":"Select four contrasting connected physical systems, then mark the case that most challenges a simple IoT definition.","produce":["Four varied cases + one boundary-test case.","Be ready to explain why that case challenges your current definition."]},"stop":{"question":"You tested several very different cases. What do you take away: what makes them feel like IoT \u2014 and where does that definition start to break?","probeTitle":"What stays common \u2014 and what actually changes?","probe":["Across monitoring, tracking, control and automation, what structure keeps reappearing?","When the service changes, which parts of the system change \u2014 and which do not?"],"complements":["IoT is useful here as a systems lens linking physical entities to digital services through sensing/actuation, communication and computation.","The application domain changes, but recurring responsibilities and information flows let us compare very different systems."]}},{"title":"Build a design baseline","workTime":"8 min","stopTime":"6 min","work":{"question":"Build a defensible baseline from responsibilities and flows.","support":"Use the campus case file. Build only what you can defend from the evidence, then mark one unresolved assumption that could materially change the baseline.","produce":["At least three responsibilities/components and two labelled flows.","One unresolved assumption that remains open."]},"stop":{"question":"You built several baselines from the same service brief. What was essential in every design, what could vary \u2014 and which assumptions mattered most?","probeTitle":"Can you separate three different design questions?","probe":["What must the system do?","Where could that responsibility be placed, and which technology might later implement it?"],"complements":["Keep responsibility, placement and implementation separate: they are different design decisions.","Identity, time, observability, configuration, updates and security can cut across several responsibilities rather than becoming one extra mandatory box."]}},{"title":"From monitoring to control","workTime":"6 min","stopTime":"6 min","work":{"question":"What does the acknowledgement prove \u2014 and what is still missing?","support":"Follow one chain: command sent, digital acknowledgement returned, physical effect still to be established, operator authority still to place.","produce":["The strongest claim supported by the acknowledgement \u2014 and what it cannot prove.","The physical observation needed to close the claim + where operator override belongs."]},"stop":{"question":"You followed a command toward the physical world. What can an acknowledgement let you claim \u2014 and what can it not?","probeTitle":"What would make the claim stronger?","probe":["What evidence would convince you that the physical world really changed?","Where should human authority appear if the operator must remain in control?"],"complements":["Controller state and physical state are different evidence: an internal \u201copen\u201d flag is weaker than an independent observation of damper position or airflow.","A control architecture also needs a response to missing or contradictory feedback."]}},{"title":"Expose communication requirements","workTime":"6 min","stopTime":"5 min","work":{"question":"Rank the system, then test one real flow.","support":"Choose the three communication constraints that dominate the campus design, then repeat the ranking for one actual flow from your baseline.","produce":["A system Top 3 + a Top 3 for one named flow.","One difference between the rankings \u2014 or a reason they remain identical."]},"stop":{"question":"You ranked the whole system, then one concrete flow. What changed \u2014 and why?","probeTitle":"Which requirements belong to the flow, and which belong to the whole system?","probe":["Which requirement became more important for your chosen flow?","Which system-wide priority stayed important across several flows?"],"complements":["Latency and throughput are different quantities: a low-rate command may need low latency, while image traffic may tolerate more delay but demand much more throughput.","Changing payload, power source or physical location can reorder the dominant requirements without changing the overall service."]}},{"title":"Compare communication technologies","workTime":"10 min","stopTime":"","work":{"question":"How do Wi-Fi, Bluetooth LE, IEEE 802.15.4, LoRaWAN and cellular IoT differ in practice?","support":"Use one simple comparison map: who talks to whom, distance/context, traffic, device constraints and required infrastructure. Then apply the map to any three concrete deployment cases.","produce":["A clear reading of what each of the five families implies architecturally.","Technology choices for any three concrete cases, justified from the deployment facts."]}},{"title":"Defend the campus communication strategy","workTime":"8 min","stopTime":"8 min","work":{"question":"Choose for one case, change one important fact, then return to the campus decision.","support":"Choose one deployment case, identify the fact that matters most, change that fact, then return to campus: one family, a mixed design, or not enough information yet?","produce":["One deployment decision + the fact that mattered most + what happens when that fact changes.","One campus stance + the missing fact that could still reverse it."]},"stop":{"question":"You made a choice, changed one important fact, then returned to campus. What can we defend now \u2014 and what information could still make us change that choice?","probeTitle":"Which facts does your decision depend on?","probe":["Which fact mattered most in your original choice?","Does one family really fit every flow, or is a mixed design / insufficient evidence more defensible?"],"complements":["The candidate names do not all sit at the same abstraction level: IEEE 802.15.4 is a PHY/MAC building block, while LoRaWAN and cellular IoT imply wider network infrastructure.","A defensible choice says which facts matter \u2014 coverage, power, traffic, latency or layout \u2014 and what would make the answer change."]}}],"conclusion":{"title":"What we keep from Session 1","subtitle":"A communication technology is the end of a reasoning chain, not the starting point.","takeaways":["Start from the physical service and explicit responsibilities/flows, not from a favourite technology.","Communication choices become meaningful only after the requirements of the actual flows are explicit.","There is no universal winner: distance, traffic, device constraints and available infrastructure determine which family is a good fit."],"modelLabel":"THE DESIGN LOGIC WE KEEP","model":["Service need","Responsibilities + flows","Requirements","Compare technologies","Deployment facts","Defended choice"],"nextLabel":"NEXT","next":"We have defended a communication path. How should components exchange messages through that path?"},"recap":{"title":"Session 1 \u2014 the system we are designing","subtitle":"Keep this picture in mind for the rest of the course: an IoT system connects a physical situation to digital services through devices, communication and computation. The boxes can change; the responsibilities and flows are what matter.","resumeActivity":5,"definition":{"title":"IoT = a physical service supported by connected sensing, communication, computation and sometimes actuation.","text":"It is not simply \u2018an object on the Internet\u2019. The purpose is to observe, understand, alert, optimise or act on a real-world situation."},"useCases":["monitoring","metering","tracking","alerting","automation","control","predictive maintenance","energy optimisation"],"architecture":[{"badge":"P","level":"Physical world","equipment":"room \u00b7 machine \u00b7 person \u00b7 door \u00b7 air \u00b7 energy flow","roles":["phenomenon to observe","effect to influence"]},{"badge":"D","level":"Field devices","equipment":"sensor \u00b7 actuator \u00b7 meter \u00b7 camera \u00b7 badge reader","roles":["sense / measure","act locally","expose device state"],"linkFromPrevious":"\u2194","linkLabel":"measure / act"},{"badge":"G","level":"Gateway / local node","equipment":"gateway \u00b7 access point \u00b7 building controller \u00b7 edge box","roles":["relay / connect","aggregate / buffer","translate / local logic"],"linkFromPrevious":"\u2194","linkLabel":"telemetry / commands"},{"badge":"S","level":"Digital services","equipment":"dashboard \u00b7 historian \u00b7 alerting \u00b7 automation \u00b7 analytics","roles":["store / analyse","alert / coordinate","manage devices"],"linkFromPrevious":"\u2194","linkLabel":"data / control / management"},{"badge":"U","level":"People / operations","equipment":"occupant \u00b7 operator \u00b7 maintenance \u00b7 owner","roles":["interpret / decide","override / configure","maintain / improve"],"linkFromPrevious":"\u2194","linkLabel":"information / actions"}],"architectureNote":"Typical flows include telemetry, commands, acknowledgements, physical-state feedback and configuration. The gateway/local node is optional: some devices connect directly to services, while other deployments contain several local/edge tiers.","responsibilityRows":[{"label":"Sense & act","where":"mostly field devices","text":"Measurements and physical actions happen close to the phenomenon."},{"label":"Filter, aggregate, translate","where":"device \u2194 gateway \u2194 service","text":"These functions can move depending on energy, bandwidth, latency and available compute."},{"label":"Decide / control","where":"device \u2194 gateway \u2194 service","text":"Fast or autonomous control may stay local; global optimisation may be remote."},{"label":"Store, analyse, visualise","where":"local cache \u2194 remote history","text":"Short-term state can stay local while long-term history and analytics live remotely."}],"blocks":[{"title":"Architecture before products","points":["First identify the service, responsibilities and flows; only then attach implementation choices."]},{"title":"Message received \u2260 physical effect achieved","points":["Commands, acknowledgements and independent physical feedback are different evidence."]},{"title":"Requirements belong to flows","points":["Latency, data volume, range, energy and infrastructure can differ from one flow to another."]}],"chainLabel":"THE REASONING CHAIN ALREADY BUILT","chain":["service need","responsibilities + flows","monitoring / control evidence","per-flow communication requirements"],"focus":"TODAY \u00b7 Use the requirements we already identified to compare Wi-Fi, Bluetooth LE, IEEE 802.15.4, LoRaWAN and cellular IoT.","crossCutting":"Identity, security, time, configuration, software updates and device management cut across several levels rather than belonging to one mandatory box."}};</script><script src="../assets/projector.js"></script></body></html>
