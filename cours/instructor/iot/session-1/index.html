<script>

const checkpoints=[
{label:'Activity 1',title:'Map the IoT landscape',workTime:'6–7 min',restTime:'6–7 min',next:'Build architecture v1',work:{q:'Map first. Define later.',copy:'Classify the eight connected physical systems. Use one main domain and an optional second domain when the boundary is genuinely ambiguous.',items:[['OUTPUT','Eight classified cases with a defensible primary domain.'],['BE READY TO DEFEND','One case that could reasonably belong to two domains.'],['GUARDRAIL','Do not search for an IoT definition yet. Use the systems in front of you.']]},rest:{board:{id:'landscape-capture',type:'capture',title:'Class board · What repeats across the cases?',prompt:'Add only short recurring features after groups have committed.',placeholder:'e.g. physical entity'},questions:[['COMPARE','Where did groups classify the same case differently — and why?'],['LOOK ACROSS CASES','What repeats even when the application domain changes?'],['BOUNDARY','Is “connected” alone enough to call something IoT?']],challenge:'A Raspberry Pi hosts a normal web page but senses or controls nothing in the physical world. Would you call that IoT?',takeaway:{text:'IoT is a systems field connecting physical entities to digital services through communication and computation. The application domain is not the defining boundary.',chain:['physical world','sense / act','communicate','digital service'],reference:[['Common system purposes',['monitoring / sensing','metering','tracking / localisation','remote control']],['Automation',['closed-loop control','safety / alerting','optimisation / coordination']],['Lifecycle',['asset management','predictive maintenance','configuration / updates']]]},reality:{kind:'examples',items:[['Cold chain','condition → history / alert'],['Smart metering','consumption → monitoring / operation'],['Industrial monitoring','machine condition → maintenance']],question:'Same skeleton, different domain: what is invariant, and what can change completely?'}}},
{label:'Activity 2',title:'Build architecture v1',workTime:'10–12 min',restTime:'7–8 min',next:'Close the loop',work:{q:'Build Architecture v1 from responsibilities and flows.',copy:'Use Case file 01. Separate dossier facts from assumptions, then draw only the responsibilities and information flows you can justify.',items:[['OUTPUT','A readable end-to-end Architecture v1 with labelled flows.'],['BE READY TO DEFEND','One essential component and the responsibility it performs.'],['GUARDRAIL','A product or protocol name is not an architectural responsibility.']]},rest:{board:{id:'architecture-structure',type:'structure',title:'Class architecture · Build the minimum model the room can justify',prompt:'Add 4–6 boxes, then connect only information flows that groups can name.',placeholder:'e.g. Sensors'},questions:[['COMPARE','What did groups mean by “component”? Function, physical box, product — or a mixture?'],['COUNT TWO WAYS','How many responsibilities exist? How many physical devices?'],['FOLLOW THE DATA','Which labelled flows expose dependencies that boxes alone hide?']],challenge:'One Raspberry Pi senses, stores, computes and serves the dashboard. How many responsibilities exist — and how many physical boxes?',takeaway:{text:'Separate responsibilities before products. The five-role lens is a reasoning tool, not a mandatory five-box architecture.',chain:['Sense / Act','Communicate','Compute','Store','Use'],reference:[['Physical',['sensor','actuator']],['Device / local',['acquisition','local processing','temporary storage']],['Communication',['link / interface','router / gateway','upstream connectivity']],['Platform',['ingestion','rules / processing','persistent storage']],['Application',['API','dashboard','alerts','external systems']],['Cross-cutting',['identity','configuration','time','observability','lifecycle / updates','security']]]},reality:{kind:'chain',chain:['30 measurement points','Campus communication','Ingest / compute','Time-series store','Dashboard / alerts'],question:'One defensible design, not “the answer”: which boxes could merge, move or replicate while preserving the service?'}}},
{label:'Activity 3',title:'Close the loop',workTime:'7–9 min',restTime:'6–7 min',next:'Expose communication requirements',work:{q:'Close the evidence gap, then audit its boundaries.',copy:'Students see the known forward path measurement → decision → command → actuator, but the evidence after actuation is deliberately unresolved. They must choose what closes the physical loop, then separate ACK scope from physical evidence and place human override authority.',items:[['OUTPUT','Three explicit control-loop decisions grounded in the visible chain.'],['BE READY TO DEFEND','What evidence proves the physical action occurred?'],['GUARDRAIL','“Command sent” and “action performed” are different claims.']]},rest:{board:{id:'closed-loop-capture',type:'capture',title:'Class loop · What extra responsibilities appear when the system can act?',prompt:'Capture only responsibilities or flows, not product names.',placeholder:'e.g. state feedback'},questions:[['COMPARE','Which groups added acknowledgement, state feedback, or both?'],['AUTHORITY','Where does human override enter the loop?'],['PHYSICAL EFFECT','What detects an actuator that acknowledged a command but never moved?']],challenge:'The controller acknowledges “open ventilation”, but the damper is mechanically jammed. Which signal exposes the difference between digital success and physical success?',takeaway:{text:'Closed-loop IoT links observation → decision → command → actuation → state feedback. Command delivery, command acceptance and physical effect are distinct.',chain:['telemetry','decision','command','actuation','state feedback'],reference:[['Forward path',['measurement','decision','command']],['Return path',['acknowledgement','controller state','physical-state feedback']],['Control conditions',['human override','safe/default behaviour','authority / policy']]]},reality:{kind:'delta',chain:['CO₂ measurement','threshold / rule','ventilation command','actuator','measured state'],question:'If the physical actuator fails while every packet is delivered, which communication metric would fail to tell the whole story?'}}},
{label:'Activity 4',title:'Expose communication requirements',workTime:'8–10 min',restTime:'6–7 min',next:'Discover network shapes',work:{q:'Rank the system, then test one real flow.',copy:'Select the communication dimensions that matter across the campus, star a system-level Top 3, then choose one actual Architecture v1 flow and give that flow its own Top 3.',items:[['OUTPUT','System Top 3 + one flow-specific Top 3.'],['BE READY TO DEFEND','One priority that changes between the two rankings — or why none changes.'],['GUARDRAIL','A system-wide ranking is a summary, not a guarantee that every flow has the same priorities.']]},rest:{board:{id:'requirements-compare',type:'compare',title:'Class tally · Which requirement drove your group most?',prompt:'Count one dominant system-level driver per group only after each group has completed the flow check.',categories:['Energy budget','Data volume / throughput','Latency','Reliability','Range','Scale','Mobility','Infrastructure','Cost']},questions:[['COMPARE','What changed when groups moved from the system Top 3 to one specific flow?'],['COMPARE FLOWS','Should periodic telemetry, alerts and commands share the same priorities?'],['PRECISION','When someone says “fast”, do they mean low latency or high data rate?']],challenge:'The indoor sensor is mains-powered while the outdoor node remains battery-powered. Should Energy still matter equally for every flow?',takeaway:{text:'Requirements become useful when attached to a specific flow and an explicit assumption. A system-level ranking is only a first summary.',chain:['system constraints','flow','dominant requirements','candidate solutions'],reference:[['Communication',['range','payload / data volume','throughput','latency','reliability / availability']],['Operational',['energy','scale','mobility','infrastructure','deployment / maintenance','cost']],['Cross-cutting',['security','privacy','manageability','safety where actuation matters']]]},reality:{kind:'metrics',metrics:[['≈0.69 MB/day','30 nodes · 4×32-bit values · 1 report/min'],['≈1.73 GB/day','100 kB image every 5 s']],question:'Same campus, radically different traffic. Which requirement should be reconsidered first when a CO₂ sensor becomes a camera?'}}},

function nodePositions(n){const cols=n<=5?Math.max(2,n):3,rows=Math.ceil((n||1)/cols),xs=[];for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols),x=100+(cols===1?0:c*(800/(cols-1))),y=75+r*(rows>1?145:0);xs.push([x,y])}return xs}

function structureBoard(b,d){const opts=d.nodes.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');return `<div class="live-board" data-board="${esc(b.id)}" data-kind="structure">${boardHead(b)}<div class="live-board-body"><div class="structure-toolbar"><form class="board-form" data-node-form><input name="node" maxlength="45" autocomplete="off" placeholder="${esc(b.placeholder||'Add component or responsibility')}" aria-label="Add component"><button class="board-mini-btn primary" type="submit">Add box</button><button class="board-mini-btn ghost" type="button" data-structure-undo>Undo</button></form>${d.nodes.length>=2?`<form class="board-form structure-edge" data-edge-form><select name="from" aria-label="Flow from">${opts}</select><span>→</span><select name="to" aria-label="Flow to">${opts}</select><input name="label" maxlength="38" autocomplete="off" placeholder="flow label" aria-label="Flow label"><button class="board-mini-btn" type="submit">Add flow</button></form>`:''}</div>${structureSvg(b,d)}<div class="board-principle">Collective model from student contributions — not a hidden reference architecture.</div></div></div>`}

function realityBody(r){if(!r)return '';let h='<div class="mini-reality">';if(r.kind==='examples')h+=`<div class="mini-metrics">${r.items.map(x=>`<div class="mini-metric"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(r.kind==='metrics'||r.kind==='tech')h+=`<div class="mini-metrics">${r.metrics.map(x=>`<div class="mini-metric"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(r.kind==='chain'||r.kind==='delta')h+=`<div class="mini-chain">${r.chain.map((x,i)=>`${i?'<b>→</b>':''}<span>${esc(x)}</span>`).join('')}</div>`;h+=`<p><strong>Interpret it:</strong> ${esc(r.question)}</p>`;if(r.sources)h+=`<div class="reality-source">Official sources: ${r.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</div>`;return h+'</div>'}
function discussionAnchor(r,c,i){
