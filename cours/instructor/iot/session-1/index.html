 ]

 phases:[

  {k:'1 · LOOK',q:'Show one technology decision and the assumption that drove it.',copy:'Do not start from the technology name. Start from the communication problem it is solving.',liveBoard:{id:'technology-compare',type:'compare',title:'Class tally · What did groups commit to?',prompt:'Tally only after each group has made its own decision. Divergence is the starting point for discussion, not a problem to eliminate.',categories:['Bluetooth LE','Wi-Fi','IEEE 802.15.4','LoRaWAN','Cellular IoT','Not enough info']},replaceCards:true,cards:[['YOUR DECISION','Technology + reason','What requirement and infrastructure assumption made it plausible?'],['YOUR NETWORK SHAPE','What sits between device and application?','Peer? access point? gateway? operator network?']]},

  {k:'3 · CHALLENGE',q:'Access can work while the service still fails.',challenge:['A LoRaWAN sensor can still reach its gateway, but the gateway loses its upstream Internet path.','Which part of the architecture failed? What does that tell you about “choosing a technology”?']},
  {k:'4 · UNLOCK',q:'Choose the problem and network shape before the technology name.',unlock:[['From your discussion','The same application need can map to different communication structures, and one working link does not guarantee an end-to-end service.'],['Formalise it','Reason in this order: communication problem → network shape → technology family. Technology names come after the structure and requirements are understood.'],['Carry it forward','Every technology choice should trigger: “what else did we implicitly choose?” Gateways, access points, operator coverage, spectrum, topology or upstream services may come with it.']],chain:['Problem','Network shape','Technology family','Implicit dependencies']},
  {k:'5 · REALITY · RATES',q:'Low-power wireless is not one operating point.',reality:{banner:['Official specification values','These are illustrative protocol or physical rates — not application throughput and not a standalone benchmark.'],metrics:[['125 kb/s','Bluetooth LE Coded S=8','protocol data rate'],['500 kb/s','Bluetooth LE Coded S=2','protocol data rate'],['1–2 Mb/s','Bluetooth LE 1M / 2M','protocol data rate'],['0.3–5 kb/s','LoRaWAN EU DR0–DR5','EU863-870 default LoRa rates']],sources:[['Bluetooth SIG','https://www.bluetooth.com/bluetooth-le-primer/'],['LoRa Alliance RP002','https://lora-alliance.org/wp-content/uploads/2021/05/RP-2-1.0.3.pdf']],question:'Do these numbers choose the technology for you? Which requirement would make the rate difference actually matter?'}},

  {k:'1 · LOOK',q:'Put v1 and v2 side by side.',copy:'Name one concrete structural change and the incident or assumption that caused it.',cards:[['DESIGN DELTA','What changed?','Component added/removed? flow changed? processing moved?'],['CAUSE','Why did it change?','Which requirement came under pressure?']]},
  {k:'2 · COMPARE',q:'A robust design is not “the one with the most components”.',cards:[['COMPARE RESPONSES','Different incident, different revision','What did another group change and why?'],['RESIDUAL RISK','What remains unresolved?','Every mitigation has a validity domain.'],['RETRIEVE','Say the method without looking','What should happen before a technology choice?']]},

  {k:'5 · REALITY CHECK',q:'Worked design delta: upstream Internet disappears.',reality:{banner:['Worked architecture response','This is one defensible response to one failure mode — not a universal “edge is better” answer.'],diagram:[['V1','Sensor','Gateway','Cloud rules + storage','Dashboard / alert'],['branch','CHANGED ASSUMPTION','Upstream Internet unavailable'],['V2','Sensor','Gateway + local buffer / rule','Local alert','Sync cloud later']],cards:[['REQUIREMENT UNDER PRESSURE','Alert availability / latency','The service cannot depend entirely on a currently unavailable upstream path.'],['STRUCTURAL RESPONSE','Local decision + buffering','Move the minimum required alert path and temporary state closer to the gateway.'],['RESIDUAL RISK','Gateway or local radio failure','The revision solves one dependency; it does not make the system universally robust.']],question:'What justified the added local function: a fashionable architecture pattern, or a requirement exposed by a changed assumption?'}}

let stop=0,phase=0;
const scene=document.getElementById('scene'),phaseCount=document.getElementById('phaseCount');
function esc(s){return String(s).replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
function workBody(w){const guard=w.find(x=>x[0]==='GUARDRAIL'),items=w.filter(x=>x[0]!=='GUARDRAIL');return `<div class="work-panel"><div><div class="phase-kicker">Work screen</div><h2>Keep this on screen while your group works.</h2>${guard?`<div class="work-guardrail">${guard[1]}</div>`:`<div class="work-guardrail">Produce the artifact first. Discussion comes at the checkpoint.</div>`}</div><div class="work-output">${items.map(x=>`<div><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`}
function diagramBody(rows){return `<div class="reference-diagram">${rows.map(r=>{if(r[0]==='branch')return `<div class="diagram-branch"><div class="diagram-row">${r.slice(1).map((x,i)=>`${i?'<span class="diagram-arrow">→</span>':''}<span class="diagram-node emphasis">${x}</span>`).join('')}</div></div>`;return `<div class="diagram-row">${r.map((x,i)=>`${i?'<span class="diagram-arrow">→</span>':''}<span class="diagram-node ${i===0?'emphasis':''}">${x}</span>`).join('')}</div>`}).join('')}</div>`}
function realityBody(r){let h=`<div class="reality-wrap"><div class="reality-banner"><strong>${r.banner[0]}</strong><span>${r.banner[1]}</span></div>`;
 if(r.metrics)h+=`<div class="metric-grid">${r.metrics.map((m,i)=>`<div class="metric ${i===r.metrics.length-1?'contrast':''}"><strong>${m[0]}</strong><b>${m[1]}</b><span>${m[2]}</span></div>`).join('')}</div>`;
 if(r.diagram)h+=diagramBody(r.diagram);
 if(r.cards)h+=`<div class="reality-grid">${r.cards.map(c=>`<div class="reality-card"><b>${c[0]}</b><strong>${c[1]}</strong><span>${c[2]}</span></div>`).join('')}</div>`;
 if(r.note)h+=`<div class="reality-note">${r.note}</div>`;
 if(r.sources)h+=`<div class="source-row">${r.sources.map(s=>`<a class="source-link" href="${s[1]}" target="_blank" rel="noopener">↗ ${s[0]}</a>`).join('')}<span class="source-note">Official sources</span></div>`;
 if(r.question)h+=`<div class="reality-question"><strong>Interpret it:</strong> ${r.question}</div>`;
 return h+'</div>'}

const BOARD_STORAGE='iot-projector-liveboards-v14';
let boardState={};
try{boardState=JSON.parse(sessionStorage.getItem(BOARD_STORAGE)||'{}')||{}}catch(_){boardState={}}
function saveBoards(){try{sessionStorage.setItem(BOARD_STORAGE,JSON.stringify(boardState))}catch(_){}}
function boardData(b){if(!boardState[b.id]){boardState[b.id]=b.type==='capture'?{items:[]}:b.type==='structure'?{nodes:[],edges:[]}:{counts:{}}}return boardState[b.id]}
function boardHead(b){return `<div class="live-board-head"><div><strong>${esc(b.title)}</strong><span>${esc(b.prompt)}</span></div><span class="live-board-kind">${esc(b.type)}</span></div>`}
function captureBoard(b,d){return `<div class="live-board" data-board="${esc(b.id)}" data-kind="capture">${boardHead(b)}<div class="live-board-body"><form class="board-form" data-capture-form><input name="idea" maxlength="70" autocomplete="off" placeholder="${esc(b.placeholder||'Add a short class idea')}" aria-label="Add class idea"><button class="board-mini-btn primary" type="submit">Add idea</button><button class="board-mini-btn ghost" type="button" data-board-reset>Clear</button></form>${d.items.length?`<div class="capture-items">${d.items.map((x,i)=>`<span class="capture-chip">${esc(x)}<button type="button" data-capture-remove="${i}" aria-label="Remove ${esc(x)}">×</button></span>`).join('')}</div>`:`<div class="board-empty">Class ideas will appear here after groups have committed.</div>`}<div class="board-principle">Keep entries short enough to compare. The board is a memory of the discussion, not a transcript.</div></div></div>`}
function nodePositions(n){const cols=n<=5?Math.max(2,n):3,rows=Math.ceil((n||1)/cols),xs=[];for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols),x=100+(cols===1?0:c*(800/(cols-1))),y=85+r*(rows>1?170:0);xs.push([x,y])}return xs}
function structureSvg(b,d){if(!d.nodes.length)return `<div class="board-empty">Add a few class components or responsibilities, then connect the flows the room can justify.</div>`;const pos=nodePositions(d.nodes.length),marker='arrow-'+b.id.replace(/[^a-z0-9]/gi,'');let edgeHtml=d.edges.map(e=>{const a=pos[e.from],z=pos[e.to];if(!a||!z)return '';const dx=z[0]-a[0],dy=z[1]-a[1],len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,x1=a[0]+90*ux,y1=a[1]+28*uy,x2=z[0]-90*ux,y2=z[1]-28*uy,mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${marker})"></line>${e.label?`<text class="edge-text" x="${mx}" y="${my-8}">${esc(e.label.slice(0,32))}</text>`:''}`}).join('');let nodes=d.nodes.map((x,i)=>`<g><rect class="node" x="${pos[i][0]-90}" y="${pos[i][1]-28}" width="180" height="56" rx="13"></rect><text class="node-text" x="${pos[i][0]}" y="${pos[i][1]}">${esc(x.length>22?x.slice(0,21)+'…':x)}</text></g>`).join('');return `<div class="structure-canvas"><svg viewBox="0 0 1000 360" role="img" aria-label="Collective class architecture"><defs><marker id="${marker}" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#72869b"></path></marker></defs>${edgeHtml}${nodes}</svg></div>`}
function structureBoard(b,d){const opts=d.nodes.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');return `<div class="live-board" data-board="${esc(b.id)}" data-kind="structure">${boardHead(b)}<div class="live-board-body"><div class="structure-toolbar"><form class="board-form" data-node-form><input name="node" maxlength="45" autocomplete="off" placeholder="${esc(b.placeholder||'Add component or responsibility')}" aria-label="Add component"><button class="board-mini-btn primary" type="submit">Add box</button><button class="board-mini-btn ghost" type="button" data-structure-undo>Undo</button></form>${d.nodes.length>=2?`<form class="board-form structure-edge" data-edge-form><select name="from" aria-label="Flow from">${opts}</select><span>→</span><select name="to" aria-label="Flow to">${opts}</select><input name="label" maxlength="38" autocomplete="off" placeholder="flow label (optional)" aria-label="Flow label"><button class="board-mini-btn" type="submit">Add flow</button></form>`:'<div></div>'}</div>${structureSvg(b,d)}<div class="board-principle">Build the collective model from student contributions. It is not a hidden reference architecture.</div></div></div>`}
function compareBoard(b,d){const cats=b.categories||[];return `<div class="live-board" data-board="${esc(b.id)}" data-kind="compare">${boardHead(b)}<div class="live-board-body"><div class="compare-grid">${cats.map((c,i)=>{const n=d.counts[c]||0;return `<div class="compare-item"><strong>${esc(c)}</strong><div class="compare-actions"><button type="button" data-compare="${i}" data-delta="-1" aria-label="Decrease ${esc(c)}">−</button><button type="button" data-compare="${i}" data-delta="1" aria-label="Increase ${esc(c)}">+</button></div><div class="compare-count">${n}</div></div>`}).join('')}</div><div class="board-principle">The tally describes this room. It does not make the majority choice correct.</div></div></div>`}
function liveBoardBody(b){const d=boardData(b);return b.type==='capture'?captureBoard(b,d):b.type==='structure'?structureBoard(b,d):compareBoard(b,d)}

function phaseBody(p){let html=`<div class="phase-kicker">${p.k}</div><div class="big-question">${p.q}</div>`;if(p.copy)html+=`<div class="support-copy">${p.copy}</div>`;
 if(p.work)html+=workBody(p.work);
 if(p.liveBoard)html+=liveBoardBody(p.liveBoard);
 if(p.cards&&!p.replaceCards)html+=`<div class="prompt-grid">${p.cards.map(c=>`<div class="prompt-card"><b>${c[0]}</b><strong>${c[1]}</strong><span>${c[2]}</span></div>`).join('')}</div>`;
 if(p.challenge)html+=`<div class="challenge-box"><div class="phase-kicker">Counterexample</div><strong>${p.challenge[0]}</strong><p>${p.challenge[1]}</p></div>`;
 if(p.unlock)html+=`<div class="unlock-grid">${p.unlock.map(u=>`<div class="unlock-card"><b>${u[0]}</b><strong>${u[1]}</strong>${u[2]?`<p>${u[2]}</p>`:''}</div>`).join('')}</div>`;
 if(p.chips)html+=`<div class="lens-row">${p.chips.map(x=>`<span class="lens-chip">${x}</span>`).join('')}</div>`;
 if(p.terms)html+=`<div class="term-map">${p.terms.map(t=>`<div><small>${t[0]}</small><strong>${t[1]}</strong></div>`).join('')}</div>`;
 if(p.chain)html+=`<div class="chain">${p.chain.map((x,i)=>`${i?'<b>→</b>':''}<span>${x}</span>`).join('')}</div>`;
 if(p.reality)html+=realityBody(p.reality);
 return html;
}
function renderProgress(){document.getElementById('stopProgress').innerHTML=scenes.map((s,i)=>`<button type="button" aria-label="${s.label}" class="${i<stop?'visited':''} ${i===stop?'active':''}" data-jump="${i}"></button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{stop=+b.dataset.jump;phase=0;render()})}
function render(){const s=scenes[stop],p=s.phases[phase],last=s.phases.length-1;scene.dataset.stop=stop;scene.classList.toggle('live-board-mode',!!p.liveBoard);const mode=phase===0?'Class work':p.k.includes('REALITY')?'Reality check':'Class discussion';scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">${s.label} · ${mode}</div><h1>${s.title}</h1></div><div class="scene-number">${String(stop+1).padStart(2,'0')}</div></div><div class="shell stage ${p.reality?'reality-stage':''} ${p.liveBoard?'live-board-stage':''}"><div class="phasebar" style="grid-template-columns:repeat(${s.phases.length},minmax(100px,1fr))">${s.phases.map((x,i)=>`<div class="phase-pill ${i<phase?'done':''} ${i===phase?'active':''}">${x.k.replace(/^\d · /,'')}</div>`).join('')}</div><div class="phase-content">${phaseBody(p)}</div><div class="stage-footer"><div class="transition"><strong>Next:</strong> ${s.transition}</div></div></div>`;phaseCount.textContent=`${s.label} · ${phase+1}/${s.phases.length}`;document.documentElement.style.setProperty('--accent',getComputedStyle(scene).getPropertyValue('--accent'));document.getElementById('prevStop').disabled=stop===0;document.getElementById('prevPhase').disabled=phase===0;document.getElementById('nextPhase').disabled=phase===last;document.getElementById('nextStop').disabled=stop===scenes.length-1;renderProgress()}

scene.addEventListener('submit',e=>{
 const host=e.target.closest('.live-board');if(!host)return;e.preventDefault();const p=scenes[stop].phases[phase],b=p.liveBoard;if(!b)return;const d=boardData(b);
 if(e.target.matches('[data-capture-form]')){const v=(new FormData(e.target).get('idea')||'').trim();if(v&&!d.items.includes(v)){d.items.push(v);saveBoards();render()}}
 if(e.target.matches('[data-node-form]')){const v=(new FormData(e.target).get('node')||'').trim();if(v&&!d.nodes.includes(v)){d.nodes.push(v);saveBoards();render()}}
 if(e.target.matches('[data-edge-form]')){const f=new FormData(e.target),from=+f.get('from'),to=+f.get('to'),label=(f.get('label')||'').trim();if(Number.isInteger(from)&&Number.isInteger(to)&&from!==to){d.edges.push({from,to,label});saveBoards();render()}}
});
scene.addEventListener('click',e=>{
 const host=e.target.closest('.live-board');if(!host)return;const p=scenes[stop].phases[phase],b=p.liveBoard;if(!b)return;const d=boardData(b);
 if(e.target.matches('[data-capture-remove]')){d.items.splice(+e.target.dataset.captureRemove,1);saveBoards();render();return}
 if(e.target.matches('[data-compare]')){const cat=b.categories[+e.target.dataset.compare],delta=+e.target.dataset.delta;d.counts[cat]=Math.max(0,(d.counts[cat]||0)+delta);saveBoards();render();return}
 if(e.target.matches('[data-structure-undo]')){if(d.edges.length)d.edges.pop();else if(d.nodes.length){const gone=d.nodes.length-1;d.nodes.pop();d.edges=d.edges.filter(x=>x.from!==gone&&x.to!==gone)}saveBoards();render();return}
 if(e.target.matches('[data-board-reset]')){if(confirm('Clear this class board?')){delete boardState[b.id];saveBoards();render()}return}
});

function nextPhase(){const last=scenes[stop].phases.length-1;if(phase<last){phase++;render()}else if(stop<scenes.length-1){stop++;phase=0;render()}}
function prevPhase(){if(phase>0){phase--;render()}else if(stop>0){stop--;phase=scenes[stop].phases.length-1;render()}}
document.getElementById('nextPhase').onclick=nextPhase;document.getElementById('prevPhase').onclick=prevPhase;document.getElementById('nextStop').onclick=()=>{if(stop<scenes.length-1){stop++;phase=0;render()}};document.getElementById('prevStop').onclick=()=>{if(stop>0){stop--;phase=0;render()}};
document.getElementById('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextPhase()}else if(e.key==='ArrowLeft'){e.preventDefault();prevPhase()}else if(e.key==='ArrowDown'){e.preventDefault();if(stop<scenes.length-1){stop++;phase=0;render()}}else if(e.key==='ArrowUp'){e.preventDefault();if(stop>0){stop--;phase=0;render()}}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});
render();
</script>
