<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<meta name="description" content="Projector mode for IoT Systems Design — Session 1" />
<title>Session 1 Projector — IoT Systems Design</title>
<style>
:root{
  --bg:#f4f7fb;--surface:#fff;--text:#122033;--muted:#5d6c7d;--border:#d7e0e9;
  --blue:#3157c8;--blue-soft:#eaf0ff;--teal:#0f766e;--teal-soft:#e7f6f3;
  --purple:#6548ad;--purple-soft:#f1ecfb;--orange:#9a520a;--orange-soft:#fff1df;
  --green:#17663f;--green-soft:#e7f5ed;--red:#963445;--red-soft:#fbecef;
  --shadow:0 18px 55px rgba(26,43,64,.10)
}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:var(--bg);color:var(--text)}
button{font:inherit}.shell{width:min(1450px,calc(100% - 52px));margin:0 auto}.topbar{height:66px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(244,247,251,.96);position:sticky;top:0;z-index:10}.topbar-inner{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{display:flex;align-items:center;gap:11px}.brand-mark{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#172d48,#3157c8);color:white;font-weight:900}.brand strong,.brand span{display:block}.brand span{color:var(--muted);font-size:.78rem}.progress{display:flex;gap:7px;align-items:center}.progress button{width:40px;height:9px;border:0;border-radius:999px;background:#d9e1e9;padding:0}.progress button.visited{background:#9ab0cf}.progress button.active{background:var(--accent,#3157c8);height:12px}.top-actions{display:flex;gap:8px}.icon-btn{border:1px solid var(--border);background:#fff;border-radius:10px;min-height:40px;padding:8px 11px;font-weight:750;color:#405164;cursor:pointer}.icon-btn:hover{border-color:#a9b7c6}
main{min-height:calc(100dvh - 66px);display:grid;align-items:stretch}.scene{--accent:var(--blue);--soft:var(--blue-soft);padding:30px 0 110px;display:grid;grid-template-rows:auto 1fr;gap:18px}.scene[data-stop="0"]{--accent:var(--teal);--soft:var(--teal-soft)}.scene[data-stop="1"]{--accent:var(--blue);--soft:var(--blue-soft)}.scene[data-stop="2"]{--accent:var(--purple);--soft:var(--purple-soft)}.scene[data-stop="3"]{--accent:var(--orange);--soft:var(--orange-soft)}.scene[data-stop="4"]{--accent:var(--red);--soft:var(--red-soft)}
.scene-head{display:flex;align-items:flex-end;justify-content:space-between;gap:28px}.eyebrow{text-transform:uppercase;letter-spacing:.13em;font-weight:900;font-size:.72rem;color:var(--accent)}h1{font-size:clamp(2.4rem,5vw,5.4rem);letter-spacing:-.055em;line-height:.98;margin:6px 0 0;max-width:1100px}.scene-number{font-weight:900;font-size:clamp(3.5rem,8vw,8rem);line-height:.75;color:var(--soft)}
.stage{background:#fff;border:1px solid var(--border);border-top:7px solid var(--accent);border-radius:26px;box-shadow:var(--shadow);padding:clamp(26px,4vw,54px);min-height:580px;display:grid;grid-template-rows:auto 1fr auto;gap:26px}.phasebar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}.phase-pill{padding:10px 12px;border-radius:999px;background:#f0f3f6;color:#8290a0;text-align:center;font-size:.78rem;font-weight:900;letter-spacing:.05em}.phase-pill.done{background:var(--soft);color:var(--accent)}.phase-pill.active{background:var(--accent);color:#fff}
.phase-content{display:grid;align-content:center;max-width:1250px}.phase-kicker{font-size:.78rem;text-transform:uppercase;letter-spacing:.11em;font-weight:900;color:var(--accent);margin-bottom:10px}.big-question{font-size:clamp(2rem,3.6vw,4.1rem);line-height:1.08;font-weight:840;letter-spacing:-.04em;max-width:1150px}.support-copy{font-size:clamp(1.05rem,1.6vw,1.45rem);color:var(--muted);line-height:1.45;max-width:1000px;margin-top:18px}.prompt-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:28px}.prompt-card{border:1px solid var(--border);border-radius:17px;background:#f8fafc;padding:18px}.prompt-card b{display:block;color:var(--accent);font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;margin-bottom:6px}.prompt-card strong{font-size:1.16rem;line-height:1.28}.prompt-card span{display:block;color:var(--muted);font-size:.9rem;margin-top:6px;line-height:1.38}.challenge-box{margin-top:24px;padding:24px 26px;border-radius:20px;background:var(--orange-soft);border-left:6px solid var(--orange)}.challenge-box .phase-kicker{color:var(--orange)}.challenge-box strong{font-size:clamp(1.35rem,2.4vw,2.4rem);line-height:1.23;display:block}.challenge-box p{font-size:1.08rem;color:#6d5536;max-width:1000px;margin:9px 0 0}
.unlock-grid{display:grid;grid-template-columns:1fr 1.1fr 1fr;gap:14px;margin-top:22px}.unlock-card{border:1px solid var(--border);border-radius:18px;padding:20px;background:#fff}.unlock-card:nth-child(2){background:var(--soft);border-color:transparent}.unlock-card b{display:block;text-transform:uppercase;letter-spacing:.08em;font-size:.72rem;color:var(--accent);margin-bottom:8px}.unlock-card strong{font-size:1.22rem;line-height:1.28}.unlock-card p{font-size:1rem;line-height:1.5;color:#4e5e6f;margin:8px 0 0}.lens-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:20px}.lens-chip{border-radius:999px;padding:9px 12px;background:var(--soft);color:var(--accent);font-weight:850;font-size:.88rem}.chain{display:flex;align-items:center;gap:9px;flex-wrap:wrap;margin-top:23px}.chain span{padding:11px 14px;border-radius:11px;background:#eef2f6;font-weight:850}.chain b{color:var(--accent);font-size:1.35rem}.term-map{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:20px}.term-map div{padding:12px;border-radius:12px;background:#f3f5f7}.term-map small{display:block;color:var(--muted);font-weight:700}.term-map strong{display:block;margin-top:2px;color:var(--accent)}
.stage-footer{display:flex;justify-content:space-between;align-items:center;gap:20px;padding-top:8px}.transition{font-size:.9rem;color:var(--muted)}.transition strong{color:var(--accent)}.controls{position:fixed;left:0;right:0;bottom:0;background:rgba(244,247,251,.96);backdrop-filter:blur(12px);border-top:1px solid var(--border);z-index:20}.controls-inner{height:78px;display:flex;align-items:center;justify-content:space-between;gap:12px}.control-group{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#fff;border-radius:12px;min-height:46px;padding:10px 15px;font-weight:800;cursor:pointer}.btn.primary{background:var(--accent,#3157c8);color:#fff;border-color:transparent}.btn:disabled{opacity:.38;cursor:not-allowed}.keyhint{color:var(--muted);font-size:.76rem}.phase-count{font-size:.82rem;color:var(--muted);font-weight:750}
@media(max-width:900px){.shell{width:min(100% - 24px,1450px)}.stage{min-height:620px;padding:26px}.scene-number{display:none}.prompt-grid,.unlock-grid,.term-map{grid-template-columns:1fr}.phasebar{grid-template-columns:repeat(4,minmax(90px,1fr));overflow-x:auto}.controls-inner{height:auto;min-height:72px;padding:9px 0}.keyhint{display:none}}
@media(max-width:650px){h1{font-size:2.35rem}.stage{min-height:650px;padding:20px;border-radius:20px}.phase-pill{font-size:.66rem;padding:8px}.big-question{font-size:1.75rem}.support-copy{font-size:1rem}.prompt-grid{gap:8px}.prompt-card{padding:14px}.top-actions{display:none}.brand span{display:none}.controls-inner{flex-wrap:wrap}.phase-count{order:-1;width:100%;text-align:center}.control-group .btn{padding:9px 11px}}
@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
@media print{.topbar,.controls{display:none}.scene{padding:0}.stage{box-shadow:none;min-height:auto}}
</style>
</head>
<body>
<header class="topbar"><div class="shell topbar-inner"><div class="brand"><div class="brand-mark">IoT</div><div><strong>Systems Design · Session 1</strong><span>Class discussion</span></div></div><div class="progress" id="stopProgress" aria-label="Discussion checkpoints"></div><div class="top-actions"><button class="icon-btn" id="fullscreenBtn" type="button">Fullscreen</button></div></div></header>
<main><section class="scene" id="scene"></section></main>
<div class="controls"><div class="shell controls-inner"><div class="control-group"><button class="btn" id="prevStop" type="button">← Previous STOP</button><button class="btn" id="prevPhase" type="button">← Back</button></div><div class="phase-count" id="phaseCount"></div><div class="control-group"><button class="btn primary" id="nextPhase" type="button">Reveal next →</button><button class="btn" id="nextStop" type="button">Next STOP →</button></div><span class="keyhint">←/→ reveal · ↑/↓ STOP · F fullscreen</span></div></div>
<script>
const scenes=[
{
 label:'STOP 1',title:'What actually makes these systems part of the same field?',transition:'Turn one application into a system architecture.',
 phases:[
  {k:'1 · LOOK',q:'Keep your landscape snapshot open.',copy:'Choose one case your group could reasonably place in two domains. Be ready to defend both classifications.',cards:[['YOUR EVIDENCE','Pick one cross-domain case','Why did you choose a main domain and a secondary one?'],['USE THE DISAGREEMENT','Different answers can both be useful','What viewpoint makes each classification defensible?']]},
  {k:'2 · COMPARE',q:'Where did groups disagree — and what stayed common?',cards:[['COMPARE','Same case, different main domain?','Can two different classifications both be defensible? Explain the viewpoint behind each.'],['LOOK ACROSS CASES','What repeats?','Physical objects, measurements/actions, communication, digital service?'],['BOUNDARY','Is “connected” enough?','State the boundary your group is currently using.']]},
  {k:'3 · CHALLENGE',q:'Test the boundary.',challenge:['A Raspberry Pi hosts a normal web page but senses or controls nothing in the physical world.','Would you call that IoT? What boundary are you using?']},
  {k:'4 · UNLOCK',q:'Turn the class evidence into a working concept.',unlock:[['From your discussion','Your categories crossed home, health, industry, mobility, energy and other domains. The application domain alone does not explain what these systems have in common.'],['Formalise it','In this course, we use IoT for systems in which physical entities are observed or acted upon and connected to digital services through communication and computation.'],['Carry it forward','“Connected” is not enough by itself. Look for the physical-world role and the end-to-end service.']]}
 ]
},
{
 label:'STOP 2',title:'What is an architecture — before we choose technologies?',transition:'Identify what each information flow actually requires.',
 phases:[
  {k:'1 · LOOK',q:'Show Architecture v1 and one labelled information flow.',copy:'Pick one component that your group considered essential. What responsibility does it perform?',cards:[['YOUR ARTIFACT','Architecture v1','Point to one component and one labelled flow.'],['CHECK','Component or technology?','Did you draw responsibilities, physical boxes, products — or a mixture?']]},
  {k:'2 · COMPARE',q:'Different diagrams can implement the same responsibilities.',cards:[['COMPARE','What did groups call a component?','Sensor? gateway? database? dashboard? user?'],['COUNT TWO WAYS','Responsibilities ≠ boxes','How many functions exist? How many physical devices?'],['FOLLOW THE DATA','Where does information move?','Flows expose dependencies that boxes alone can hide.']]},
  {k:'3 · CHALLENGE',q:'One box, many responsibilities.',challenge:['One Raspberry Pi senses, stores, computes and serves the dashboard.','How many architectural responsibilities exist — and how many physical boxes?']},
  {k:'4 · UNLOCK',q:'Separate responsibilities before products.',unlock:[['From your discussion','One physical box can perform several roles, and one role can be distributed across several boxes.'],['Formalise it','A useful architecture lens is: Sense / Act · Communicate · Compute · Store · Use. These are responsibilities, not mandatory layers or devices.'],['Carry it forward','Follow the information flows between responsibilities. They reveal where requirements and later technology choices matter.']],chips:['Sense / Act','Communicate','Compute','Store','Use']}
 ]
},
{
 label:'STOP 3',title:'What does each flow actually need?',transition:'Use these requirements to reason about communication solutions.',
 phases:[
  {k:'1 · LOOK',q:'Keep your selected constraints and Top 3 visible.',copy:'Choose one priority your group thinks is essential and one that was debated.',cards:[['YOUR TOP 3','Defend one priority','What fact in the campus mission makes it important?'],['EVIDENCE','Tie the choice to a flow','Which information flow is actually affected?']]},
  {k:'2 · COMPARE',q:'Do all flows deserve the same priorities?',cards:[['POLL','Who prioritised Energy? Latency? Reliability? Infrastructure?','Compare which mission facts led to different priorities.'],['COMPARE FLOWS','Sensor data vs alert','The same system can contain different communication needs.'],['PRECISION','“Fast” is not a requirement','Do you mean low latency or high data rate?']]},
  {k:'3 · CHALLENGE',q:'Change one assumption.',challenge:['The indoor sensor is mains-powered. The outdoor sensor remains battery-powered.','Should Energy still have the same importance for every communication flow?']},
  {k:'4 · UNLOCK',q:'Name the engineering dimensions only after the need is clear.',unlock:[['From your discussion','Groups prioritised different concerns, and even one system can contain flows with different priorities.'],['Formalise it','Turn plain questions into explicit requirements: range, data volume/throughput, latency, reliability, energy, scale, mobility, infrastructure and cost.'],['Carry it forward','Compare technologies against the dominant requirements of each important flow, not against a vague system-wide wish list.']],terms:[['How far?','Range'],['How much data?','Data volume / throughput'],['How soon?','Latency'],['How dependable?','Reliability'],['Limited energy?','Energy'],['How many / moving / what exists?','Scale · Mobility · Infrastructure']]}
 ]
},
{
 label:'STOP 4',title:'How do we choose a communication technology without guessing?',transition:'Break one assumption and see whether the design survives.',
 phases:[
  {k:'1 · LOOK',q:'Show one technology decision and the assumption that drove it.',copy:'Do not start from the technology name. Start from the communication problem it is solving.',cards:[['YOUR DECISION','Technology + reason','What requirement and infrastructure assumption made it plausible?'],['YOUR NETWORK SHAPE','What sits between device and application?','Peer? access point? gateway? operator network?']]},
  {k:'2 · COMPARE',q:'Similar needs can lead to different network shapes.',cards:[['NEARBY','Device ↔ peer','Bluetooth LE is a common family here.'],['LOCAL ACCESS','Device → access point → network','Wi-Fi is a common family here.'],['GATEWAY WIDE AREA','Device → gateway → network service','LoRaWAN is a common family here.'],['OPERATOR WIDE AREA','Device → base station → operator network','NB-IoT / LTE-M are common families here.'],['BUILDING BLOCK','Local radio/link rules + higher layers','IEEE 802.15.4 does not define the entire end-to-end stack.']]},
  {k:'3 · CHALLENGE',q:'Access can work while the service still fails.',challenge:['A LoRaWAN sensor can still reach its gateway, but the gateway loses its upstream Internet path.','Which part of the architecture failed? What does that tell you about “choosing a technology”?']},
  {k:'4 · UNLOCK',q:'Choose the problem and network shape before the technology name.',unlock:[['From your discussion','The same application need can map to different communication structures, and one working link does not guarantee an end-to-end service.'],['Formalise it','Reason in this order: communication problem → network shape → technology family. Technology names come after the structure and requirements are understood.'],['Carry it forward','Every technology choice should trigger: “what else did we implicitly choose?” Gateways, access points, operator coverage, spectrum, topology or upstream services may come with it.']],chain:['Problem','Network shape','Technology family','Implicit dependencies']}
 ]
},
{
 label:'DEBRIEF',title:'What changed between Architecture v1 and Architecture v2?',transition:'Session 1 complete: keep the reasoning method, not just the technology names.',
 phases:[
  {k:'1 · LOOK',q:'Put v1 and v2 side by side.',copy:'Name one concrete structural change and the incident or assumption that caused it.',cards:[['DESIGN DELTA','What changed?','Component added/removed? flow changed? processing moved?'],['CAUSE','Why did it change?','Which requirement came under pressure?']]},
  {k:'2 · COMPARE',q:'A robust design is not “the one with the most components”.',cards:[['COMPARE RESPONSES','Different incident, different revision','What did another group change and why?'],['RESIDUAL RISK','What remains unresolved?','Every mitigation has a validity domain.'],['RETRIEVE','Say the method without looking','What should happen before a technology choice?']]},
  {k:'3 · CHALLENGE',q:'One last transfer test.',challenge:['Replace one CO₂ sensor with a camera sending images every few seconds.','Which part of your reasoning should be revisited first — and why?']},
  {k:'4 · UNLOCK',q:'The reusable outcome is the reasoning loop.',unlock:[['From your discussion','Changing an assumption changed a requirement, which forced an architectural revision. The technology decision was therefore never independent of the rest of the system.'],['Formalise it','A defensible IoT design links need → functions → architecture → information flows → requirements → candidate technologies.'],['Carry it forward','Challenge assumptions, observe what breaks, then revise. The goal is not to memorise one “best” IoT stack; it is to make choices whose validity you can explain.']],chain:['Need','Functions','Architecture','Flows','Requirements','Technology','Challenge','Revision']}
 ]
}
];
let stop=0,phase=0;
const scene=document.getElementById('scene'),phaseCount=document.getElementById('phaseCount');
function esc(s){return String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]))}
function phaseBody(p){let html=`<div class="phase-kicker">${p.k}</div><div class="big-question">${p.q}</div>`;if(p.copy)html+=`<div class="support-copy">${p.copy}</div>`;
 if(p.cards)html+=`<div class="prompt-grid">${p.cards.map(c=>`<div class="prompt-card"><b>${c[0]}</b><strong>${c[1]}</strong><span>${c[2]}</span></div>`).join('')}</div>`;
 if(p.challenge)html+=`<div class="challenge-box"><div class="phase-kicker">Counterexample</div><strong>${p.challenge[0]}</strong><p>${p.challenge[1]}</p></div>`;
 if(p.unlock)html+=`<div class="unlock-grid">${p.unlock.map((u,i)=>`<div class="unlock-card"><b>${u[0]}</b><strong>${u[1]}</strong>${u[2]?`<p>${u[2]}</p>`:''}</div>`).join('')}</div>`;
 if(p.chips)html+=`<div class="lens-row">${p.chips.map(x=>`<span class="lens-chip">${x}</span>`).join('')}</div>`;
 if(p.terms)html+=`<div class="term-map">${p.terms.map(t=>`<div><small>${t[0]}</small><strong>${t[1]}</strong></div>`).join('')}</div>`;
 if(p.chain)html+=`<div class="chain">${p.chain.map((x,i)=>`${i?'<b>→</b>':''}<span>${x}</span>`).join('')}</div>`;
 return html;
}
function renderProgress(){document.getElementById('stopProgress').innerHTML=scenes.map((s,i)=>`<button type="button" aria-label="${s.label}" class="${i<stop?'visited':''} ${i===stop?'active':''}" data-jump="${i}"></button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{stop=+b.dataset.jump;phase=0;render()})}
function render(){const s=scenes[stop],p=s.phases[phase];scene.dataset.stop=stop;scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">${s.label} · Class discussion</div><h1>${s.title}</h1></div><div class="scene-number">${String(stop+1).padStart(2,'0')}</div></div><div class="shell stage"><div class="phasebar">${s.phases.map((x,i)=>`<div class="phase-pill ${i<phase?'done':''} ${i===phase?'active':''}">${x.k.replace(/^\d · /,'')}</div>`).join('')}</div><div class="phase-content">${phaseBody(p)}</div><div class="stage-footer"><div class="transition"><strong>Next:</strong> ${s.transition}</div></div></div>`;phaseCount.textContent=`${s.label} · ${phase+1}/4`;document.documentElement.style.setProperty('--accent',getComputedStyle(scene).getPropertyValue('--accent'));document.getElementById('prevStop').disabled=stop===0;document.getElementById('prevPhase').disabled=phase===0;document.getElementById('nextPhase').disabled=phase===3;document.getElementById('nextStop').disabled=stop===scenes.length-1;renderProgress()}
function nextPhase(){if(phase<3){phase++;render()}else if(stop<scenes.length-1){stop++;phase=0;render()}}
function prevPhase(){if(phase>0){phase--;render()}else if(stop>0){stop--;phase=3;render()}}
document.getElementById('nextPhase').onclick=nextPhase;document.getElementById('prevPhase').onclick=prevPhase;document.getElementById('nextStop').onclick=()=>{if(stop<scenes.length-1){stop++;phase=0;render()}};document.getElementById('prevStop').onclick=()=>{if(stop>0){stop--;phase=0;render()}};
document.getElementById('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();
document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();nextPhase()}else if(e.key==='ArrowLeft'){e.preventDefault();prevPhase()}else if(e.key==='ArrowDown'){e.preventDefault();if(stop<scenes.length-1){stop++;phase=0;render()}}else if(e.key==='ArrowUp'){e.preventDefault();if(stop>0){stop--;phase=0;render()}}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});
render();
</script>
</body>
</html>
