<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 2 Projector — IoT Systems Design</title><style>
:root{--bg:#f4f7fb;--surface:#fff;--text:#122033;--muted:#5d6c7d;--border:#d7e0e9;--blue:#3157c8;--soft:#eaf0ff;--green:#17663f;--green-soft:#eaf6ef;--shadow:0 18px 55px rgba(26,43,64,.10)}*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:Inter,ui-sans-serif,system-ui,sans-serif;background:var(--bg);color:var(--text)}button{font:inherit}.shell{width:min(1400px,calc(100% - 48px));margin:auto}.topbar{height:66px;display:flex;align-items:center;border-bottom:1px solid var(--border);background:rgba(244,247,251,.97);position:sticky;top:0;z-index:10}.topin{display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-weight:900}.brand small{display:block;color:var(--muted);font-weight:700}.progress{display:flex;gap:6px}.progress button{width:34px;height:9px;border:0;border-radius:999px;background:#d8e0e8}.progress button.done{background:#96a9c7}.progress button.active{background:var(--blue);height:12px}.actions{display:flex;gap:8px}.btn{border:1px solid var(--border);background:#fff;border-radius:10px;padding:9px 12px;font-weight:800;cursor:pointer}.scene{padding:28px 0 95px}.scene-head{display:flex;justify-content:space-between;align-items:end;gap:24px}.eyebrow{font-size:.72rem;letter-spacing:.12em;text-transform:uppercase;font-weight:900;color:var(--blue)}h1{font-size:clamp(2.5rem,5vw,5rem);line-height:1;letter-spacing:-.05em;margin:7px 0 0;max-width:1050px}.count{font-weight:900;color:#93a1b1}.stage{margin-top:18px;background:#fff;border:1px solid var(--border);border-top:7px solid var(--blue);border-radius:24px;box-shadow:var(--shadow);padding:clamp(26px,4vw,52px);min-height:590px;display:grid;align-content:center}.mode{display:inline-block;background:var(--soft);color:var(--blue);border-radius:999px;padding:7px 10px;font-size:.72rem;font-weight:900;letter-spacing:.07em}.question{font-size:clamp(2rem,3.6vw,3.9rem);line-height:1.08;letter-spacing:-.04em;margin:16px 0 12px;max-width:1150px}.support{font-size:clamp(1rem,1.5vw,1.3rem);line-height:1.5;color:var(--muted);max-width:1000px}.work-grid{display:grid;grid-template-columns:1.25fr .85fr;gap:20px;margin-top:28px}.panel{border:1px solid var(--border);border-radius:18px;padding:20px;background:#fbfcfe}.panel b{display:block;font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--blue);margin-bottom:9px}.panel strong{font-size:1.2rem}.panel ul{margin:10px 0 0;padding-left:20px;color:#526173}.panel li{margin:7px 0}.takeaway{background:var(--green-soft);border-color:#cce1d5}.takeaway b{color:var(--green)}.takeaway strong{font-size:1.4rem}.takeaway p{color:#4f6258}.chain{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:16px}.chain span{background:#fff;border:1px solid #d5e2da;border-radius:10px;padding:9px 11px;font-weight:850}.chain i{font-style:normal;color:var(--green);font-weight:900}.nav{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);display:flex;gap:8px;background:#fff;border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:var(--shadow)}.nav .btn.primary{background:#172d48;color:#fff;border-color:#172d48}.deferred{margin-top:20px;border-left:4px solid #9a520a;background:#fff7eb;padding:12px 14px;color:#65533f}@media(max-width:900px){.work-grid{grid-template-columns:1fr}.shell{width:min(100% - 24px,1400px)}}
</style></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 2 · Projector</small></div><div class="progress" id="progress"></div><div class="actions"><a class="btn" href="notes.html">Notes</a><a class="btn" href="../../../iot/session-2/">Student</a></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back">← Back</button><button class="btn primary" id="next">Next →</button></div><script>
const acts=[
{title:'Describe the conversation',time:'6 min work · 5 min STOP',q:'What must happen between the two sides before we name a protocol?',copy:'Use who starts, who receives, and who must wait. Let students classify the three service cases after the worked telemetry example.',collect:['one case where waiting matters','one one-to-many case','one command where ACK is digital evidence only'],stop:{q:'Which property actually changes the conversation?',keep:'An interaction pattern is a name for service behaviour, not a protocol choice.',chain:['service need','interaction pattern','protocol later']}},
{title:'Make message order visible',time:'7 min work',q:'What happens first, what comes back, and what evidence is still missing?',copy:'The student screen exposes two explicit steps: 1) place command → ACK → physical-state observation in a sequence; 2) choose direct copies or one intermediary for one-to-many delivery. The Continue button always states which step is incomplete.',collect:['a defensible command sequence','ACK ≠ proof of physical effect','why a broker can reduce sender/receiver coupling']},
{title:'Separate four communication jobs',time:'7 min work · 5 min STOP',q:'What different jobs are hidden inside “communication”?',copy:'Use only four initial responsibilities: application, transport, network, local access. Do not make 6LoWPAN a fifth mental category.',collect:['one responsibility per row','one boundary students can explain','one example of two names that should not be compared directly'],stop:{q:'Why is “MQTT versus Thread” usually the wrong first comparison?',keep:'Compare within one responsibility. Compose compatible mechanisms across different responsibilities.',chain:['Application','Transport','Network','Local access']}},
{title:'Read one complete stack',time:'8 min work',q:'Can students read one full path before they are asked to build one?',copy:'Show MQTT → TCP → IP → Wi-Fi as the worked example. Then students fill only the application and transport rows of a constrained Thread/IPv6 case.',collect:['why the lower path is already given','why CoAP/UDP is coherent with the stated resource-style case','Thread is a suite/profile spanning lower responsibilities']},
{title:'Choose the application exchange',time:'8 min work · 5 min STOP',q:'Which application protocol matches the service behaviour?',copy:'Use one compact reference for MQTT, CoAP and HTTP. Students make three service decisions; no fragment-sorting or glossary quiz.',collect:['MQTT: brokered pub/sub','CoAP: resource-oriented constrained exchange','HTTP: conventional web/API exchange'],stop:{q:'Which choices are genuine alternatives, and which technologies could coexist below them?',keep:'MQTT, CoAP and HTTP are application protocols; none is a complete communication stack.',chain:['behaviour','application protocol','lower responsibilities']}},
{title:'Compose — then check compatibility',time:'9 min work',q:'Can mechanisms from different responsibilities simply be stacked together?',copy:'Students first build one telemetry path, then audit a deliberately questionable MQTT → UDP → IPv6 → Thread path, then test what can remain unchanged when only the local access path changes.',collect:['one composed path','the first questionable compatibility boundary','one upper-layer decision that can potentially survive a lower-path change']},
{title:'Make the payload usable',time:'7 min work · 5 min STOP',q:'Why is {"value":812} still not enough even though delivery succeeded?',copy:'Students repair the data contract with quantity, unit, timestamp and source. Keep network address / URI-topic / semantics visibly separate.',collect:['three or four missing context fields','an example of successful transport but failed interpretation','where URI/topic differs from data meaning'],stop:{q:'What succeeded in the 25 °C versus 25 %RH counterexample, and what failed?',keep:'Protocol interoperability can deliver a message; semantic interoperability requires shared meaning.',chain:['bytes','application message','shared data meaning']}},
{title:'Defend one end-to-end design',time:'8 min work · 6 min FINAL STOP',q:'Can the group explain one campus exchange without starting from a protocol name?',copy:'Students commit to service → conversation → application protocol → lower path → strongest reason. Ask them to expose one design boundary.',collect:['one complete causal story','one decision tied to service behaviour','one lower-stack choice tied to deployment'],stop:{q:'Where is the most important boundary in your design?',keep:'The session closes at an implementable communication design. Reliability/failure semantics are deliberately deferred to Session 4.',chain:['Behaviour','Sequence','Stack','Composition','Meaning'],deferred:true}}
];
let i=0,mode='work';const scene=document.getElementById('scene');function renderProgress(){document.getElementById('progress').innerHTML=acts.map((a,n)=>`<button class="${n<i?'done':''} ${n===i?'active':''}" data-jump="${n}" aria-label="${a.title}"></button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{i=+b.dataset.jump;mode='work';render()})}function render(){const a=acts[i],rest=mode==='stop'&&a.stop;scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">Activity ${i+1} of ${acts.length} · ${rest?'restitution':'class work'}</div><h1>${a.title}</h1></div><div class="count">${a.time}</div></div><div class="shell stage">${rest?`<span class="mode">STOP · COMPARE → KEEP</span><div class="question">${a.stop.q}</div><div class="work-grid"><section class="panel"><b>Use student artefacts</b><strong>Ask groups to compare before revealing the anchor.</strong><p class="support">Do not add another mini-lecture. Let the disagreement expose the concept boundary.</p></section><section class="panel takeaway"><b>What must remain</b><strong>${a.stop.keep}</strong><div class="chain">${a.stop.chain.map((x,k)=>`${k?'<i>→</i>':''}<span>${x}</span>`).join('')}</div>${a.stop.deferred?'<div class="deferred"><strong>Deferred:</strong> QoS, retry, exactly-once and failure tracing move to Session 4 — Robustness.</div>':''}</section></div>`:`<span class="mode">WORK</span><div class="question">${a.q}</div><p class="support">${a.copy}</p><div class="work-grid"><section class="panel"><b>Your move</b><strong>Students work on the page.</strong><ul>${a.collect.map(x=>`<li>${x}</li>`).join('')}</ul></section><section class="panel"><b>Facilitation guardrail</b><strong>Do not front-load vocabulary.</strong><p class="support">If a term is unfamiliar, restate the engineering question first. Formalise only after a student has made the distinction.</p></section></div>`}</div>`;document.getElementById('back').disabled=i===0&&mode==='work';document.getElementById('next').textContent=rest?(i===acts.length-1?'Session complete':'Next activity →'):(a.stop?'Start STOP →':(i===acts.length-1?'Session complete':'Next activity →'));document.getElementById('next').disabled=rest&&i===acts.length-1;renderProgress()}
document.getElementById('next').onclick=()=>{const a=acts[i];if(mode==='work'&&a.stop)mode='stop';else if(i<acts.length-1){i++;mode='work'}render()};document.getElementById('back').onclick=()=>{if(mode==='stop')mode='work';else if(i>0){i--;mode=acts[i].stop?'stop':'work'}render()};document.addEventListener('keydown',e=>{if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();document.getElementById('next').click()}if(e.key==='ArrowLeft'){e.preventDefault();document.getElementById('back').click()}});render();
</script></body></html>
