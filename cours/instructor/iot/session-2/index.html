{label:'Activity 1',title:'Describe the conversations',workTime:'5–6 min',restTime:'5–6 min',next:'Draw a message choreography',work:{q:'Profile the four exchanges in the handover.',copy:'For each campus situation, build a conversation contract: initiator, receiver set, reply dependency, timing and coupling/intermediary. These profiles become evidence for later protocol choices.',items:[['OUTPUT','Four conversation profiles.'],['BE READY TO DEFEND','One property that changes the interaction pattern.'],['GUARDRAIL','Do not use MQTT, CoAP or HTTP as answers yet.']]},rest:{board:{id:'s2-conversation-capture',type:'capture',title:'Class board · What properties change the conversation?',prompt:'Capture short dimensions after groups have committed.',placeholder:'e.g. one-to-many'},questions:[['COMPARE','Which cases are genuinely different even though all move “sensor data”?'],['INITIATOR','Who starts the exchange, and does that matter?'],['COUPLING','Does the sender need to know every receiver?']],challenge:'An alert must reach two services that did not exist when the sensor firmware was written. Which conversation structure handles that naturally?',takeaway:{text:'Interaction patterns come before protocol names.',chain:['Service need','Interaction pattern','Protocol later'],reference:[['Core patterns',['request / response','command / acknowledgement','publish / subscribe','observe / notify']],['Event shape',['periodic telemetry','event notification','streaming']],['Relationship',['one-to-one','one-to-many','directly coupled','broker-mediated']]]},reality:{kind:'examples',items:[['Request / response','client asks → server answers'],['Event','producer emits when state changes'],['Publish / subscribe','publisher → broker → interested subscribers']],question:'These patterns can run over different networks. Which property of the service actually selects the pattern?'}}},
{label:'Activity 2',title:'Draw a message choreography',workTime:'7–8 min',restTime:'5–6 min',next:'Build the stack by responsibility',work:{q:'Make one exchange’s temporal dependencies explicit.',copy:'Reuse one profile from Activity 1, place actors, then add labelled arrows in order. Expose coupling, fan-out and intermediary roles.',items:[['OUTPUT','At least three actors + three labelled messages.'],['BE READY TO DEFEND','Which actor creates coupling or fan-out.'],['GUARDRAIL','Topology is not the same thing as choreography.']]},rest:{board:{id:'s2-choreo-structure',type:'structure',title:'Class choreography · Build one exchange from student contributions',prompt:'Use boxes as actors and labelled arrows as messages. Keep it minimal.',placeholder:'e.g. Sensor'},questions:[['ORDER','Which message must happen first?'],['ROLE','Is the gateway forwarding, translating, brokering or processing?'],['TOPOLOGY ≠ BEHAVIOUR','Could the same boxes support a different conversation?']],challenge:'The dashboard disappears, but storage and alerting still need telemetry. Which choreography is more resilient to that change?',takeaway:{text:'Topology describes available paths; choreography describes actors, ordered messages and roles.',chain:['Actors','Messages','Order','Semantics'],reference:[['Useful actor roles',['producer / sensor','consumer / service','broker','gateway / proxy']],['Message roles',['telemetry','query / response','command / acknowledgement','event / notification']],['Questions to ask',['who initiates?','who knows whom?','what is ordered?','what can be asynchronous?']]]},reality:{kind:'chain',chain:['Sensor','message','Intermediary?','service','response / fan-out?'],question:'A sequence diagram exposes coupling that a static architecture box diagram can hide.'}}},
{label:'Activity 3',title:'Build the stack by responsibility',workTime:'6–7 min',restTime:'5–6 min',next:'Discover network and transport pieces',work:{q:'Construct a blank responsibility stack.',copy:'Place responsibilities into Application exchange, Transport, Network, Adaptation and Local link before any protocol name is shown.',items:[['OUTPUT','All responsibility cards placed.'],['BE READY TO DEFEND','One boundary between two adjacent responsibilities.'],['GUARDRAIL','A suite may span rows; the rows are a reasoning model.']]},rest:{board:{id:'s2-stack-capture',type:'capture',title:'Class stack · What must each level provide?',prompt:'Capture one precise responsibility at a time.',placeholder:'e.g. ordered byte stream'},questions:[['BOUNDARY','What is local-link responsibility versus end-to-end responsibility?'],['TRANSPORT','What does “reliable transport” actually provide?'],['SUITE','Can one technology name span multiple rows of this stack?']],challenge:'If an application uses UDP, does that mean the application itself cannot implement acknowledgements or retries?',takeaway:{text:'A stack is an ordered composition of responsibilities; the five rows are a working model, not a claim about every implementation.',chain:['Application','Transport','Network','Adaptation','Link'],reference:[['Application',['message meaning · resources/topics · operations']],['Transport',['ports/endpoints · datagrams/stream · end-to-end transport behaviour']],['Network',['IP addressing · packet forwarding/routing']],['Adaptation',['IPv6 compression/fragmentation on constrained links']],['Local link',['frames · medium access · immediate-hop transmission']],['Cross-cutting — know it exists',['TLS / DTLS / OSCORE and other security mechanisms · deferred to the security course']]]},reality:{kind:'chain',chain:['Application exchange','Transport','Network','Adaptation','Local link'],question:'A supplier may package several of these responsibilities under one technology name. What evidence would you need before deciding which rows it actually covers?'}}},
{label:'Activity 4',title:'Discover network and transport pieces',workTime:'8–9 min',next:'Discover application exchange protocols',work:{q:'Audit the lower-stack dossier from evidence.',copy:'Place each supplier extract by responsibility, reveal the name, then identify the next responsibility that remains open.',items:[['OUTPUT','Five evidence-based placements + five boundary checks.'],['BE READY TO DEFEND','One boundary you had to revise after the reveal.'],['GUARDRAIL','Continue directly to Activity 5; do not turn this into a vocabulary quiz.']]}},
{label:'Activity 5',title:'Discover application exchange protocols',workTime:'9–10 min',next:'Make the exchange interoperable',work:{q:'Build the application-protocol evidence map.',copy:'Sort evidence fragments into MQTT, CoAP and HTTP, audit the map, then make three service decisions using explicit evidence tags.',items:[['OUTPUT','One audited evidence map + three service decisions.'],['BE READY TO DEFEND','Which evidence actually drove one choice — and which familiar name you rejected.'],['GUARDRAIL','The three studied protocols are examples, not the whole IoT protocol universe.']]}},
{label:'Activity 6',title:'Make the exchange interoperable',workTime:'9–11 min',restTime:'7–8 min',next:'Compose complete stacks',work:{q:'Repair an integration contract, not just a JSON payload.',copy:'Place meaning, application naming and network/transport identifiers at their scope; then repair a second supplier model with incompatible schema, unit and context.',items:[['OUTPUT','One interoperability scope map + one supplier-B repair set.'],['BE READY TO DEFEND','Which incompatibility remains even though bytes and syntax are valid.'],['GUARDRAIL','Do not call every identifier an IP address — and do not put every semantic fact inside a URI/topic.']]},rest:{board:{id:'s2-interop-capture',type:'capture',title:'Class reference · What must another system know to use a measurement?',prompt:'Capture missing meaning/context after groups commit.',placeholder:'e.g. unit'},questions:[['WHAT','Which information gives the payload usable meaning?'],['WHERE / TARGET','Why are IP address, port, hostname, URI path and MQTT topic different?'],['SEMANTICS','When do two systems exchange bytes successfully but still misunderstand the data?']],challenge:'Two sensors publish {"value":25}. One means 25 °C and the other 25 %RH. The transport and protocol are perfect. Is the system interoperable?',takeaway:{text:'Protocol interoperability enables message exchange; semantic interoperability requires shared structure, identifiers and meaning.',chain:['bytes','syntax / schema','context','shared meaning'],reference:[['WHAT · measurement context',['phenomenon · value · unit','timestamp · source','location · quality / validity']],['WHERE · communication endpoint',['hostname','network address','transport port']],['WHAT TARGET · application identity',['resource URI / path','MQTT topic','service / resource discovery']],['Step further',['SenML · measurement representation','CoRE Link Format · resource discovery','W3C WoT TD · interface metadata']]]},reality:{kind:'tech',metrics:[['SenML','RFC 8428 · sensor measurements / parameters'],['/.well-known/core','CoRE Link Format discovery'],['Property · Action · Event','W3C WoT Thing Description interaction model']],question:'Which interoperability problem does each mechanism address: representation, discovery, or interface description?',sources:[['SenML RFC 8428','https://www.rfc-editor.org/rfc/rfc8428.html'],['CoRE Link Format RFC 6690','https://www.rfc-editor.org/rfc/rfc6690.html'],['W3C WoT Thing Description 1.1','https://www.w3.org/TR/wot-thing-description11/']]}}},
{label:'Activity 7',title:'Compose complete stacks',workTime:'11–12 min',restTime:'8–9 min',next:'Choose the delivery semantics',work:{q:'Now assemble real protocol stacks.',copy:'Build the constrained local stack and the gateway-to-cloud stack, then defend a campus communication architecture.',items:[['OUTPUT','Two checked stacks + one campus position + two evidence tags + one caveat.'],['BE READY TO DEFEND','Why pieces coexist rather than compete, and which missing evidence could still change your position.'],['GUARDRAIL','Compare within a responsibility; compose across responsibilities.']]},rest:{board:{id:'s2-compose-compare',type:'compare',title:'Class position · How should the campus exchange information?',prompt:'Tally only after each group has built both stacks.',categories:['Brokered pub/sub + direct resource exchange','One application protocol everywhere','Hybrid by flow','Not enough information']},questions:[['COMPOSITION','Which protocols coexist because they solve different rows of the stack?'],['DEPENDENCY','What does MQTT assume from its underlying transport?'],['THREAD','Where would Thread sit relative to 802.15.4, IPv6/6LoWPAN and the application layer?']],challenge:'A team writes “Thread + TCP + MQTT” as three alternatives. What is wrong with the comparison before you even discuss performance?',takeaway:{text:'Compare protocols within the responsibility they solve, then compose compatible pieces across responsibilities.',chain:['Pattern','Application protocol','Transport','Network / adaptation','Local link'],reference:[['MQTT',['brokered publish/subscribe · topics','QoS 0/1/2 at MQTT message-delivery scope','ordered lossless bidirectional transport expected']],['CoAP',['resource request/response · URIs','CON/NON + lightweight reliability mechanisms','datagram-oriented canonical model']],['HTTP',['request/response · resources/URIs','web/API integration','transport depends on HTTP version']],['Networking pieces',['TCP · reliable in-order byte stream','UDP · datagrams without delivery guarantee','IPv6 · addressing/routing','6LoWPAN · constrained-link adaptation','Thread · IPv6 IoT networking suite']],['Know these also exist',['WebSocket · AMQP · DDS · LwM2M']]]},reality:{kind:'tech',metrics:[['Thread','IPv6 low-power mesh networking suite · IEEE 802.15.4 foundation'],['MQTT','application pub/sub · ordered lossless transport expected'],['CoAP','application resource exchange · datagram-oriented canonical model'],['TCP / UDP','transport choices · reliable byte stream vs datagrams']],question:'The stack can be technically coherent and still have the wrong end-to-end guarantee. What remains to decide?',sources:[['Thread Group','https://threadgroup.org/what-Is-thread/overview'],['MQTT 5.0','https://docs.oasis-open.org/mqtt/mqtt/v5.0/mqtt-v5.0.html'],['CoAP RFC 7252','https://www.rfc-editor.org/rfc/rfc7252.html']]}}},
{label:'Activity 8',title:'Choose the delivery semantics',workTime:'11–13 min',restTime:'8–10 min',next:'Stress-test the exchange',work:{q:'Write the delivery contract before naming a QoS level.',copy:'For four services, decide tolerated loss, duplicate and disconnection; map mechanisms to their scope; then analyse an ACK-loss crash window after actuation.',items:[['OUTPUT','Four delivery contracts + six mechanisms scoped + one crash-window mitigation set.'],['BE READY TO DEFEND','Why lost acknowledgement + retry can duplicate an operation effect.'],['GUARDRAIL','Do not equate MQTT QoS 2 with exactly-once physical actuation.']]},rest:{board:{id:'s2-delivery-capture',type:'capture',title:'Class boundary map · What does “reliable” mean here?',prompt:'Capture the object being guaranteed, not just the word reliable.',placeholder:'e.g. no duplicate physical effect'},questions:[['SCOPE','Exactly once what: bytes, MQTT message, application operation, or physical effect?'],['COOPERATION','Which guarantees need mechanisms at more than one responsibility?'],['DISCONNECTION','Who keeps state while a consumer or sensor is temporarily unavailable?']],challenge:'MQTT delivers a command exactly once to a client, but that client crashes after actuating and before recording completion. Can an upstream retry still duplicate the physical effect?',takeaway:{text:'Delivery semantics are scoped guarantees. End-to-end correctness often composes transport, application-protocol and application/system mechanisms.',chain:['service requirement','delivery scope','mechanism','residual failure'],reference:[['Service need → target semantic',['ambient sample → best effort may be acceptable','critical alert → at least-once message delivery','ventilation command → prevent duplicate operation effect','temporary disconnect → persistence / replay where required']],['Transport scope',['TCP: reliable · in-order · byte stream','UDP: datagrams; delivery/duplicate protection not guaranteed']],['Application-p let stop=0,mode='work';
const scene=document.getElementById('scene'),screenCount=document.getElementById('screenCount');
const revealState={};
function esc(s){return String(s??'').replace(/[&<>\"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;',"'":'&#039;'}[c]))}
const BOARD_STORAGE='iot-projector-session2-liveboards-v3';let boardState={};try{boardState=JSON.parse(sessionStorage.getItem(BOARD_STORAGE)||'{}')||{}}catch(_){boardState={}}
function saveBoards(){try{sessionStorage.setItem(BOARD_STORAGE,JSON.stringify(boardState))}catch(_){}}
function clearRevealState(){Object.keys(revealState).forEach(k=>delete revealState[k])}
function resetClassSession(){if(!confirm('Start a new class? This clears all Live Board entries, tallies, collective architecture content, and open reveals for this projector session.'))return;boardState={};try{sessionStorage.removeItem(BOARD_STORAGE)}catch(_){}clearRevealState();stop=0;mode='work';render()}
function boardData(b){if(!boardState[b.id])boardState[b.id]=b.type==='capture'?{items:[]}:b.type==='structure'?{nodes:[],edges:[]}:{counts:{}};return boardState[b.id]}
function boardHead(b){return `<div class="live-board-head"><div class="live-board-head-main"><strong>${esc(b.title)}</strong><span>${esc(b.prompt)}</span></div><div class="live-board-head-actions"><button class="board-clear-btn" type="button" data-board-reset>Clear board</button><span class="live-board-kind">${esc(b.type)}</span></div></div>`}
function captureBoard(b,d){return `<div class="live-board" data-board="${esc(b.id)}" data-kind="capture">${boardHead(b)}<div class="live-board-body"><form class="board-form" data-capture-form><input name="idea" maxlength="70" autocomplete="off" placeholder="${esc(b.placeholder||'Add a short class idea')}" aria-label="Add class idea"><button class="board-mini-btn primary" type="submit">Add idea</button></form>${d.items.length?`<div class="capture-items">${d.items.map((x,i)=>`<span class="capture-chip">${esc(x)}<button type="button" data-capture-remove="${i}" aria-label="Remove ${esc(x)}">×</button></span>`).join('')}</div>`:`<div class="board-empty">Class ideas appear here after groups have committed.</div>`}<div class="board-principle">Memory of the discussion, not a transcript or a vote.</div></div></div>`}
function nodePositions(n){const cols=n<=5?Math.max(2,n):3,rows=Math.ceil((n||1)/cols),xs=[];for(let i=0;i<n;i++){const c=i%cols,r=Math.floor(i/cols),x=100+(cols===1?0:c*(800/(cols-1))),y=75+r*(rows>1?145:0);xs.push([x,y])}return xs}
function structureSvg(b,d){if(!d.nodes.length)return `<div class="board-empty">Add a few class components or responsibilities, then connect only flows the room can justify.</div>`;const pos=nodePositions(d.nodes.length),marker='arrow-'+b.id.replace(/[^a-z0-9]/gi,'');let edges=d.edges.map(e=>{const a=pos[e.from],z=pos[e.to];if(!a||!z)return '';const dx=z[0]-a[0],dy=z[1]-a[1],len=Math.hypot(dx,dy)||1,ux=dx/len,uy=dy/len,x1=a[0]+90*ux,y1=a[1]+28*uy,x2=z[0]-90*ux,y2=z[1]-28*uy,mx=(x1+x2)/2,my=(y1+y2)/2;return `<line class="edge" x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" marker-end="url(#${marker})"></line>${e.label?`<text class="edge-text" x="${mx}" y="${my-8}">${esc(e.label.slice(0,32))}</text>`:''}`}).join('');let nodes=d.nodes.map((x,i)=>`<g><rect class="node" x="${pos[i][0]-90}" y="${pos[i][1]-28}" width="180" height="56" rx="13"></rect><text class="node-text" x="${pos[i][0]}" y="${pos[i][1]}">${esc(x.length>22?x.slice(0,21)+'…':x)}</text></g>`).join('');return `<div class="structure-canvas"><svg viewBox="0 0 1000 320" role="img" aria-label="Collective class architecture"><defs><marker id="${marker}" markerWidth="9" markerHeight="9" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#72869b"></path></marker></defs>${edges}${nodes}</svg></div>`}
function structureBoard(b,d){const opts=d.nodes.map((x,i)=>`<option value="${i}">${esc(x)}</option>`).join('');return `<div class="live-board" data-board="${esc(b.id)}" data-kind="structure">${boardHead(b)}<div class="live-board-body"><div class="structure-toolbar"><form class="board-form" data-node-form><input name="node" maxlength="45" autocomplete="off" placeholder="${esc(b.placeholder||'Add component or responsibility')}" aria-label="Add component"><button class="board-mini-btn primary" type="submit">Add box</button><button class="board-mini-btn ghost" type="button" data-structure-undo>Undo</button></form>${d.nodes.length>=2?`<form class="board-form structure-edge" data-edge-form><select name="from" aria-label="Flow from">${opts}</select><span>→</span><select name="to" aria-label="Flow to">${opts}</select><input name="label" maxlength="38" autocomplete="off" placeholder="flow label" aria-label="Flow label"><button class="board-mini-btn" type="submit">Add flow</button></form>`:''}</div>${structureSvg(b,d)}<div class="board-principle">Collective model from student contributions — not a hidden reference architecture.</div></div></div>`}
function compareBoard(b,d){return `<div class="live-board" data-board="${esc(b.id)}" data-kind="compare">${boardHead(b)}<div class="live-board-body"><div class="compare-grid">${b.categories.map((c,i)=>`<div class="compare-item"><strong>${esc(c)}</strong><div class="compare-actions"><button type="button" data-compare="${i}" data-delta="-1">−</button><button type="button" data-compare="${i}" data-delta="1">+</button></div><div class="compare-count">${d.counts[c]||0}</div></div>`).join('')}</div><div class="board-principle">Commit first. Aggregate second. The majority is not the answer.</div></div></div>`}
function liveBoardBody(b){const d=boardData(b);return b.type==='capture'?captureBoard(b,d):b.type==='structure'?structureBoard(b,d):compareBoard(b,d)}
const storyBeats=[{"ini": "AM", "name": "Amina", "role": "Campus operations lead", "tag": "Operating brief", "text": "Integration rejects arrows labelled only telemetry, alert or command: they describe what moves, not how each service behaves."}, {"ini": "LE", "name": "Leila", "role": "Platform engineer", "tag": "Integration review", "text": "The static architecture shows who is connected, but not message order, blocking replies or fan-out."}, {"ini": "YN", "name": "Yanis", "role": "Network architect", "tag": "Supplier meeting", "text": "A supplier slide presents MQTT, TCP, Thread and Wi-Fi as four “protocol options”, and procurement is treating them as alternatives."}, {"ini": "YN", "name": "Yanis", "role": "Network architect", "tag": "Technical dossier", "text": "IPv6, 6LoWPAN, TCP, UDP and Thread are listed without mapping them to communication responsibilities."}, {"ini": "LE", "name": "Leila", "role": "Platform engineer", "tag": "Application review", "text": "Fan-out telemetry and direct maintenance access are both labelled only “application messaging”."}, {"ini": "LE", "name": "Leila", "role": "Platform engineer", "tag": "Integration incident", "text": "The platform receives {\"value\":812} without transport errors but still cannot interpret the measurement safely."}, {"ini": "YN", "name": "Yanis", "role": "Network architect", "tag": "Stack audit", "text": "The same document approves both “MQTT over TCP” and “MQTT versus Thread”."}, {"ini": "AM", "name": "Amina", "role": "Campus operations lead", "tag": "Acceptance review", "text": "The claim “MQTT QoS 1 + TCP = reliable command” says nothing about whether the physical effect occurred once, twice or at all."}, {"ini": "ST", "name": "Sam", "role": "Field technician", "tag": "Live incident", "text": "The report blames “communication”, even though at least one mechanism behaved exactly as specified."}];
function workScreen(c){const sb=storyBeats[stop];const beat=sb?`<div class="story-beat"><div class="story-avatar">${esc(sb.ini)}</div><div><div class="story-meta"><strong>${esc(sb.name)}</strong><span>${esc(sb.role)}</span><b>${esc(sb.tag)}</b></div><small class="story-input-label">NEW INPUT</small><p>${esc(sb.text)}</p></div></div>`:'';return `<div class="phase-kicker">WORK</div>${beat}<div class="projector-move">YOUR MOVE</div><div class="work-simple"><div class="work-simple-main"><h2>${esc(c.work.q)}</h2><p>${esc(c.work.copy)}</p><span class="work-time">Work target · ${esc(c.workTime)}</span></div><div class="work-deliverables">${c.work.items.map(x=>`<div class="work-item"><b>${esc(x[0])}</b><span>${esc(x[1])}</span></div>`).join('')}</div></div>`}
function takeawayBody(t){return `<div class="takeaway-text">${esc(t.text)}</div>${t.chain?`<div class="takeaway-chain" style="margin-top:9px">${t.chain.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}${t.reference?`<div class="reference-plate">${t.reference.map(g=>`<section><b>${esc(g[0])}</b><div>${g[1].map(x=>`<span>${esc(x)}</span>`).join('')}</div></section>`).join('')}</div>`:''}`}
function realityBody(r){if(!r)return '';let h='<div class="mini-reality">';if(r.kind==='examples')h+=`<div class="mini-metrics">${r.items.map(x=>`<div class="mini-metric"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(r.kind==='metrics'||r.kind==='tech')h+=`<div class="mini-metrics">${r.metrics.map(x=>`<div class="mini-metric"><strong>${esc(x[0])}</strong><span>${esc(x[1])}</span></div>`).join('')}</div>`;if(r.kind==='chain'||r.kind==='delta')h+=`<div class="mini-chain">${r.chain.map((x,i)=>`${i?'<b>→</b>':''}<span>${esc(x)}</span>`).join('')}</div>`;h+=`<p><strong>Interpret it:</strong> ${esc(r.question)}</p>`;if(r.sources)h+=`<div class="reality-source">Official sources: ${r.sources.map(s=>`<a href="${s[1]}" target="_blank" rel="noopener">${esc(s[0])}</a>`).join(' · ')}</div>`;return h+'</div>'}
function discussionDeck(r){const cards=[...(r.questions||[]).map(q=>[q[0],q[1]]),['STRESS TEST',r.challenge]];return `<aside class="discussion-deck"><div class="discussion-deck-head"><div class="phase-kicker">DISCUSS FIRST</div><h3>Turn a card when the room needs a prompt.</h3><p>Use the class artefact first. The cards are facilitation prompts, not a checklist you must exhaust.</p></div><div class="discussion-card-grid">${cards.map(([label,text],i)=>`<button class="discussion-flip" type="button" data-discuss-card="${i}" aria-expanded="false"><span class="discussion-flip-inner"><span class="discussion-face discussion-front"><b>${esc(label)}</b><strong>${i===cards.length-1?'Stress the claim':'Open a question'}</strong><small>Turn card →</small></span><span class="discussion-face discussion-back"><span>${esc(text)}</span><small>Click again to hide</small></span></span></button>`).join('')}</div><div class="discussion-rule">Then conclude: reveal <b>What to keep</b>, and only afterwards use <b>Reality check</b> to ground or extend the concept.</div></aside>`}
function restScreen(c){const r=c.rest,rv=revealState[stop]||{};const panel=rv.panel||null;const main=r.board?liveBoardBody(r.board):`<div class="no-board"><div class="phase-kicker">Compare your artifacts</div><h3>Failure → responsibility → revision</h3><p>Keep the group stress-test notes visible. Compare where groups located the failure and why their revision belongs at that responsibility.</p><div class="delta-row"><div class="delta-card"><b>Failure</b><span>Observed broken guarantee or unavailable dependency</span></div><div class="delta-arrow">→</div><div class="delta-card"><b>Revision</b><span>Mechanism added or changed at the responsible layer</span></div></div></div>`;const synthesis=panel?`<div class="synthesis-content ${panel}"><b class="synthesis-head">${panel==='takeaway'?'What to keep':'Reality check'}</b>${panel==='takeaway'?takeawayBody(r.takeaway):realityBody(r.reality)}</div>`:'';return `<div class="phase-kicker">RESTITUTION</div><div class="restitution-grid"><div class="restitution-main">${main}</div>${discussionDeck(r)}<div class="synthesis-dock ${panel?'open':''}"><div class="synthesis-bar"><div><b>Conclude</b><span>Institutionalise the essentials, then ground them.</span></div><div class="reveal-actions"><button class="reveal-btn ${panel==='takeaway'?'active':''}" type="button" data-reveal="takeaway">What to keep</button><button class="reveal-btn ${panel==='reality'?'active':''}" type="button" data-reveal="reality">Reality check</button></div></div>${synthesis}</div></div>`}
function renderProgress(){document.getElementById('stopProgress').innerHTML=checkpoints.map((c,i)=>`<button type="button" aria-label="${esc(c.label)} · ${esc(c.title)}" class="${i<stop?'visited':''} ${i===stop?'active':''}" data-jump="${i}"></button>`).join('');document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>{stop=+b.dataset.jump;mode='work';render()})}
function render(){const c=checkpoints[stop],hasRest=!!c.rest;if(mode==='rest'&&!hasRest)mode='work';scene.dataset.stop=stop;scene.classList.toggle('live-board-mode',mode==='rest'&&!!c.rest?.board);scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">${esc(c.label)} of ${checkpoints.length} · ${mode==='work'?'Class work':'Class restitution'}</div><h1>${esc(c.title)}</h1></div><div><span class="mode-pill">${mode==='work'?'WORK':'RESTITUTION'}</span></div></div><div class="shell stage simple-stage ${mode==='rest'&&c.rest?.board?'live-board-stage':''}"><div class="phase-content">${mode==='work'?workScreen(c):restScreen(c)}</div></div>`;screenCount.textContent=`${stop+1}/${checkpoints.length} · ${mode==='work'?'WORK':'RESTITUTION'}`;document.documentElement.style.setProperty('--accent',getComputedStyle(scene).getPropertyValue('--accent'));document.getElementById('backBtn').disabled=stop===0&&mode==='work';const btn=document.getElementById('advanceBtn');btn.textContent=mode==='work'?(hasRest?'Start restitution →':(stop===checkpoints.length-1?'Session complete':'Next activity →')):(stop===checkpoints.length-1?'Session complete':'Next activity →');btn.disabled=stop===checkpoints.length-1&&mode==='rest';renderProgress()}
function advance(){const c=checkpoints[stop];if(mode==='work'&&c.rest){mode='rest'}else if(stop<checkpoints.length-1){stop++;mode='work'}render()}
function back(){if(mode==='rest'){mode='work'}else if(stop>0){stop--;mode=checkpoints[stop].rest?'rest':'work'}render()}
scene.addEventListener('submit',e=>{const host=e.target.closest('.live-board');if(!host)return;e.preventDefault();const b=checkpoints[stop].rest?.board;if(!b)return;const d=boardData(b);if(e.target.matches('[data-capture-form]')){const v=(new FormData(e.target).get('idea')||'').trim();if(v&&!d.items.includes(v)){d.items.push(v);saveBoards();render()}}if(e.target.matches('[data-node-form]')){const v=(new FormData(e.target).get('node')||'').trim();if(v&&!d.nodes.includes(v)){d.nodes.push(v);saveBoards();render()}}if(e.target.matches('[data-edge-form]')){const f=new FormData(e.target),from=+f.get('from'),to=+f.get('to'),label=(f.get('label')||'').trim();if(Number.isInteger(from)&&Number.isInteger(to)&&from!==to){d.edges.push({from,to,label});saveBoards();render()}}});
scene.addEventListener('click',e=>{const flip=e.target.closest('[data-discuss-card]');if(flip){flip.classList.toggle('flipped');flip.setAttribute('aria-expanded',flip.classList.contains('flipped')?'true':'false');return}if(e.target.matches('[data-reveal]')){const k=e.target.dataset.reveal;revealState[stop]=revealState[stop]||{};revealState[stop].panel=revealState[stop].panel===k?null:k;render();return}const host=e.target.closest('.live-board');if(!host)return;const b=checkpoints[stop].rest?.board;if(!b)return;const d=boardData(b);if(e.target.matches('[data-capture-remove]')){d.items.splice(+e.target.dataset.captureRemove,1);saveBoards();render()}else if(e.target.matches('[data-compare]')){const cat=b.categories[+e.target.dataset.compare],delta=+e.target.dataset.delta;d.counts[cat]=Math.max(0,(d.counts[cat]||0)+delta);saveBoards();render()}else if(e.target.matches('[data-structure-undo]')){if(d.edges.length)d.edges.pop();else if(d.nodes.length){const gone=d.nodes.length-1;d.nodes.pop();d.edges=d.edges.filter(x=>x.from!==gone&&x.to!==gone)}saveBoards();render()}else if(e.target.matches('[data-board-reset]')){if(confirm('Clear this board?')){delete boardState[b.id];saveBoards();render()}}});
document.getElementById('advanceBtn').onclick=advance;document.getElementById('backBtn').onclick=back;document.getElementById('newClassBtn').onclick=resetClassSession;document.getElementById('fullscreenBtn').onclick=()=>document.documentElement.requestFullscreen?.();document.addEventListener('keydown',e=>{if(e.target.matches('input,textarea,select,button'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();advance()}else if(e.key==='ArrowLeft'){e.preventDefault();back()}else if(e.key.toLowerCase()==='f'){document.documentElement.requestFullscreen?.()}});render();
