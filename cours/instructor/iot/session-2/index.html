<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 2 Projector — IoT Systems Design</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 2 · Communication & protocols</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":2,"activities":[{"title":"Start from the service conversation","workTime":"6 min","stopTime":"4 min","work":{"question":"What kind of conversation does the service need?","support":"Use the service arrows first: one-way, request/response, publish/subscribe or command/acknowledgement. No protocol names are needed yet.","produce":["A conversation type for each campus case.","The arrow or waiting behaviour that justifies each choice."],"visual":{"title":"The protocol stack is not the starting point.","note":"First describe the service behaviour. The protocol stack comes next.","conversation":{"label":"Service behaviour","value":"one-way · request/response · publish/subscribe · command/ack","tone":"current","detail":"This sits conceptually above the protocol choices."},"stacks":[{"label":"Protocol stack — not filled yet","rows":[{"name":"Application","value":"—","tone":"future"},{"name":"Transport","value":"—","tone":"future"},{"name":"Network","value":"—","tone":"future"},{"name":"Local path","value":"—","tone":"future"}]}]}},"stop":{"question":"What should be known before we name any protocol?","probeTitle":"Keep the conversation separate from its implementation.","probe":["Who initiates, who receives, and is a reply part of the service exchange?","Does one producer need to reach one receiver or several?"],"complements":["The interaction pattern describes service behaviour; it is not itself a protocol choice.","The same interaction idea can be implemented in different ways, so protocol choice comes later."],"visual":{"title":"First piece of the map","conversation":{"label":"Service behaviour","value":"interaction pattern","tone":"learned","detail":"This behaviour will constrain the top row we add next."},"stacks":[{"label":"Next we open the stack","rows":[{"name":"Application","value":"—","tone":"future"},{"name":"Transport","value":"—","tone":"future"},{"name":"Network","value":"—","tone":"future"},{"name":"Local path","value":"—","tone":"future"}]}]}}},{"title":"Build the stack map","workTime":"8 min","stopTime":"5 min","work":{"question":"What four different jobs make one useful message travel?","support":"Separate application, transport, network and local path. Place each responsibility on the right row.","produce":["The six clues placed on the four rows.","One sentence explaining why two different rows are not direct alternatives."],"visual":{"title":"One message crosses four different responsibilities.","conversation":{"label":"Service behaviour","value":"already known","tone":"learned"},"stacks":[{"label":"Responsibility map","rows":[{"name":"Application","value":"service messages / resources","tone":"current"},{"name":"Transport","value":"program-to-program delivery","tone":"current"},{"name":"Network","value":"addressing + routing","tone":"current"},{"name":"Local path","value":"immediate connectivity","tone":"current"}]}]}},"stop":{"question":"What did the stack separate that “the network” hid?","probeTitle":"Now attach one familiar example.","probe":["Which row decides what a service request means?","Which row gets the device onto the immediate network?"],"complements":["HTTP/1.1, TCP, IP and Wi-Fi can coexist because they answer different responsibilities.","This four-row map is a design model: real technology suites can sometimes span more than one row."],"visual":{"title":"A familiar complete stack","conversation":{"label":"Service behaviour","value":"request / response","tone":"learned"},"stacks":[{"label":"Web/API example","rows":[{"name":"Application","value":"HTTP/1.1","tone":"learned"},{"name":"Transport","value":"TCP","tone":"learned"},{"name":"Network","value":"IP","tone":"learned"},{"name":"Local path","value":"Wi-Fi","tone":"learned"}]}],"callout":"These four names are composed in one path; they are not four competing choices."}}},{"title":"Place the application protocols","workTime":"8 min","stopTime":"5 min","work":{"question":"Which application protocol best matches each service behaviour?","support":"MQTT, CoAP and HTTP are now shown in the same Application row. Compare them only against each other, using the service need.","produce":["One application-protocol choice for each case.","The service behaviour that drove the choice."],"visual":{"title":"Today we fill only the Application row.","conversation":{"label":"Service behaviour","value":"drives the application choice","tone":"learned"},"stacks":[{"label":"Application alternatives","rows":[{"name":"Application","value":"MQTT · CoAP · HTTP","tone":"current"},{"name":"Transport","value":"?","tone":"future"},{"name":"Network","value":"IP / IPv6","tone":"future"},{"name":"Local path","value":"local path from S1","tone":"future"}]}],"callout":"MQTT, CoAP and HTTP are all application-level choices in this course model."}},"stop":{"question":"Why is MQTT vs CoAP meaningful, while MQTT vs Wi-Fi is not?","probeTitle":"Compare within a responsibility.","probe":["Which service behaviour naturally points to MQTT in today’s cases?","Which one naturally points to CoAP or HTTP?"],"complements":["MQTT is a client/server publish-subscribe messaging protocol; CoAP and HTTP are resource-oriented request/response protocols with different design targets.","An application choice still needs transport, network and local connectivity below it."],"visual":{"title":"Application row filled","conversation":{"label":"Service behaviour","value":"request/response or publish/subscribe","tone":"learned"},"stacks":[{"label":"Same row — valid comparison","rows":[{"name":"Application","value":"MQTT · CoAP · HTTP","tone":"learned"},{"name":"Transport","value":"next","tone":"current"},{"name":"Network","value":"IP / IPv6","tone":"future"},{"name":"Local path","value":"local path","tone":"future"}]}]}}},{"title":"Add transport and IP","workTime":"7 min","stopTime":"","work":{"question":"What sits immediately below the application protocol?","support":"Use three reference paths: MQTT with an ordered/lossless stream such as TCP, base CoAP over UDP, and HTTP/1.1 over TCP. IP/IPv6 provides network addressing and routing below transport.","produce":["The reference transport for MQTT, base CoAP and HTTP/1.1.","A clear distinction between transport and network responsibilities."],"visual":{"title":"The middle of the stack becomes concrete.","conversation":{"label":"Service behaviour","value":"already mapped to an application protocol","tone":"learned"},"stacks":[{"label":"Reference bindings used today","rows":[{"name":"Application","value":"MQTT / CoAP / HTTP/1.1","tone":"learned"},{"name":"Transport","value":"TCP or UDP","tone":"current"},{"name":"Network","value":"IP / IPv6","tone":"current"},{"name":"Local path","value":"not filled yet","tone":"future"}]}],"callout":"This is a teaching reference path, not a claim that every protocol version has only one possible transport."}}},{"title":"Connect the stack to the local path","workTime":"8 min","stopTime":"5 min","work":{"question":"What changes when the device reaches IPv6 through a different local connectivity path?","support":"Compare two complete CoAP stacks. Thread is introduced here: an IPv6-based low-power mesh stack using IEEE 802.15.4 radios.","produce":["Which rows stay the same across the two reference stacks.","Which local connectivity part changes.","Why MQTT and Wi-Fi are not direct alternatives."],"visual":{"title":"Same upper stack, different local path","note":"Now the Session 1 access technologies reconnect to the stack.","stacks":[{"label":"Connected building","rows":[{"name":"Application","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IPv6","tone":"learned"},{"name":"Local path","value":"Wi-Fi","tone":"current"}]},{"label":"Constrained local network","rows":[{"name":"Application","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IPv6","tone":"learned"},{"name":"Local path","value":"Thread over IEEE 802.15.4","tone":"current"}]}],"callout":"Thread provides an IPv6-based constrained local networking path using IEEE 802.15.4 radios."}},"stop":{"question":"What does “compare within a row; compose across rows” mean now that you can see the full stack?","probeTitle":"Use the two complete stacks.","probe":["Which rows remained unchanged when the local path changed?","Why can CoAP and Wi-Fi appear together without being alternatives?"],"complements":["The rows represent responsibilities, so a real suite such as Thread can span details across the lower part of the model; other Session 1 families may also introduce gateways or network services.","Changing local connectivity does not automatically require changing application or transport if the required network interfaces remain available."],"visual":{"title":"The stack is now complete","stacks":[{"label":"Example A","rows":[{"name":"Application","value":"HTTP/1.1","tone":"learned"},{"name":"Transport","value":"TCP","tone":"learned"},{"name":"Network","value":"IP","tone":"learned"},{"name":"Local path","value":"Wi-Fi","tone":"learned"}]},{"label":"Example B","rows":[{"name":"Application","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IPv6","tone":"learned"},{"name":"Local path","value":"Thread over IEEE 802.15.4","tone":"learned"}]}],"callout":"MQTT / CoAP / HTTP: compare at Application. TCP / UDP: compare at Transport. Wi-Fi / constrained local paths: compare lower in the stack."}}},{"title":"Add shared meaning","workTime":"6 min","stopTime":"4 min","work":{"question":"The payload arrived. Can the receiver interpret {\"value\":812} without guessing?","support":"Add the data meaning needed by another system: quantity, unit, observation time and source.","produce":["The core semantic fields selected.","One distinction between network addressing, application naming and payload meaning."],"visual":{"title":"Successful delivery is still not usable information.","stacks":[{"label":"Delivery path","rows":[{"name":"Application","value":"Application protocol","tone":"learned"},{"name":"Transport","value":"Transport","tone":"learned"},{"name":"Network","value":"IP / IPv6","tone":"learned"},{"name":"Local path","value":"Local path","tone":"learned"}]}],"callout":"After the stack delivers the message, a data contract still has to say what the payload means: quantity, unit, time, source, schema…"}},"stop":{"question":"Which part of the system succeeded when bytes arrived, and what was still missing?","probeTitle":"Separate delivery from interpretation.","probe":["What does an IP address tell you?","What does a topic/URI tell you? What must the data contract add?"],"complements":["Network and application identifiers help deliver or name data; they do not define the physical quantity represented by the payload.","Interoperability therefore includes shared semantics, not just compatible protocol stacks."],"visual":{"title":"Full communication picture","stacks":[{"label":"Protocol path","rows":[{"name":"Application","value":"Application","tone":"learned"},{"name":"Transport","value":"Transport","tone":"learned"},{"name":"Network","value":"Network","tone":"learned"},{"name":"Local path","value":"Local path","tone":"learned"}]}],"callout":"Shared meaning sits alongside/above the delivered payload: quantity + unit + time + source."}}},{"title":"Build one complete campus stack","workTime":"9 min","stopTime":"7 min FINAL","work":{"question":"Can you now build one coherent exchange from the service need down?","support":"Choose one service case and fill the rows in order. Every protocol name should now have a visible responsibility.","produce":["Service behaviour.","Application protocol.","Transport.","Network.","Local path.","The data meaning carried with the payload."],"visual":{"title":"The map you should be able to reconstruct","conversation":{"label":"Service behaviour","value":"interaction pattern","tone":"learned"},"stacks":[{"label":"Complete stack","rows":[{"name":"Application","value":"MQTT / CoAP / HTTP","tone":"learned"},{"name":"Transport","value":"TCP / UDP","tone":"learned"},{"name":"Network","value":"IP / IPv6","tone":"learned"},{"name":"Local path","value":"Wi-Fi / Thread–802.15.4 / other access","tone":"learned"}]}],"callout":"Start from the service. Move downward. Do not start from a favourite protocol name."}},"stop":{"question":"Tell the end-to-end story without starting from a protocol name.","probeTitle":"Can every decision be placed on the map?","probe":["Which application protocol did you choose, and what service behaviour drove it?","Which lower-path decision comes from deployment constraints rather than application semantics?"],"complements":["A clean stack makes category errors visible: protocols at different responsibilities can coexist rather than compete.","The next systems question is placement: where should sensing, decisions, storage and processing actually run?"],"visual":{"title":"Session 2 mental model","conversation":{"label":"Service behaviour","value":"who talks to whom, and why","tone":"learned"},"stacks":[{"label":"Communication stack","rows":[{"name":"Application","value":"Application protocol","tone":"learned"},{"name":"Transport","value":"Transport","tone":"learned"},{"name":"Network","value":"IP / IPv6","tone":"learned"},{"name":"Local path","value":"Local connectivity path","tone":"learned"}]}],"callout":"Then add shared meaning so the delivered payload is interpretable."}}}],"conclusion":{"title":"What we keep from Session 2","subtitle":"Every protocol name should now have a visible job in one end-to-end communication path.","takeaways":["Start with service behaviour, then choose an application protocol that supports it.","Application, transport, network and local connectivity are different responsibilities: compare alternatives within a responsibility and compose compatible mechanisms across them.","A delivered message still needs shared meaning — quantity, unit, time, source and schema — before another system can use it."],"modelLabel":"THE MAP WE KEEP","model":["Service behaviour","Application","Transport","Network","Local path","Shared meaning"],"nextLabel":"NEXT","next":"The communication path is clear. Where should sensing, decisions, storage and processing actually run?"}};</script><script src="../assets/projector.js"></script></body></html>
