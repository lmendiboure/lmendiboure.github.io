<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 2 Projector — IoT Systems Design</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 2 · Projector</small></div><div class="progress" id="progress"></div><div class="top-actions"><a class="btn optional" href="notes.html">Notes</a><a class="btn optional" href="../../../iot/session-2/">Student</a><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":2,"activities":[{"title":"Describe the conversation","workTime":"6 min","stopTime":"5 min","work":{"question":"What must happen between the two sides before we name a protocol?","support":"For each service case, focus on three questions: who starts, who receives, and whether the sender must wait before the exchange is considered complete.","produce":["One case where waiting matters.","One one-to-many case.","One command case with the evidence your group expects in return."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."},"stop":{"question":"Which property actually changes the conversation?","compare":"Compare two student decisions first. Name the difference or boundary before revealing the complementary anchor.","complements":["Initiator, receiver set and waiting behaviour are three independent axes: two exchanges can use the same protocol yet have different service behaviour.","One-to-many delivery can motivate an intermediary such as a broker because it reduces sender knowledge of receivers; it is an architectural choice, not a synonym for IoT messaging."]}},{"title":"Make message order visible","workTime":"7 min","stopTime":"","work":{"question":"What happens first, what comes back, and what evidence is still missing?","support":"Complete two steps: first order the command, acknowledgement and physical-state observation; then choose how one update should reach several services.","produce":["A defensible three-event sequence.","Your interpretation of what the acknowledgement proves.","One-to-many delivery with or without an intermediary, with one reason."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."}},{"title":"Separate four communication jobs","workTime":"7 min","stopTime":"5 min","work":{"question":"What different jobs are hidden inside “communication”?","support":"Separate the communication problem into four responsibilities: application, transport, network and local access. Place each clue where your group thinks it belongs.","produce":["One decision for each responsibility.","One boundary between two responsibilities your group can explain.","One pair of technology names that should not be compared as direct alternatives."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."},"stop":{"question":"Why is “MQTT versus Thread” usually the wrong first comparison?","compare":"Compare two student decisions first. Name the difference or boundary before revealing the complementary anchor.","complements":["A protocol suite can span more than one responsibility; Thread is therefore not always a single-row label in the same sense as TCP or MQTT.","A lower-path change can leave upper decisions intact only when the resulting interfaces and protocol bindings remain compatible."]}},{"title":"Read one complete stack","workTime":"8 min","stopTime":"","work":{"question":"Can students read one full path before they are asked to build one?","support":"Read the complete worked path first. Then complete only the missing rows of the second stack using the service description and the lower path already provided.","produce":["The two missing stack choices.","A reason for each choice based on the service need.","One thing the worked example helped you infer about how a stack is organised."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."}},{"title":"Choose the application exchange","workTime":"8 min","stopTime":"5 min","work":{"question":"Which application protocol matches the service behaviour?","support":"Use the compact MQTT / CoAP / HTTP reference to choose an application exchange for each service case. Base the choice on service behaviour, not familiarity with the name.","produce":["One application-protocol choice per service case.","The service property that drove each choice.","One case where more than one option could be defensible, if assumptions change."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."},"stop":{"question":"Which choices are genuine alternatives, and which technologies could coexist below them?","compare":"Compare two student decisions first. Name the difference or boundary before revealing the complementary anchor.","complements":["Different services in the same IoT system can legitimately use different application protocols; consistency is required end-to-end per exchange, not one protocol everywhere.","An application-protocol choice still comes with compatibility constraints and standard bindings below it; modularity does not mean arbitrary stacking."]}},{"title":"Compose — then check compatibility","workTime":"9 min","stopTime":"","work":{"question":"Can mechanisms from different responsibilities simply be stacked together?","support":"Build one telemetry path, inspect the deliberately questionable path, then change only the local-access side and test what can remain unchanged above it.","produce":["One composed communication path.","The first compatibility boundary your group questions.","One upper decision that may survive a lower-path change, with a reason."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."}},{"title":"Make the payload usable","workTime":"7 min","stopTime":"5 min","work":{"question":"Why is {\"value\":812} still not enough even though delivery succeeded?","support":"The message arrived, but {\"value\":812} is still ambiguous. Add the minimum context needed for another system to interpret it correctly.","produce":["The missing fields your group considers essential.","One example where delivery succeeds but interpretation fails.","A distinction between addressing the data and defining its meaning."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."},"stop":{"question":"What succeeded in the 25 °C versus 25 %RH counterexample, and what failed?","compare":"Compare two student decisions first. Name the difference or boundary before revealing the complementary anchor.","complements":["A URI, topic or network address helps locate an exchange; it does not by itself define the physical quantity represented by the payload.","As systems evolve, schemas, vocabularies and versioning become part of maintaining shared meaning — not just valid syntax."]}},{"title":"Defend one end-to-end design","workTime":"8 min","stopTime":"6 min FINAL","work":{"question":"Can the group explain one campus exchange without starting from a protocol name?","support":"Defend one complete campus exchange from the service need downward. Do not start from a protocol name; explain why each decision follows from the previous one.","produce":["One end-to-end causal story.","One application decision tied to service behaviour.","One lower-path decision tied to deployment assumptions."],"guardrail":"Do not front-load vocabulary. Restate the engineering question first; formalise the term only after students have made the distinction."},"stop":{"question":"Where is the most important boundary in your design?","compare":"Compare two student decisions first. Name the difference or boundary before revealing the complementary anchor.","complements":["An end-to-end design should make its deployment assumptions and compatibility boundaries explicit so another engineer can tell where the reasoning may stop being valid.","The next robustness question is not “which protocol is best?” but “what happens when messages, nodes or dependencies fail, retry or disagree?”"]}}]};</script><script src="../assets/projector.js"></script></body></html>
