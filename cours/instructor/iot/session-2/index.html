<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 2 Projector — IoT Systems Design</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 2 · Communication & protocols</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":2,"activities":[{"title":"Start from the service interaction","workTime":"6 min","stopTime":"5 min","work":{"question":"What interaction does the service need?","support":"Describe the exchange before naming protocols: one-way update, request/response, publish/subscribe or command/acknowledgement.","produce":["An interaction pattern for each campus case.","The arrow or waiting behaviour that justifies each choice."],"visual":{"title":"Start above the protocol stack.","note":"This describes the service interaction — not a protocol yet.","conversation":{"label":"Service interaction","value":"Who exchanges what, with whom, and is a reply expected?","tone":"current"},"stacks":[{"label":"Communication stack — deliberately empty for now","rows":[{"name":"Application protocol","value":"—","tone":"future"},{"name":"Transport","value":"—","tone":"future"},{"name":"Network","value":"—","tone":"future"},{"name":"Local connectivity","value":"—","tone":"future"}]}]}},"stop":{"question":"What is the practical difference between these four interaction patterns?","probeTitle":"Use the arrows, not the protocol names.","probe":["Who initiates the exchange, and is a reply part of the service?","Does the producer know every receiver, or can producers and consumers be decoupled?"],"complements":["Request/response couples a request to a reply; publish/subscribe decouples producers from consumers through an intermediary/broker.","Command/acknowledgement makes digital handling explicit; as established in S1, it does not by itself prove the physical effect.","These are useful reference interaction patterns, not mutually exclusive protocol classes: one IoT system can combine several of them. Command/acknowledgement is the control-oriented refinement carried over from Session 1."],"visual":{"kicker":"AFTER YOUR CASES · KEEP THESE FOUR SHAPES","title":"Four different application interactions","patterns":[{"title":"One-way update","flow":"producer → receiver","use":"Send an event/sample when no reply is part of the service."},{"title":"Request / response","flow":"requester → resource/service → reply","use":"Ask for current state or perform an operation and expect a reply."},{"title":"Publish / subscribe","flow":"publisher → broker → subscribers","use":"One producer feeds multiple or changing consumers without addressing each directly."},{"title":"Command / acknowledgement","flow":"controller → device → ACK","use":"Confirm digital acceptance/rejection of a command.","watch":"Physical-state feedback is a separate flow."}],"callout":"These are interaction patterns. The next activity asks which communication responsibilities are needed to implement them."}}},{"title":"Build the stack map","workTime":"7 min","stopTime":"4 min","work":{"question":"Which communication responsibility does each job belong to?","support":"Build the map we will reuse all session: Application protocol, Transport, Network and Local connectivity. This is a design map, not a strict OSI diagram.","produce":["The six clues placed on the four rows.","One sentence explaining why two different rows are not direct alternatives."],"visual":{"title":"Four communication responsibilities — still no protocol answer.","conversation":{"label":"Service interaction","value":"already known from Activity 1","tone":"learned"},"stacks":[{"label":"Design map to fill","rows":[{"name":"Application protocol","value":"application message / resource exchange","tone":"current"},{"name":"Transport","value":"process-to-process transfer","tone":"current"},{"name":"Network","value":"addressing + routing across networks","tone":"current"},{"name":"Local connectivity","value":"reach the first local network / access infrastructure","tone":"current"}]}],"callout":"The rows answer different questions; mechanisms in different rows can coexist in one path."}},"stop":{"question":"Can you now explain why HTTP, TCP, IP and Wi-Fi are not four competing technologies?","probeTitle":"One familiar example makes the map concrete.","probe":["What job does each row perform?","Which comparisons would be category errors?"],"complements":["Application protocol describes the application exchange; transport moves data between processes; IP addresses/routes packets; local connectivity gets the device onto the immediate network.","This four-row view is intentionally a design map, not a complete OSI model."],"visual":{"title":"One message path, four different jobs","conversation":{"label":"Service interaction","value":"for example: browser asks for a resource","tone":"learned"},"stacks":[{"label":"Familiar reference path","rows":[{"name":"Application protocol","value":"HTTP/1.1","tone":"learned","detail":"web/API request-response exchange"},{"name":"Transport","value":"TCP","tone":"learned","detail":"reliable ordered byte stream between processes"},{"name":"Network","value":"IP","tone":"learned","detail":"host/network addressing and routing"},{"name":"Local connectivity","value":"Wi-Fi","tone":"learned","detail":"local wireless access to the IP network"}]}],"callout":"Compare alternatives within a job. Compose compatible mechanisms across jobs."}}},{"title":"Place the application protocols","workTime":"8 min","stopTime":"6 min","work":{"question":"Which application protocol best matches each service interaction?","support":"Now — and only now — compare MQTT, CoAP and HTTP because all three occupy the Application-protocol part of the map.","produce":["One application-protocol choice for each case.","The service interaction that drove the choice."],"visual":{"title":"We are filling one row only.","conversation":{"label":"Service interaction","value":"use the interaction pattern from Activity 1","tone":"learned"},"stacks":[{"label":"Application-protocol candidates","rows":[{"name":"Application protocol","value":"MQTT · CoAP · HTTP","tone":"current"},{"name":"Transport","value":"later","tone":"future"},{"name":"Network","value":"later","tone":"future"},{"name":"Local connectivity","value":"later","tone":"future"}]}],"callout":"The task is not “which protocol is best?” but “which protocol model matches this service exchange?”"}},"stop":{"question":"After trying the cases, what are the real differences between MQTT, CoAP and HTTP?","probeTitle":"Choose by interaction and ecosystem, not by protocol popularity.","probe":["When does brokered publish/subscribe simplify the service?","When is direct resource-oriented request/response the more natural model?"],"complements":["MQTT is brokered publish/subscribe; CoAP is a compact resource-oriented protocol designed for constrained environments; HTTP is the standard web/API request-response ecosystem.","CoAP can also support observation/notifications, so the table describes strong reference fits rather than absolute exclusivity."],"visual":{"kicker":"AFTER YOUR CHOICES · APPLICATION PROTOCOL REFERENCE","title":"Same layer, different interaction and deployment strengths","table":{"columns":["Protocol","Core interaction model","Typical strength","Infrastructure / relationship","Remember"],"rows":[{"cells":["MQTT","publish / subscribe","decoupled telemetry/events to multiple consumers","clients ↔ broker ↔ subscribers","topic-based messaging; broker is part of the architecture"]},{"cells":["CoAP","resource-oriented request / response","constrained devices and compact device/service APIs","client ↔ resource server","GET/PUT/etc.; observation is possible too"]},{"cells":["HTTP","web/API request / response","browser, web and enterprise-service integration","client ↔ web/API server","ubiquitous ecosystem; HTTP/1.1 is our reference version today"]}],"note":"All three are application protocols. Selecting one does not yet select TCP/UDP, IP connectivity or the local radio/access path."},"callout":"This is the key category rule: MQTT vs CoAP is a valid comparison; MQTT vs Wi-Fi is not."}}},{"title":"Add transport and IP","workTime":"6 min","stopTime":"4 min","work":{"question":"What job do TCP, UDP and IP perform below the application protocol?","support":"Use the definitions of TCP, UDP and IP to place them. Then try the three application cases before we reveal the reference bindings.","produce":["The reference transport for MQTT, base CoAP and HTTP/1.1.","A clear distinction between transport and network responsibilities."],"visual":{"title":"Only the middle of the map is in focus.","conversation":{"label":"Service interaction","value":"already mapped to an application protocol","tone":"learned"},"stacks":[{"label":"Do not fill these bindings yet","rows":[{"name":"Application protocol","value":"MQTT / CoAP / HTTP/1.1","tone":"learned"},{"name":"Transport","value":"TCP or UDP ?","tone":"current"},{"name":"Network","value":"IP / IPv6","tone":"current"},{"name":"Local connectivity","value":"later","tone":"future"}]}],"callout":"TCP/UDP and IP do different jobs. Your activity is to identify those jobs and the reference transport used in today’s examples."}},"stop":{"question":"Where do TCP, UDP and IP sit — and which reference bindings are we keeping today?","probeTitle":"Separate transport from network before memorising pairings.","probe":["Why is IP not an alternative to TCP or UDP?","What do we gain or give up when the application sits over TCP versus UDP?"],"complements":["TCP provides an ordered reliable byte stream; UDP provides datagrams with minimal transport semantics; IP handles network addressing/routing.","For today’s reference paths: MQTT → TCP, base CoAP → UDP, HTTP/1.1 → TCP; all rely on IP networking below transport."],"visual":{"title":"Middle rows filled — reference paths for this session","stacks":[{"label":"MQTT reference","rows":[{"name":"Application protocol","value":"MQTT","tone":"learned"},{"name":"Transport","value":"TCP","tone":"learned"},{"name":"Network","value":"IP","tone":"learned"},{"name":"Local connectivity","value":"not chosen here","tone":"future"}]},{"label":"CoAP reference","rows":[{"name":"Application protocol","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IP / IPv6","tone":"learned"},{"name":"Local connectivity","value":"not chosen here","tone":"future"}]}],"callout":"These are teaching reference bindings for this session, not a claim that every modern protocol variant has only one possible transport."}}},{"title":"Connect the stack to local connectivity","workTime":"7 min","stopTime":"4 min","work":{"question":"What changes when only the local connectivity changes?","support":"Compare two complete reference paths. Keep the Application, Transport and IPv6 rows fixed, then change how the device reaches the local network.","produce":["Which rows stay the same across the two reference stacks.","Which local connectivity part changes.","Why MQTT and Wi-Fi are not direct alternatives."],"visual":{"title":"Same upper communication path, different local connectivity","note":"Now the Session 1 access technologies reconnect to the stack.","stacks":[{"label":"Connected building","rows":[{"name":"Application protocol","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IPv6","tone":"learned"},{"name":"Local connectivity","value":"Wi-Fi","tone":"current"}]},{"label":"Constrained local network","rows":[{"name":"Application protocol","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IPv6","tone":"learned"},{"name":"Local connectivity","value":"Thread over IEEE 802.15.4","tone":"current"}]}],"callout":"Thread is introduced here as a low-power IPv6 local networking solution built on IEEE 802.15.4 radios."}},"stop":{"question":"Which mechanisms are alternatives, and which can be composed in the same path?","probeTitle":"Read vertically through the path, then compare horizontally within a job.","probe":["Why can CoAP and Wi-Fi appear together?","What stayed unchanged when Wi-Fi was replaced by a Thread/IEEE 802.15.4 local network?"],"complements":["Application-protocol choices and local-connectivity choices solve different problems and can therefore coexist in one path.","Real suites can span more than one textbook layer; our map is a design aid, so we label the bottom responsibility “local connectivity” rather than pretending every technology fits one strict OSI box."],"visual":{"title":"The stack is now complete","stacks":[{"label":"Example A","rows":[{"name":"Application protocol","value":"HTTP/1.1","tone":"learned"},{"name":"Transport","value":"TCP","tone":"learned"},{"name":"Network","value":"IP","tone":"learned"},{"name":"Local connectivity","value":"Wi-Fi","tone":"learned"}]},{"label":"Example B","rows":[{"name":"Application protocol","value":"CoAP","tone":"learned"},{"name":"Transport","value":"UDP","tone":"learned"},{"name":"Network","value":"IPv6","tone":"learned"},{"name":"Local connectivity","value":"Thread over IEEE 802.15.4","tone":"learned"}]}],"callout":"MQTT / CoAP / HTTP compare at Application protocol. TCP / UDP compare at Transport. Wi-Fi and constrained local-network solutions belong to the local-connectivity part of this design map."}}},{"title":"Add a data contract","workTime":"5 min","stopTime":"4 min","work":{"question":"The message arrived. Does the receiver know what {\"value\":812} means?","support":"The communication path delivers bytes. Add the minimum data contract another system needs to interpret the measurement without guessing.","produce":["The core semantic fields selected.","One distinction between network addressing, application naming and payload meaning."],"visual":{"title":"The stack delivers the payload; meaning travels with the application data.","stacks":[{"label":"Communication path","rows":[{"name":"Application protocol","value":"chosen application protocol","tone":"learned"},{"name":"Transport","value":"chosen transport","tone":"learned"},{"name":"Network","value":"IP / IPv6","tone":"learned"},{"name":"Local connectivity","value":"chosen access / local network","tone":"learned"}]}],"sidecar":{"label":"NOT ANOTHER STACK LAYER","title":"Data contract / semantics = ?","text":"The payload arrived as {\"value\":812}. What extra application data would let another system interpret it without guessing?"},"callout":"The reference fields stay hidden for now. First decide what information is missing from the payload."}},"stop":{"question":"What succeeded when the bytes arrived, and what information was still missing?","probeTitle":"Do not confuse delivery, naming and meaning.","probe":["What does an IP address tell you?","What does a URI/topic tell you? What does the data contract still add?"],"complements":["Network and application identifiers help deliver or name data; they do not tell another system that “812” means CO₂ concentration in ppm observed at a specific time/location.","The data contract belongs with the application payload; it is not a fifth communication layer below the local network."],"visual":{"title":"Communication path + interpretable payload","stacks":[{"label":"Communication stack","rows":[{"name":"Application protocol","value":"application exchange","tone":"learned"},{"name":"Transport","value":"process-to-process transfer","tone":"learned"},{"name":"Network","value":"addressing + routing","tone":"learned"},{"name":"Local connectivity","value":"reach the local/access network","tone":"learned"}]}],"sidecar":{"label":"APPLICATION DATA","title":"Data contract","text":"Meaning needed by the receiver.","items":["quantity","unit","time","source","schema"]},"callout":"Delivery is necessary; interpretable data is an additional application-level contract."}}},{"title":"Build one complete campus stack","workTime":"8 min","stopTime":"6 min","work":{"question":"Can you build one coherent exchange from the service interaction down to local connectivity?","support":"Choose one campus service. First identify its interaction; then fill the communication stack. Finally attach the data contract to the application payload.","produce":["Service interaction.","Application protocol.","Transport.","Network.","Local connectivity.","Data contract carried with the application payload."],"visual":{"title":"The model you should now be able to reconstruct","conversation":{"label":"Service interaction","value":"one-way · request/response · publish/subscribe · command/ack","tone":"learned"},"stacks":[{"label":"Communication stack","rows":[{"name":"Application protocol","value":"MQTT / CoAP / HTTP","tone":"learned"},{"name":"Transport","value":"TCP / UDP","tone":"learned"},{"name":"Network","value":"IP / IPv6","tone":"learned"},{"name":"Local connectivity","value":"Wi-Fi / Thread–802.15.4 / other access","tone":"learned"}]}],"sidecar":{"label":"WITH THE APPLICATION PAYLOAD","title":"Data contract","text":"Make the delivered value interpretable.","items":["quantity","unit","time","source"]},"callout":"Start from what the service needs. Protocol names come after the interaction and each name must have a visible job."}},"stop":{"question":"Can you tell the complete story without treating every protocol name as a competitor?","probeTitle":"Place every decision on the same map.","probe":["Which application protocol follows from the service interaction?","Which decision comes from deployment/local-connectivity constraints rather than the application interaction?"],"complements":["A clean design map makes category errors visible: MQTT and Wi-Fi can coexist because they solve different responsibilities.","The next systems question is placement: where should sensing, decisions, storage and processing actually run?"],"visual":{"title":"Session 2 mental model","conversation":{"label":"Service interaction","value":"what exchange does the service require?","tone":"learned"},"stacks":[{"label":"Communication stack","rows":[{"name":"Application protocol","value":"how applications exchange messages/resources","tone":"learned"},{"name":"Transport","value":"process-to-process transfer","tone":"learned"},{"name":"Network","value":"host/network addressing + routing","tone":"learned"},{"name":"Local connectivity","value":"reach the immediate access/local network","tone":"learned"}]}],"sidecar":{"label":"APPLICATION DATA","title":"Data contract","text":"what the payload fields mean","items":["quantity","unit","time","source","schema"]},"callout":"This is a design map for one message path — not a replacement for the full OSI model."}}}],"conclusion":{"title":"What we keep from Session 2","subtitle":"Start from the service interaction, then place every communication mechanism in the job it actually performs.","takeaways":["Service interaction sits above the stack: first decide who exchanges what and whether a reply or decoupling is needed.","Application protocol, transport, network and local connectivity are different responsibilities. Compare alternatives within a responsibility; compose mechanisms across responsibilities.","A data contract makes the application payload interpretable; it complements the communication stack rather than forming another lower layer."],"modelLabel":"THE DESIGN MAP WE KEEP","model":["Service interaction","Application protocol","Transport","Network","Local connectivity"],"nextLabel":"ALONGSIDE THE STACK","next":"Data contract / semantics travels with the application payload. Session 3 asks where sensing, decisions, storage and processing should run."}};</script><script src="../assets/projector.js"></script></body></html>
