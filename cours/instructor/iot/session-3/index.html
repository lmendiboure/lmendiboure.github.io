<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Session 3 Projector — IoT Systems Design</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">IoT Systems Design<small>Session 3 · Placement</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Fullscreen</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Back</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Next →</button></div><script>window.PROJECTOR_DATA={"session":3,"activities":[{"title":"Place functions, not whole applications","workTime":"7 min","stopTime":"5 min","work":{"question":"Which functions really need to live in the same place?","support":"Place sensing, filtering, decisions, recent state, long-term history and analytics independently across device, nearby and remote zones.","produce":["A zone for each of the six functions.","One function your group found easy to place.","One function whose placement depends on an assumption you still need to test."]},"stop":{"question":"You placed the same service function-by-function. What made some placements obvious and others conditional?","complements":["A single IoT service can span several deployment zones; splitting functions is normal, not an exception.","The useful question is not ‘edge or cloud?’ but ‘which function is constrained by which property?’"],"probeTitle":"What was really driving your placement?","probe":["Which function could move without changing the service behaviour?","Which placement was only defensible because of an assumption you have not tested yet?"]}},{"title":"Move data or transform it first?","workTime":"8 min","stopTime":"","work":{"question":"What should cross the network: every sample, a summary, or events?","support":"Compare three strategies for 200 sensors producing one record every 5 seconds. Use the record counts to make data movement visible.","produce":["One data-handling strategy.","The reason that drives it: fidelity, transfer reduction, or event responsiveness.","One consequence for where aggregation/event detection must execute."]}},{"title":"Place decisions against a response budget","workTime":"7 min","stopTime":"5 min","work":{"question":"How far away can each decision run and still meet the stated response budget?","support":"Use the campus planning envelope shown in the activity. Treat it as scenario evidence, not a universal latency claim.","produce":["A placement for each of the three response-budget cases.","One case where remote execution is still acceptable.","One case where proximity actually constrains the design."]},"stop":{"question":"You tested three response budgets. When did proximity actually become a requirement?","complements":["A nearby placement is only justified by the full budget when communication delay is material relative to the service deadline.","Latency is one criterion among several: a very fast zone may still be infeasible because of compute, memory, energy or data constraints."],"probeTitle":"Would you still choose nearby compute if the deadline became loose?","probe":["Which budget actually ruled out a zone?","Which case showed that remote execution can be completely reasonable?"]}},{"title":"Check feasibility before optimisation","workTime":"9 min","stopTime":"","work":{"question":"Can each workload actually run in the zone you prefer?","support":"Use the exercise resource envelopes to find the closest feasible zone for thresholding, aggregation, image inference and model training.","produce":["One feasible zone per workload.","One workload whose preferred zone is ruled out by resources.","The resource that caused the rejection: compute, memory, energy or storage."]}},{"title":"Minimise what crosses a boundary","workTime":"7 min","stopTime":"5 min","work":{"question":"Where should occupancy inference run if raw images may not leave the building?","support":"The camera cannot run the model, a building server is available, and the remote service needs occupancy information rather than raw imagery.","produce":["One processing pipeline.","The minimum useful payload that leaves the building.","The local resource your design now depends on."]},"stop":{"question":"You reduced what left the building. What did moving computation toward the data source buy you — and what did it cost locally?","complements":["Data minimisation is not only a security/privacy statement; it changes bandwidth, storage and interface design as well.","Derived data can still need provenance, time and confidence information to remain useful remotely."],"probeTitle":"What should cross the boundary — and why?","probe":["What information is actually required remotely?","What new dependency appears because inference now runs inside the building?"]}},{"title":"What changes when a gateway starts computing?","workTime":"7 min","stopTime":"","work":{"question":"What actually moved when the nearby node changed from forwarding traffic to executing application work?","support":"Compare the two deployments and identify the filtering, decision and cache functions that moved closer to the source.","produce":["The three functions that moved.","A plain-language explanation of the new nearby role.","One reason not to treat ‘edge’ as the name of a specific box or protocol."]}},{"title":"Build one split pipeline","workTime":"9 min","stopTime":"5 min","work":{"question":"Where should each CO₂ function run, and what should cross the nearby-to-remote boundary?","support":"Integrate the data, latency, feasibility and locality constraints into one split pipeline.","produce":["A zone for all six functions.","The representation crossing nearby → remote.","The constraint that justifies your most important placement boundary."]},"stop":{"question":"You built a split pipeline. Where is the most important cut, and what exactly crosses it?","complements":["A placement cut is also an interface: the data format, update rate and ownership of state must be explicit at that boundary.","Changing the cut can move both computation and state; those two do not always migrate together."],"probeTitle":"Is your ‘edge/cloud split’ precise enough to implement?","probe":["What crosses the boundary: raw samples, summaries, events, or something else?","Which state remains on each side of the cut?"]}},{"title":"Change one assumption","workTime":"7 min","stopTime":"5 min FINAL","work":{"question":"Which placement decision changes when one operating assumption changes?","support":"Choose scale, response budget or device-energy pressure, then make the minimum justified revision to your current pipeline.","produce":["One changed assumption.","One function whose placement must be revisited.","A new zone and the specific constraint that justifies the revision."]},"stop":{"question":"You revised one placement after changing one assumption. What survived — and what actually had to move?","complements":["A good placement argument records the assumption that made a cut defensible; this makes later revision local rather than a full redesign by default.","The next session will challenge not only placement assumptions but execution under failures, retries and unavailable dependencies."],"probeTitle":"Was your revision minimal and causal?","probe":["Which exact assumption invalidated the previous placement?","What part of the pipeline remained valid despite the change?"]}}],"conclusion":{"title":"What we keep from Session 3","subtitle":"Place functions from constraints, then make every boundary explicit.","takeaways":["Place sensing, transformation, decisions, state and analytics function-by-function; one service can span device, nearby and remote zones.","Data movement, response budget, compute/memory/energy feasibility, privacy and scale are placement constraints — not reasons to prefer one zone by default.","A split pipeline is only defensible when it states what crosses each boundary and which assumption makes that cut valid."],"modelLabel":"THE PLACEMENT ARGUMENT WE KEEP","model":["Function","Constraints","Feasible zones","Data boundary","Defended placement","Re-test"],"nextLabel":"NEXT","next":"The work is placed. What happens when messages, nodes or dependencies fail, retry or disappear?"}};</script><script src="../assets/projector.js"></script></body></html>
