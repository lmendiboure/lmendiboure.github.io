<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projection · Épisode 1 · Vallée des Aldudes</title>
<style>
:root{--bg:#f2f0e8;--paper:#fbfaf5;--ink:#13191f;--muted:#626b70;--border:#c8c6bd;--blue:#1555d9;--soft:#e5ebf9;--orange:#c76518;--green:#267259;--red:#b23b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;line-height:1.45}body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(19,25,31,.035) 1px,transparent 1px);background-size:100% 42px}.shell{width:min(1280px,calc(100% - 38px));margin:auto}.top{border-bottom:2px solid var(--ink);min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:900 .78rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em}.brand b{background:var(--blue);color:#fff;padding:7px 8px;margin-right:9px}.actions{display:flex;gap:6px}.btn{border:1px solid var(--ink);background:var(--paper);padding:8px 11px;font:800 .7rem ui-monospace,monospace;text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.scene{padding:28px 0 92px}.scene-head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:15px}.eyebrow{font:850 .68rem ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{font-size:clamp(2.8rem,5vw,5rem);line-height:.94;letter-spacing:-.055em;margin:6px 0 0}.mode{border:1px solid var(--blue);color:var(--blue);padding:6px 9px;font:900 .7rem ui-monospace,monospace}.stage{margin-top:22px;border:2px solid var(--ink);background:var(--paper);padding:28px;min-height:520px}.work{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.work h2,.rest h2{font-size:clamp(1.8rem,3vw,3rem);margin:0 0 12px;letter-spacing:-.035em}.work p{font-size:1.12rem;color:var(--muted);max-width:78ch}.deliverables{display:grid;gap:9px}.deliverable{border:1px solid var(--border);padding:14px}.deliverable b{display:block;color:var(--blue);font:850 .66rem ui-monospace,monospace;text-transform:uppercase;margin-bottom:4px}.intervention{margin:14px 0;border:1px solid var(--border);border-left:5px solid var(--blue);background:var(--paper)}.intervention-head{padding:9px 11px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;gap:8px}.intervention-head b{font:850 .67rem ui-monospace,monospace}.intervention-head span{font:800 .6rem ui-monospace,monospace;color:var(--blue);text-transform:uppercase}.intervention-row{display:grid;grid-template-columns:145px 1fr;gap:9px;padding:8px 11px;border-bottom:1px solid var(--border)}.intervention-row:last-child{border-bottom:0}.intervention-row b{font:850 .58rem ui-monospace,monospace;text-transform:uppercase;color:var(--muted)}.intervention-row.input b,.intervention-row.impact b{color:var(--blue)}.time{display:inline-block;margin-top:18px;background:var(--soft);color:var(--blue);padding:7px 9px;font:850 .68rem ui-monospace,monospace}.rest-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.discussion{display:grid;gap:10px}.question,.challenge{border:1px solid var(--border);padding:12px}.question b,.challenge b{display:block;font:850 .65rem ui-monospace,monospace;text-transform:uppercase;color:var(--blue);margin-bottom:4px}.challenge{border-left:5px solid var(--orange)}.board{border:1px solid var(--border);background:#fff}.board-head{display:flex;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid var(--border);background:var(--soft)}.board-head span{font:850 .65rem ui-monospace,monospace;text-transform:uppercase;color:var(--blue)}.board-body{padding:12px}.board-form{display:flex;gap:7px;margin-bottom:10px}.board-form input,.board-form select{flex:1;border:1px solid var(--border);padding:9px}.chips{display:flex;flex-wrap:wrap;gap:7px;min-height:90px;align-content:flex-start}.chip{border:1px solid var(--border);padding:8px 10px;background:var(--paper);font-weight:750}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.compare-item{border:1px solid var(--border);padding:10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.count{font-size:2rem;font-weight:900;color:var(--blue)}.count-actions button{border:1px solid var(--border);background:var(--paper);width:31px;height:31px;font-weight:900}.structure{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:110px}.node{border:2px solid var(--blue);padding:10px 12px;font-weight:850}.arrow{color:var(--blue);font-weight:900}.synthesis{margin-top:14px;border-top:2px solid var(--ink);padding-top:12px}.reveal-actions{display:flex;gap:7px}.reveal{border:1px solid var(--border);background:var(--paper);padding:8px 10px;font-weight:850}.reveal.active{background:var(--blue);color:#fff}.reveal-card{margin-top:10px;border-left:5px solid var(--green);padding:11px 13px;background:#f3f8f5}.reveal-card.reality{border-left-color:var(--blue);background:#f3f6fc}.reveal-card.reference{border-left-color:var(--orange);background:#fbf5ed}.controls{position:fixed;left:0;right:0;bottom:0;background:rgba(242,240,232,.97);border-top:2px solid var(--ink)}.controls-inner{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{display:flex;gap:4px}.dot{width:31px;height:31px;border:1px solid var(--border);background:var(--paper);font:850 .65rem ui-monospace,monospace}.dot.active{background:var(--blue);color:#fff;border-color:var(--blue)}.phase-count{font:800 .7rem ui-monospace,monospace;color:var(--muted)}@media(max-width:900px){.work,.rest-grid{grid-template-columns:1fr}.compare{grid-template-columns:1fr 1fr}.progress{display:none}}
</style></head>
<body><header class="shell top"><div class="brand"><b>EC</b> Mission Vallée des Aldudes · Épisode 1</div><div class="actions"><button class="btn" id="newClass">Nouvelle classe</button><button class="btn" id="fullscreen">Plein écran</button></div></header><main class="scene"><div id="scene"></div></main><footer class="controls"><div class="shell controls-inner"><button class="btn" id="back">← Retour</button><div id="progress" class="progress"></div><span id="phaseCount" class="phase-count"></span><button class="btn primary" id="next">Continuer →</button></div></footer>
<script>
const checkpoints=[
{title:'Que voudriez-vous savoir ?',work:{q:'Vallée des Aldudes : quelles informations seraient réellement utiles avant de parler technologie ?',copy:'Les groupes choisissent puis hiérarchisent leurs besoins sans parler de capteurs.',intervention:{who:'Maialen · coordination territoriale',kind:'Priorité de mission',context:'Aucune stratégie d’observation n’est encore définie.',input:'Je veux savoir ce que nous devons être capables de connaître — et pourquoi certaines informations comptent plus que d’autres.',impact:'Prioriser les informations utiles avant de discuter des moyens.'},time:'3 min',items:[['1 · Sélectionner','5–7 informations parmi le corpus'],['2 · Prioriser','Top 3 + enjeu associé'],['Défense','Pourquoi ces trois-là ?']]},rest:{board:{type:'capture',id:'a1',title:'Priorités de la classe',prompt:'Saisir 4–8 informations récurrentes.'},questions:['Quelles priorités reviennent ?','Même donnée, même décision ?'],challenge:'50 capteurs gratuits deviennent disponibles. La stratégie doit-elle changer ?',takeaway:'Décision → information nécessaire. Disponible ne signifie pas utile.',reference:'<b>Panorama :</b> eau/crue · routes/accès · ouvrages · forêt/versants · agriculture/pastoralisme · bâtiments/services · contexte. La liste est volontairement plus large que les 15 cartes : l’enjeu est de prioriser, pas d’épuiser le territoire.',reality:'Banca, Les Aldudes et Urepel composent réellement la vallée, à l’entrée du Kintoa. Le risque de crue sur la Nive des Aldudes est documenté ; la mission, elle, est scénarisée.'}},
{title:'Partir de la décision',work:{q:'Pour quatre décisions plausibles dans la vallée, quel minimum d’information faut-il posséder avant d’agir ?',copy:'Les groupes choisissent 1–2 cartes par décision et doivent écarter les informations seulement intéressantes ou hors sujet.',intervention:{who:'Peio · exploitation terrain',kind:'Contrainte d’usage',context:'Les groupes ont fixé trois priorités ; ils doivent maintenant montrer à quelles décisions concrètes elles servent.',input:'Une information qui ne change aucune action finit par être ignorée.',impact:'Garder, pour chaque décision, les informations qui peuvent réellement faire changer l’action et rendre les hypothèses visibles.'},time:'4 min',items:[['1 · Filtrer','4 décisions × 1–2 informations'],['2 · Défendre','Ce qui manquerait pour agir'],['Mode Défi','Retirer une information et expliciter l’hypothèse']] }},
{title:'Ce que l’on peut réellement observer',work:{q:'Construire la chaîne entre décision et mesure.',copy:'Ordonner les cinq niveaux puis appliquer la chaîne au risque de crue.',time:'4 min',items:[['1 · Ordonner','Chaîne générale · 5 étapes'],['2 · Transférer','Chaîne crue · 5 cartes parmi 8'],['Défense','Justifier chaque transition']]},rest:{board:{type:'structure',id:'a3',title:'Chaîne collective',prompt:'Construire la chaîne à partir des propositions.'},questions:['Où les chaînes divergent-elles ?','Quand le besoin devient-il mesurable ?'],challenge:'Le niveau est mesuré au millimètre mais un affluent critique n’est pas observé.',takeaway:'Décision → information → phénomène → observable → mesure.',reference:'<b>Chaîne :</b> décision → information → phénomène → observable → mesure. Transferts : pont (accélération/vibration), pâture (état hydrique/végétation), feu (fumée/thermique). Une mesure très précise peut rester pauvre si l’observable est mal choisi.',reality:'La Nive des Aldudes est réellement suivie à Saint-Étienne-de-Baïgorry par une station hydrométrique mise en service en 1960, utilisée notamment pour le suivi d’étiage et la prévision des crues.'}},
{title:'D’où viennent les données ?',work:{q:'Quelles familles de sources observeraient utilement la vallée ?',copy:'Sélectionner les familles utiles sans disposer déjà de leur profil espace/temps. Les groupes explorent huit familles, verrouillent ensuite les profils espace/temps de quatre sources, puis construisent une paire complémentaire pour la forêt.',intervention:{who:'Inès · ingénierie systèmes',kind:'Revue des sources',context:'Les groupes savent ce qu’ils cherchent à observer ; plusieurs familles de sources peuvent contribuer, avec des couvertures et des rythmes différents.',input:'Une source très fréquente ne voit peut-être qu’un point ; une source très large ne revient pas forcément souvent.',impact:'Comparer ce que chaque source permet de voir — et ce qu’elle laisse dans l’ombre — avant de construire une combinaison.'},time:'5 min',items:[['1 · Repérer','3–5 familles plausibles'],['2 · Profiler','4 sources · espace + temps'],['3 · Combiner','2 sources forêt + compensation']] }},
{title:'Observer directement ou par proxy ?',work:{q:'Classer six exemples : direct, proxy/indicateur, inférence ou donnée externe.',copy:'Les groupes verrouillent avant le retour.',time:'4 min',items:[['1 · Classer','6 cas : direct / proxy / inférence / externe'],['2 · Relier','Signal → indicateur → état → décision'],['Transfert','Ouvrage d’art']]},rest:{board:{type:'compare',id:'a5',title:'Où était le désaccord ?',prompt:'Compter les groupes pour l’exemple jugé le plus ambigu.',categories:['Capteur niveau','Indice végétation','Caméra + algorithme','Prévision météo']},questions:['Quel exemple divise le plus ?','Qu’est-ce qui est réellement mesuré ?'],challenge:'La relation entre un proxy et l’état recherché change après une modification du terrain.',takeaway:'Observation directe ≠ proxy ≠ donnée externe. Toujours rendre l’inférence visible.',reference:'<b>Référence :</b> hauteur locale = observation directe de la grandeur ; humidité sol = proxy possible du besoin hydrique ; probabilité de feu = inférence ; prévision météo = donnée externe. Sur un pont : signal → indicateur → état suspecté → décision.',reality:'Transfert pont : un accéléromètre mesure une accélération ; un état de santé structurelle est ensuite inféré à partir d’indicateurs, de modèles et du contexte.'}},
{title:'Une valeur ne suffit pas',work:{q:'Transformer « 32 » en observation exploitable.',copy:'Ajouter le contexte, distinguer temps du phénomène / production / réception et comparer deux valeurs identiques mais non équivalentes. Le Mode Défi sépare ordre de réception et fraîcheur physique.',intervention:{who:'Samir · données & sécurité',kind:'Audit de donnée',context:'Des valeurs sont disponibles, mais elles ne peuvent pas encore être comparées proprement sans préciser où, quand et comment elles ont été produites.',input:'32 °C : où, quand, sur quoi, produit comment ?',impact:'Passer d’une valeur isolée à une observation contextualisée que l’on peut réellement interpréter et comparer.'},time:'5 min',items:[['1 · Contextualiser','5 éléments essentiels'],['2 · Horodater','Phénomène · résultat · arrivée'],['3 · Comparer','≥3 différences entre deux « 32 °C »']] }},
{title:'Où et quand observer ?',work:{q:'Choisir couverture spatiale et temporalité pour cinq phénomènes.',copy:'Crue, pâtures, pont, feu et bâtiment imposent des compromis différents. Ajouter le mini-calcul de fraîcheur puis le test précision ≠ représentativité.',time:'5 min',items:[['1 · Profiler','5 phénomènes · espace × temps'],['2 · Calculer','Fraîcheur maximale'],['3 · Tester','Précision ≠ représentativité']]},rest:{board:{type:'compare',id:'a7',title:'Qu’est-ce qui domine ?',prompt:'Tally du critère jugé dominant par les groupes.',categories:['Fréquence','Couverture','Précision','Représentativité']},questions:['Quels phénomènes exigent surtout de la fréquence ?','Précision et représentativité sont-elles interchangeables ?'],challenge:'Deux capteurs éloignés donnent la même valeur. Peut-on généraliser à toute la vallée ?',takeaway:'Une observation a une géométrie et un temps : espace, fréquence, fraîcheur, représentativité.',reference:'<b>Repères :</b> précision ≠ représentativité ; fréquence ≠ fraîcheur ; résolution ≠ couverture. Sentinel‑2 : 10/20/60 m et revisite nominale 5 jours (2 satellites). LiDAR HD IGN : acquisition spatiale dense, pas un flux temps réel.',reality:'Sentinel-2 illustre le compromis : 10/20/60 m selon les bandes et 5 jours de revisite nominale pour la constellation à deux satellites.'}},
{title:'Une donnée est-elle « bonne » ?',work:{q:'Qu’est-ce qui rend une observation insuffisante pour une décision ?',copy:'Les groupes diagnostiquent d’abord six faiblesses, verrouillent, puis évaluent la même donnée pour plusieurs usages. Ils terminent par un transfert pont ; un contre-exemple construit reste disponible en Mode Défi.',time:'6 min',items:[['1 · Diagnostiquer','6 faiblesses'],['2 · Changer l’usage','4 jugements acceptable / fragile'],['3 · Prioriser','2 dimensions après choc'],['Mode Défi · Contre-exemple','Donnée correcte × usage incompatible · optionnel']] }},
{title:'Construire une stratégie d’observation',work:{q:'Surveiller le risque de crue dans la vallée des Aldudes avec trois sources maximum.',copy:'Chaque source doit maintenant avoir un rôle informationnel explicite et une limite assumée. La combinaison reçoit ensuite un angle mort global avant gel de la v1.',intervention:{who:'Maialen · coordination territoriale',kind:'Arbitrage',context:'Les groupes connaissent maintenant les forces et limites des principales observations ; ils doivent composer sans chercher à tout couvrir.',input:'Trois sources maximum. Pour chacune : quelle information protège-t-elle et quelle limite acceptez-vous ?',impact:'Assembler quelques sources complémentaires, donner à chacune un rôle clair et reconnaître l’angle mort qui subsiste.'},time:'7 min',items:[['1 · Composer','2–3 sources maximum'],['2 · Qualifier','Rôle + limite par source'],['3 · Assumer','1 angle mort avant de figer v1']]},rest:{board:{type:'capture',id:'a9',title:'Stratégies de la classe',prompt:'Saisir les combinaisons ou principes distinctifs, pas toutes les phrases.'},questions:['Quelles limites sont réellement complémentaires ?','Où existe-t-il une fausse redondance ?'],challenge:'Trois sources utilisent la même donnée météo en amont. Sont-elles indépendantes ?',takeaway:'Une stratégie combine des limites différentes et explicite ses dépendances.',reference:'<b>Lecture de stratégie :</b> rôle informationnel de chaque source + limite assumée + dépendances communes + angle mort. Trois sources utilisant le même réseau ou la même donnée amont ne constituent pas trois voies indépendantes.',reality:'À Banca, le projet Olha a réellement été adapté avec un nouveau bâtiment hors zone à risque de crue ; la collectivité mentionne aussi travaux de berges et reconstruction de la station d’épuration.'}},
{title:'Incident : votre vision du réel est fausse',work:{q:'Incident scénarisé : changer une hypothèse et produire une vraie v2.',copy:'Sélectionner un incident puis suivre toute la causalité : hypothèse cassée → information menacée → modification de sources/règle → faiblesse restante. La récupération vient ensuite sans relire le Guide.',intervention:{who:'Message exploitation',kind:'Incident',context:'Une première stratégie est arrêtée et ses limites sont visibles ; elle va maintenant être confrontée à une hypothèse qui ne tient plus.',input:'Une hypothèse de votre v1 vient de tomber.',impact:'Réviser uniquement ce que l’incident remet en cause et garder la trace du raisonnement qui justifie le passage de v1 à v2.'},time:'9 min',items:[['1 · Choisir','1 incident'],['2 · Réviser','v1 → v2'],['3 · Expliquer','4 maillons causaux'],['4 · Récupérer','4 questions sans le Guide']]},rest:{board:{type:'compare',id:'a10',title:'Quel incident a le plus forcé la révision ?',prompt:'Comptage après engagement des groupes.',categories:['Source indisponible','Dérive capteur','Retard','Contradiction']},questions:['Quel changement a été structurel ?','Quelle hypothèse faisait le plus de travail ?'],challenge:'La v2 traite l’incident, mais quelle nouvelle dépendance crée-t-elle ?',takeaway:'Hypothèse changée → information menacée → modification → vulnérabilité restante.',reference:'<b>Révision :</b> hypothèse changée → information menacée → règle/responsabilité affectée → delta v2 → faiblesse restante. Une mitigation n’annule pas le risque ; elle déplace souvent coût, dépendance ou délai.',reality:'La robustesse n’est pas une propriété absolue : elle est relative aux incidents considérés et au comportement dégradé acceptable.'}}
];
let i=0,mode='work',boards={},reveals={};try{boards=JSON.parse(sessionStorage.getItem('ec-s1-projection')||'{}')}catch(_){boards={}}const scene=document.getElementById('scene');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function boardData(b){if(!boards[b.id])boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]};return boards[b.id]}
function save(){try{sessionStorage.setItem('ec-s1-projection',JSON.stringify(boards))}catch(_){}}
function boardHtml(b){const d=boardData(b);if(b.type==='capture')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Capture</span></div><div class="board-body"><form class="board-form" data-capture><input name="idea" maxlength="70" placeholder="Entrée courte"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="chips">${d.items.map((x,k)=>`<button class="chip" type="button" data-remove="${k}">${esc(x)} ×</button>`).join('')||'<span style="color:var(--muted)">Les contributions apparaissent ici.</span>'}</div></div></div>`;if(b.type==='compare')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Compare</span></div><div class="board-body"><div class="compare">${b.categories.map(c=>`<div class="compare-item"><strong>${c}</strong><div><div class="count">${d.counts[c]||0}</div><div class="count-actions"><button data-count="${esc(c)}" data-delta="-1">−</button><button data-count="${esc(c)}" data-delta="1">+</button></div></div></div>`).join('')}</div><button class="btn" type="button" data-clear style="margin-top:10px">Effacer</button></div></div>`;return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Structure</span></div><div class="board-body"><form class="board-form" data-node><input name="node" maxlength="35" placeholder="Élément de la chaîne"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="structure">${d.nodes.map((x,k)=>`${k?'<span class="arrow">→</span>':''}<button type="button" class="node" data-node-remove="${k}">${esc(x)}</button>`).join('')||'<span style="color:var(--muted)">Construisez la chaîne collectivement.</span>'}</div></div></div>`}
function work(c){return `<div class="work"><div><div class="eyebrow">TRAVAIL</div><h2>${c.work.q}</h2><p>${c.work.copy}</p>${c.work.intervention?`<div class="intervention"><div class="intervention-head"><b>${c.work.intervention.who}</b><span>${c.work.intervention.kind}</span></div><div class="intervention-row"><b>Point de départ</b><span>${c.work.intervention.context}</span></div><div class="intervention-row input"><b>Nouvelle information</b><span>${c.work.intervention.input}</span></div><div class="intervention-row impact"><b>Impact mission</b><span>${c.work.intervention.impact}</span></div></div>`:''}<span class="time">Travail · ${c.work.time}</span></div><div class="deliverables">${c.work.items.map(x=>`<div class="deliverable"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`}
function rest(c){const r=c.rest,p=reveals[i];return `<div class="rest"><div class="eyebrow">RESTITUTION</div><div class="rest-grid"><div>${boardHtml(r.board)}</div><aside class="discussion">${r.questions.map((q,k)=>`<div class="question"><b>Question ${k+1}</b><span>${q}</span></div>`).join('')}<div class="challenge"><b>Éprouver</b><span>${r.challenge}</span></div></aside></div><div class="synthesis"><div class="reveal-actions"><button class="reveal ${p==='takeaway'?'active':''}" data-reveal="takeaway">Formaliser</button>${r.reference?`<button class="reveal ${p==='reference'?'active':''}" data-reveal="reference">Référence</button>`:''}<button class="reveal ${p==='reality'?'active':''}" data-reveal="reality">Retour au réel</button></div>${p?`<div class="reveal-card ${p==='reality'?'reality':p==='reference'?'reference':''}">${p==='takeaway'?r.takeaway:p==='reference'?r.reference:r.reality}</div>`:''}</div></div>`}
function render(){const c=checkpoints[i];if(mode==='rest'&&!c.rest)mode='work';scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">Activité ${i+1} / 10 · ${mode==='work'?'travail':'restitution'}</div><h1>${c.title}</h1></div><span class="mode">${mode==='work'?'TRAVAIL':'RESTITUTION'}</span></div><div class="shell stage">${mode==='work'?work(c):rest(c)}</div>`;document.getElementById('phaseCount').textContent=`${i+1}/10 · ${mode==='work'?'TRAVAIL':'RESTITUTION'}`;document.getElementById('progress').innerHTML=checkpoints.map((_,k)=>`<button class="dot ${k===i?'active':''}" data-jump="${k}">${k+1}</button>`).join('');document.getElementById('back').disabled=i===0&&mode==='work';document.getElementById('next').textContent=mode==='work'&&c.rest?'Lancer restitution →':i===9?'Fin de séance':'Activité suivante →'}
function next(){const c=checkpoints[i];if(mode==='work'&&c.rest){mode='rest'}else if(i<9){i++;mode='work'}render()}
function back(){if(mode==='rest')mode='work';else if(i>0){i--;mode=checkpoints[i].rest?'rest':'work'}render()}
scene.addEventListener('submit',e=>{e.preventDefault();const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b),fd=new FormData(e.target);if(e.target.matches('[data-capture]')){const v=(fd.get('idea')||'').trim();if(v&&!d.items.includes(v))d.items.push(v)}if(e.target.matches('[data-node]')){const v=(fd.get('node')||'').trim();if(v)d.nodes.push(v)}save();render()});
scene.addEventListener('click',e=>{if(e.target.dataset.reveal){reveals[i]=reveals[i]===e.target.dataset.reveal?null:e.target.dataset.reveal;render();return}const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b);if(e.target.dataset.remove!==undefined)d.items.splice(+e.target.dataset.remove,1);if(e.target.dataset.nodeRemove!==undefined)d.nodes.splice(+e.target.dataset.nodeRemove,1);if(e.target.dataset.count){d.counts[e.target.dataset.count]=Math.max(0,(d.counts[e.target.dataset.count]||0)+(+e.target.dataset.delta))}if(e.target.matches('[data-clear]')){if(confirm('Effacer ce tableau ?'))boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]}}save();render()});
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('newClass').onclick=()=>{if(confirm('Réinitialiser tous les tableaux de classe ?')){boards={};reveals={};try{sessionStorage.removeItem('ec-s1-projection')}catch(_){}i=0;mode='work';render()}};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('progress').onclick=e=>{if(e.target.dataset.jump!==undefined){i=+e.target.dataset.jump;mode='work';render()}};document.addEventListener('keydown',e=>{if(e.target.matches('input,button,select'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')back();if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});render();
</script></body></html>
