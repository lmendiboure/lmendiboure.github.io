<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projection · Épisode 1 · Vallée des Aldudes</title>
<style>
:root{--bg:#f2f0e8;--paper:#fbfaf5;--ink:#13191f;--muted:#626b70;--border:#c8c6bd;--blue:#1555d9;--soft:#e5ebf9;--orange:#c76518;--green:#267259;--red:#b23b3b}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:Arial,"Helvetica Neue",sans-serif;line-height:1.45}body::before{content:"";position:fixed;inset:0;z-index:-1;background-image:linear-gradient(rgba(19,25,31,.035) 1px,transparent 1px);background-size:100% 42px}.shell{width:min(1280px,calc(100% - 38px));margin:auto}.top{border-bottom:2px solid var(--ink);min-height:58px;display:flex;align-items:center;justify-content:space-between;gap:12px}.brand{font:900 .78rem ui-monospace,monospace;text-transform:uppercase;letter-spacing:.06em}.brand b{background:var(--blue);color:#fff;padding:7px 8px;margin-right:9px}.actions{display:flex;gap:6px}.btn{border:1px solid var(--ink);background:var(--paper);padding:8px 11px;font:800 .7rem ui-monospace,monospace;text-transform:uppercase;cursor:pointer}.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}.scene{padding:28px 0 92px}.scene-head{display:flex;justify-content:space-between;align-items:end;border-bottom:2px solid var(--ink);padding-bottom:15px}.eyebrow{font:850 .68rem ui-monospace,monospace;letter-spacing:.1em;text-transform:uppercase;color:var(--blue)}h1{font-size:clamp(2.8rem,5vw,5rem);line-height:.94;letter-spacing:-.055em;margin:6px 0 0}.mode{border:1px solid var(--blue);color:var(--blue);padding:6px 9px;font:900 .7rem ui-monospace,monospace}.stage{margin-top:22px;border:2px solid var(--ink);background:var(--paper);padding:28px;min-height:520px}.work{display:grid;grid-template-columns:1.2fr .8fr;gap:22px}.work h2,.rest h2{font-size:clamp(1.8rem,3vw,3rem);margin:0 0 12px;letter-spacing:-.035em}.work p{font-size:1.12rem;color:var(--muted);max-width:78ch}.deliverables{display:grid;gap:9px}.deliverable{border:1px solid var(--border);padding:14px}.deliverable b{display:block;color:var(--blue);font:850 .66rem ui-monospace,monospace;text-transform:uppercase;margin-bottom:4px}.storyline{margin:14px 0 0;border-left:5px solid var(--orange);background:#f7eee5;padding:10px 12px}.storyline b{display:block;font:850 .63rem ui-monospace,monospace;color:var(--orange);text-transform:uppercase;letter-spacing:.05em}.storyline span{display:block;margin-top:4px;font-size:.9rem;color:#4a4038}.time{display:inline-block;margin-top:18px;background:var(--soft);color:var(--blue);padding:7px 9px;font:850 .68rem ui-monospace,monospace}.rest-grid{display:grid;grid-template-columns:1.35fr .65fr;gap:18px}.discussion{display:grid;gap:10px}.question,.challenge{border:1px solid var(--border);padding:12px}.question b,.challenge b{display:block;font:850 .65rem ui-monospace,monospace;text-transform:uppercase;color:var(--blue);margin-bottom:4px}.challenge{border-left:5px solid var(--orange)}.board{border:1px solid var(--border);background:#fff}.board-head{display:flex;justify-content:space-between;gap:10px;padding:11px;border-bottom:1px solid var(--border);background:var(--soft)}.board-head span{font:850 .65rem ui-monospace,monospace;text-transform:uppercase;color:var(--blue)}.board-body{padding:12px}.board-form{display:flex;gap:7px;margin-bottom:10px}.board-form input,.board-form select{flex:1;border:1px solid var(--border);padding:9px}.chips{display:flex;flex-wrap:wrap;gap:7px;min-height:90px;align-content:flex-start}.chip{border:1px solid var(--border);padding:8px 10px;background:var(--paper);font-weight:750}.compare{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.compare-item{border:1px solid var(--border);padding:10px;display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px}.count{font-size:2rem;font-weight:900;color:var(--blue)}.count-actions button{border:1px solid var(--border);background:var(--paper);width:31px;height:31px;font-weight:900}.structure{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-height:110px}.node{border:2px solid var(--blue);padding:10px 12px;font-weight:850}.arrow{color:var(--blue);font-weight:900}.synthesis{margin-top:14px;border-top:2px solid var(--ink);padding-top:12px}.reveal-actions{display:flex;gap:7px}.reveal{border:1px solid var(--border);background:var(--paper);padding:8px 10px;font-weight:850}.reveal.active{background:var(--blue);color:#fff}.reveal-card{margin-top:10px;border-left:5px solid var(--green);padding:11px 13px;background:#f3f8f5}.reveal-card.reality{border-left-color:var(--blue);background:#f3f6fc}.controls{position:fixed;left:0;right:0;bottom:0;background:rgba(242,240,232,.97);border-top:2px solid var(--ink)}.controls-inner{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:12px}.progress{display:flex;gap:4px}.dot{width:31px;height:31px;border:1px solid var(--border);background:var(--paper);font:850 .65rem ui-monospace,monospace}.dot.active{background:var(--blue);color:#fff;border-color:var(--blue)}.phase-count{font:800 .7rem ui-monospace,monospace;color:var(--muted)}@media(max-width:900px){.work,.rest-grid{grid-template-columns:1fr}.compare{grid-template-columns:1fr 1fr}.progress{display:none}}
</style></head>
<body><header class="shell top"><div class="brand"><b>EC</b> Mission Vallée des Aldudes · Épisode 1</div><div class="actions"><button class="btn" id="newClass">Nouvelle classe</button><button class="btn" id="fullscreen">Plein écran</button></div></header><main class="scene"><div id="scene"></div></main><footer class="controls"><div class="shell controls-inner"><button class="btn" id="back">← Retour</button><div id="progress" class="progress"></div><span id="phaseCount" class="phase-count"></span><button class="btn primary" id="next">Continuer →</button></div></footer>
<script>
const checkpoints=[
{title:'Que voudriez-vous savoir ?',work:{q:'Vallée des Aldudes : quelles informations seraient réellement utiles avant de parler technologie ?',copy:'Les groupes choisissent puis hiérarchisent leurs besoins sans parler de capteurs.',story:['08:42 · Maialen · coordination territoriale','Le dossier arrive sans liste de capteurs. La première demande porte sur les décisions qui justifient une information.'],time:'3 min',items:[['Artefact','Top 3 des informations'],['Défense','La décision ou le risque derrière ce Top 3'],['Garde-fou','Ne pas proposer de technologie']]},rest:{board:{type:'capture',id:'a1',title:'Priorités de la classe',prompt:'Saisir 4–8 informations récurrentes.'},questions:['Quelles priorités reviennent ?','Même donnée, même décision ?'],challenge:'50 capteurs gratuits deviennent disponibles. La stratégie doit-elle changer ?',takeaway:'Décision → information nécessaire. Disponible ne signifie pas utile.',reality:'Banca, Les Aldudes et Urepel composent réellement la vallée, à l’entrée du Kintoa. Le risque de crue sur la Nive des Aldudes est documenté ; la mission, elle, est scénarisée.'}},
{title:'Partir de la décision',work:{q:'Pour trois décisions plausibles dans la vallée, quelle information faudrait-il posséder avant d’agir ?',copy:'Faire formuler le besoin d’information, pas la solution technique.',story:['09:03 · Peio · exploitation terrain','Une information qui ne change aucune action finit par être ignorée. Faire défendre un minimum utile.'],time:'4 min',items:[['Artefact','3 couples décision → information'],['Défense','Ce qui manquerait pour agir'],['Mode Défi','Retirer une information et défendre le minimum suffisant']] }},
{title:'Ce que l’on peut réellement observer',work:{q:'Construire la chaîne entre décision et mesure.',copy:'Ordonner les cinq niveaux puis appliquer la chaîne au risque de crue.',time:'4 min',items:[['Artefact','Chaîne ordonnée'],['Application','Un exemple sur la crue'],['Défense','Justifier chaque transition sans attendre un verdict automatique']]},rest:{board:{type:'structure',id:'a3',title:'Chaîne collective',prompt:'Construire la chaîne à partir des propositions.'},questions:['Où les chaînes divergent-elles ?','Quand le besoin devient-il mesurable ?'],challenge:'Le niveau est mesuré au millimètre mais un affluent critique n’est pas observé.',takeaway:'Décision → information → phénomène → observable → mesure.',reality:'La Nive des Aldudes est réellement suivie à Saint-Étienne-de-Baïgorry par une station hydrométrique mise en service en 1960, utilisée notamment pour le suivi d’étiage et la prévision des crues.'}},
{title:'D’où viennent les données ?',work:{q:'Quelles familles de sources observeraient utilement la vallée ?',copy:'Sélectionner les familles utiles sans disposer déjà de leur profil espace/temps. Les groupes verrouillent ensuite les profils de trois familles avant le retour et produisent un transfert écrit vers la forêt.',story:['10:06 · Inès · ingénierie systèmes','Une source très fréquente ne voit peut-être qu’un point ; une source très large ne revient pas forcément souvent.'],time:'5 min',items:[['Artefact','Carte + profils verrouillés'],['Défense','Ce qu’une combinaison compense'],['Transfert écrit','Deux sources forêt : apport + limite']] }},
{title:'Observer directement ou par proxy ?',work:{q:'Classer quatre exemples : direct, proxy/inférence ou donnée externe.',copy:'Les groupes verrouillent avant le retour.',time:'4 min',items:[['Artefact','4 classifications'],['Défense','Ce qui est réellement observé'],['Transfert','Accéléromètre sur pont : observation directe + état recherché']]},rest:{board:{type:'compare',id:'a5',title:'Où était le désaccord ?',prompt:'Compter les groupes pour l’exemple jugé le plus ambigu.',categories:['Capteur niveau','Indice végétation','Caméra + algorithme','Prévision météo']},questions:['Quel exemple divise le plus ?','Qu’est-ce qui est réellement mesuré ?'],challenge:'La relation entre un proxy et l’état recherché change après une modification du terrain.',takeaway:'Observation directe ≠ proxy ≠ donnée externe. Toujours rendre l’inférence visible.',reality:'Transfert pont : un accéléromètre mesure une accélération ; un état de santé structurelle est ensuite inféré à partir d’indicateurs, de modèles et du contexte.'}},
{title:'Une valeur ne suffit pas',work:{q:'Transformer « 32 » en observation exploitable.',copy:'Ajouter le contexte, distinguer temps du phénomène / production / réception et comparer deux valeurs identiques mais non équivalentes. Le Mode Défi sépare ordre de réception et fraîcheur physique.',story:['10:32 · Samir · données & sécurité','32 °C : où, quand, mesuré par quoi, sur quel objet ? Un nombre sans contexte n’est pas encore une observation exploitable.'],time:'5 min',items:[['Artefact','Observation contextualisée'],['Mini-lab','14:02 phénomène · 14:08 résultat · 14:30 arrivée'],['Mode Défi','Donnée reçue en dernier ≠ phénomène le plus récent']] }},
{title:'Où et quand observer ?',work:{q:'Choisir couverture spatiale et temporalité pour trois phénomènes.',copy:'Crue, cultures et pont imposent des compromis différents. Ajouter le mini-calcul : acquisition toutes les 60 min vs phénomène qui peut évoluer en 10 min.',time:'5 min',items:[['Artefact','3 couples espace × temps'],['Mini-calcul','Âge maximal de la dernière mesure ≈ une période'],['Mode Défi','Précision locale vs représentativité']]},rest:{board:{type:'compare',id:'a7',title:'Qu’est-ce qui domine ?',prompt:'Tally du critère jugé dominant par les groupes.',categories:['Fréquence','Couverture','Précision','Représentativité']},questions:['Quels phénomènes exigent surtout de la fréquence ?','Précision et représentativité sont-elles interchangeables ?'],challenge:'Deux capteurs éloignés donnent la même valeur. Peut-on généraliser à toute la vallée ?',takeaway:'Une observation a une géométrie et un temps : espace, fréquence, fraîcheur, représentativité.',reality:'Sentinel-2 illustre le compromis : 10/20/60 m selon les bandes et 5 jours de revisite nominale pour la constellation à deux satellites.'}},
{title:'Une donnée est-elle « bonne » ?',work:{q:'Qu’est-ce qui rend une observation insuffisante pour une décision ?',copy:'Les groupes diagnostiquent d’abord quatre faiblesses sans retour immédiat, verrouillent, puis recommencent sur la même donnée avec des usages différents. Le transfert pont reste une réponse à produire.',time:'6 min',items:[['Artefact','4 diagnostics verrouillés'],['Deuxième niveau','4 décisions d’usage verrouillées'],['Transfert','Dimension prioritaire après choc sur un pont']] }},
{title:'Construire une stratégie d’observation',work:{q:'Surveiller le risque de crue dans la vallée des Aldudes avec trois sources maximum.',copy:'Chaque source doit maintenant avoir un rôle informationnel explicite et une limite assumée. La combinaison reçoit ensuite un angle mort global avant gel de la v1.',story:['11:27 · Maialen · arbitrage','Trois sources maximum. Pour chacune : quelle information protège-t-elle et quelle limite acceptez-vous ?'],time:'7 min',items:[['Artefact','Stratégie v1 enrichie'],['Défense','Pour chaque source : information sécurisée + limite'],['Angle mort','Ce que les trois sources ne résolvent toujours pas']]},rest:{board:{type:'capture',id:'a9',title:'Stratégies de la classe',prompt:'Saisir les combinaisons ou principes distinctifs, pas toutes les phrases.'},questions:['Quelles limites sont réellement complémentaires ?','Où existe-t-il une fausse redondance ?'],challenge:'Trois sources utilisent la même donnée météo en amont. Sont-elles indépendantes ?',takeaway:'Une stratégie combine des limites différentes et explicite ses dépendances.',reality:'À Banca, le projet Olha a réellement été adapté avec un nouveau bâtiment hors zone à risque de crue ; la collectivité mentionne aussi travaux de berges et reconstruction de la station d’épuration.'}},
{title:'Incident : votre vision du réel est fausse',work:{q:'Incident scénarisé : changer une hypothèse et produire une vraie v2.',copy:'Sélectionner un incident puis suivre toute la causalité : hypothèse cassée → information menacée → modification de sources/règle → faiblesse restante. La récupération vient ensuite sans relire le Guide.',story:['14:17 · message exploitation','Une hypothèse de votre v1 vient de tomber. Conservez la v1 et montrez exactement pourquoi la v2 change.'],time:'9 min',items:[['Artefact','v1 → v2 + règle d’exploitation'],['Défense','Hypothèse → information → réponse → faiblesse'],['Récupération','4 questions sans relire le Guide']]},rest:{board:{type:'compare',id:'a10',title:'Quel incident a le plus forcé la révision ?',prompt:'Comptage après engagement des groupes.',categories:['Source indisponible','Dérive capteur','Retard','Contradiction']},questions:['Quel changement a été structurel ?','Quelle hypothèse faisait le plus de travail ?'],challenge:'La v2 traite l’incident, mais quelle nouvelle dépendance crée-t-elle ?',takeaway:'Hypothèse changée → information menacée → modification → vulnérabilité restante.',reality:'La robustesse n’est pas une propriété absolue : elle est relative aux incidents considérés et au comportement dégradé acceptable.'}}
];
let i=0,mode='work',boards={},reveals={};try{boards=JSON.parse(sessionStorage.getItem('ec-s1-projection')||'{}')}catch(_){boards={}}const scene=document.getElementById('scene');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function boardData(b){if(!boards[b.id])boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]};return boards[b.id]}
function save(){try{sessionStorage.setItem('ec-s1-projection',JSON.stringify(boards))}catch(_){}}
function boardHtml(b){const d=boardData(b);if(b.type==='capture')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Capture</span></div><div class="board-body"><form class="board-form" data-capture><input name="idea" maxlength="70" placeholder="Entrée courte"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="chips">${d.items.map((x,k)=>`<button class="chip" type="button" data-remove="${k}">${esc(x)} ×</button>`).join('')||'<span style="color:var(--muted)">Les contributions apparaissent ici.</span>'}</div></div></div>`;if(b.type==='compare')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Compare</span></div><div class="board-body"><div class="compare">${b.categories.map(c=>`<div class="compare-item"><strong>${c}</strong><div><div class="count">${d.counts[c]||0}</div><div class="count-actions"><button data-count="${esc(c)}" data-delta="-1">−</button><button data-count="${esc(c)}" data-delta="1">+</button></div></div></div>`).join('')}</div><button class="btn" type="button" data-clear style="margin-top:10px">Effacer</button></div></div>`;return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Structure</span></div><div class="board-body"><form class="board-form" data-node><input name="node" maxlength="35" placeholder="Élément de la chaîne"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="structure">${d.nodes.map((x,k)=>`${k?'<span class="arrow">→</span>':''}<button type="button" class="node" data-node-remove="${k}">${esc(x)}</button>`).join('')||'<span style="color:var(--muted)">Construisez la chaîne collectivement.</span>'}</div></div></div>`}
function work(c){return `<div class="work"><div><div class="eyebrow">TRAVAIL</div><h2>${c.work.q}</h2><p>${c.work.copy}</p>${c.work.story?`<div class="storyline"><b>${c.work.story[0]}</b><span>${c.work.story[1]}</span></div>`:''}<span class="time">Travail · ${c.work.time}</span></div><div class="deliverables">${c.work.items.map(x=>`<div class="deliverable"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`}
function rest(c){const r=c.rest,p=reveals[i];return `<div class="rest"><div class="eyebrow">RESTITUTION</div><div class="rest-grid"><div>${boardHtml(r.board)}</div><aside class="discussion">${r.questions.map((q,k)=>`<div class="question"><b>Question ${k+1}</b><span>${q}</span></div>`).join('')}<div class="challenge"><b>Éprouver</b><span>${r.challenge}</span></div></aside></div><div class="synthesis"><div class="reveal-actions"><button class="reveal ${p==='takeaway'?'active':''}" data-reveal="takeaway">Formaliser</button><button class="reveal ${p==='reality'?'active':''}" data-reveal="reality">Retour au réel</button></div>${p?`<div class="reveal-card ${p==='reality'?'reality':''}">${p==='takeaway'?r.takeaway:r.reality}</div>`:''}</div></div>`}
function render(){const c=checkpoints[i];if(mode==='rest'&&!c.rest)mode='work';scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">Activité ${i+1} / 10 · ${mode==='work'?'travail':'restitution'}</div><h1>${c.title}</h1></div><span class="mode">${mode==='work'?'TRAVAIL':'RESTITUTION'}</span></div><div class="shell stage">${mode==='work'?work(c):rest(c)}</div>`;document.getElementById('phaseCount').textContent=`${i+1}/10 · ${mode==='work'?'TRAVAIL':'RESTITUTION'}`;document.getElementById('progress').innerHTML=checkpoints.map((_,k)=>`<button class="dot ${k===i?'active':''}" data-jump="${k}">${k+1}</button>`).join('');document.getElementById('back').disabled=i===0&&mode==='work';document.getElementById('next').textContent=mode==='work'&&c.rest?'Lancer restitution →':i===9?'Fin de séance':'Activité suivante →'}
function next(){const c=checkpoints[i];if(mode==='work'&&c.rest){mode='rest'}else if(i<9){i++;mode='work'}render()}
function back(){if(mode==='rest')mode='work';else if(i>0){i--;mode=checkpoints[i].rest?'rest':'work'}render()}
scene.addEventListener('submit',e=>{e.preventDefault();const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b),fd=new FormData(e.target);if(e.target.matches('[data-capture]')){const v=(fd.get('idea')||'').trim();if(v&&!d.items.includes(v))d.items.push(v)}if(e.target.matches('[data-node]')){const v=(fd.get('node')||'').trim();if(v)d.nodes.push(v)}save();render()});
scene.addEventListener('click',e=>{if(e.target.dataset.reveal){reveals[i]=reveals[i]===e.target.dataset.reveal?null:e.target.dataset.reveal;render();return}const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b);if(e.target.dataset.remove!==undefined)d.items.splice(+e.target.dataset.remove,1);if(e.target.dataset.nodeRemove!==undefined)d.nodes.splice(+e.target.dataset.nodeRemove,1);if(e.target.dataset.count){d.counts[e.target.dataset.count]=Math.max(0,(d.counts[e.target.dataset.count]||0)+(+e.target.dataset.delta))}if(e.target.matches('[data-clear]')){if(confirm('Effacer ce tableau ?'))boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]}}save();render()});
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('newClass').onclick=()=>{if(confirm('Réinitialiser tous les tableaux de classe ?')){boards={};reveals={};try{sessionStorage.removeItem('ec-s1-projection')}catch(_){}i=0;mode='work';render()}};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('progress').onclick=e=>{if(e.target.dataset.jump!==undefined){i=+e.target.dataset.jump;mode='work';render()}};document.addEventListener('keydown',e=>{if(e.target.matches('input,button,select'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')back();if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});render();
</script></body></html>
