<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projection · S1 · Environnements connectés</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">Environnements connectés<small>Séance 1 · Observer la vallée des Aldudes</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Plein écran</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Retour</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Continuer →</button></div>
<script>window.PROJECTOR_DATA={
"session":1,
"activities":[
{"title":"Que voudriez-vous savoir ?","workTime":"4 min","stopTime":"5 min","work":{"question":"Vallée des Aldudes : quelles informations seraient réellement utiles avant de parler technologie ?","support":"Ouvrez le champ, puis assumez une priorité. Vous devrez pouvoir relier chaque choix à un enjeu concret du territoire.","produce":["5–7 informations possibles, puis un Top 3.","Pour chaque priorité : l’enjeu qui justifie sa place."]},"stop":{"question":"Vous avez tous travaillé sur la même vallée. Pourquoi vos priorités ne sont-elles pas forcément les mêmes ?","probeTitle":"Avant de conclure, testons votre manière de prioriser.","probe":["Si l’objectif opérationnel change, quelle priorité descend immédiatement dans votre Top 3 ?","50 nouveaux capteurs gratuits apparaissent : est-ce une raison suffisante pour changer ce que vous voulez savoir ?"],"complements":["Deux Top 3 différents peuvent être également défendables si la décision ou l’horizon ne sont pas les mêmes : pour comparer deux stratégies, commencez donc par expliciter ce cadre.","Une donnée grossière peut avoir beaucoup de valeur si elle change immédiatement l’action ; une donnée très riche peut rester secondaire si elle ne réduit aucune incertitude décisionnelle importante.","Avant d’ajouter des capteurs, cherchez l’incertitude qui limite réellement la décision."]}},
{"title":"Partir de la décision","workTime":"4 min","work":{"question":"Si vous ne pouviez demander qu’une information en premier, laquelle voudriez-vous avoir avant d’agir ?","support":"Pour chaque décision imposée, choisissez une seule information en premier et demandez-vous ce qu’elle pourrait réellement changer dans l’action.","produce":["Une information prioritaire pour chacune des quatre décisions.","Pour chaque choix : ce qui changerait dans l’action si cette information changeait."]}},
{"title":"Du besoin à la mesure","workTime":"4 min","stopTime":"5 min","work":{"question":"Fermer l’accès ou le maintenir : comment relier cette décision à une mesure défendable ?","support":"Complétez la chaîne du cas de Banca avec les propositions mélangées. Puis lisez la même chaîne dans le sens du fonctionnement réel.","produce":["Décision → information → phénomène → observable → mesure.","Une explication : pourquoi le capteur ne doit-il pas être le point de départ du raisonnement ?"]},"stop":{"question":"Dans votre chaîne, où se situait le vrai choix d’ingénierie : dans l’instrument ou avant lui ?","probeTitle":"Une mesure précise suffit-elle à produire une information utile ?","probe":["À quel changement de niveau avez-vous eu le plus de désaccord ?","Le niveau est mesuré au millimètre, mais un affluent critique n’est pas observé : qu’est-ce qui est réellement en défaut ?"],"complements":["Mesurer très précisément le mauvais observable ne renforce pas la décision : la pertinence de l’observable précède la précision de l’instrument.","La représentativité est une propriété distincte de la précision locale. Une excellente mesure en un point peut laisser le phénomène important hors champ.","Conserver la trace décision → information → observable → mesure permet de repérer les choix de capteurs qui ne sont justifiés que par leur disponibilité."]}},
{"title":"Profils d’observation","workTime":"5 min","work":{"question":"Pour chaque source : quelle étendue observe-t-elle, et à quel rythme l’observation peut-elle être renouvelée ?","support":"Décrivez séparément couverture et rythme pour une station, un satellite, un drone et une observation humaine. Ne cherchez pas encore une “meilleure” source.","produce":["Un profil couverture + rythme pour chacune des quatre sources.","Une comparaison : ce qu’une source voit mieux qu’une autre — et ce qu’elle voit moins bien."]}},
{"title":"Observer, indiquer ou inférer ?","workTime":"5 min","stopTime":"5 min","work":{"question":"Dans six promesses fournisseur, qu’est-ce qui est réellement observé — et où commence l’interprétation ?","support":"Séparez la grandeur effectivement produite de l’état recherché. Classez direct / proxy / inférence, puis traitez la provenance séparément.","produce":["Une classification justifiée des six cas.","Pour chaque cas ambigu : ce qui est mesuré et ce qui est interprété."]},"stop":{"question":"Dans vos six cas, où commence réellement l’interprétation ?","probeTitle":"Ce qui paraît “mesuré” peut cacher une hypothèse.","probe":["Quel cas semblait direct jusqu’à ce que vous reformuliez précisément l’état recherché ?","Qu’est-ce qui peut rendre un proxy ou une inférence trompeur alors que le capteur fonctionne parfaitement ?"],"complements":["La validité d’un proxy dépend d’un domaine et d’un contexte ; elle peut dériver lorsque le terrain, les usages ou les relations physiques changent.","Une inférence ajoute des hypothèses de modèle ; une provenance externe ajoute une dépendance opérationnelle. Ce sont deux questions différentes.","Pour un usage critique, gardez visible la frontière entre ce qui est observé et ce qui est déduit — ainsi que l’évidence qui pourrait contredire cette déduction."]}},
{"title":"Une valeur ne suffit pas","workTime":"6 min","work":{"question":"À 14:30, le tableau de bord affiche 32 °C : que décrit réellement cette valeur, et de quand date l’état du terrain ?","support":"Reconstituez son contexte, distinguez les trois événements temporels, puis comparez deux observations numériquement identiques.","produce":["32 °C replacé dans son contexte : grandeur, unité, objet, temps et source.","Terrain observé / résultat produit / application informée : trois instants distincts.","Une raison pour laquelle deux valeurs égales peuvent être incomparables."]}},
{"title":"Dimensionner l’observation","workTime":"5 min","stopTime":"5 min","work":{"question":"Quelle cadence et quelle granularité spatiale faut-il pour suivre le phénomène avant la décision ?","support":"Dimensionnez trois plans d’observation à partir de la dynamique du phénomène. Terminez par le cas d’une acquisition toutes les 60 minutes.","produce":["Pour crue, ouvrage et pâture : une couverture et une cadence justifiées.","Pour une période de 60 min : l’âge maximal plausible de la dernière observation."]},"stop":{"question":"Qu’est-ce qui a réellement dimensionné vos plans : la technologie disponible ou la dynamique du phénomène ?","probeTitle":"Couverture, détail, fréquence : peut-on améliorer l’un sans améliorer les autres ?","probe":["Pourquoi une mesure parfaite toutes les 60 minutes peut-elle être inutilisable pour un phénomène dangereux en 10 minutes ?","Une mesure extrêmement précise en un point améliore-t-elle automatiquement la connaissance d’une parcelle de 50 ha ?"],"complements":["Période d’échantillonnage et latence ne sont pas la même chose : la fraîcheur finale dépend de l’âge à l’acquisition, puis du traitement et du transport.","Ordre de grandeur : Sentinel‑2 couvre environ 290 km de fauchée avec des pixels de 10/20/60 m et une revisite nominale de 5 jours — large ne signifie ni fin ni continu.","Le LiDAR HD est de l’ordre de 10 points/m², soit environ 10 millions de points sur 1 km² : beaucoup de détail local n’implique toujours pas une observation fréquente."]}},
{"title":"Qualité relative à la décision","workTime":"6 min","work":{"question":"Même donnée, deux usages : suffit-elle pour chacun, et quelle dimension explique le contraste ?","support":"Traitez les trois dossiers l’un après l’autre. La donnée reste identique ; seule la décision change.","produce":["Deux jugements par dossier : acceptable ou fragile selon l’usage.","Une dimension de qualité qui explique le contraste."]}},
{"title":"Construire une stratégie d’observation","workTime":"5 min","stopTime":"5 min","work":{"question":"Surveiller le risque de crue dans la vallée avec trois sources maximum : comment les rendre réellement complémentaires ?","support":"Composez une v1 parcimonieuse. Chaque source doit avoir un rôle, une limite et une raison d’être ; votre stratégie doit aussi assumer un angle mort.","produce":["2–3 sources maximum avec rôle + limite pour chacune.","Un angle mort ou une dépendance que votre v1 ne supprime pas."]},"stop":{"question":"Vous avez plusieurs sources. Sont-elles réellement complémentaires — ou seulement différentes en apparence ?","probeTitle":"Regardons les dépendances plutôt que le nombre de sources.","probe":["Quelle paire couvre réellement des limites différentes ?","Si une donnée météo ou un réseau commun disparaît, combien de vos sources restent réellement indépendantes ?"],"complements":["L’indépendance se juge par les causes de panne communes, pas par le nombre de technologies, d’applications ou de fournisseurs visibles.","La maintenance, l’alimentation, la calibration, le réseau et le fournisseur sont eux aussi des dépendances de la stratégie sur sa durée de vie.","Une observation humaine, plus lente et moins scalable, peut parfois constituer une voie de confirmation réellement indépendante : la complémentarité n’est pas uniquement technologique."]}},
{"title":"Incident : décider en mode dégradé","workTime":"7 min","stopTime":"5 min","work":{"question":"Un incident touche votre v1 : la décision de 14:45 reste-t-elle défendable, et sous quelle règle minimale ?","support":"Partez de l’effet sur la décision, remontez vers l’hypothèse et l’information menacées, puis choisissez une seule réponse minimale et rendez son coût visible.","produce":["Incident → effet sur la décision → hypothèse / information menacée.","Une règle minimale de mode dégradé + le risque ou coût qui subsiste."]},"stop":{"question":"À quel moment votre incident technique est-il devenu un problème de décision ?","probeTitle":"Une bonne réponse dégradée n’est pas forcément “continuer à tout prix”.","probe":["Confirmer par une autre voie, attendre ou déclarer l’état inconnu peuvent-ils être de bonnes décisions ?","Qu’est-ce que votre mitigation ajoute en échange : délai, coût, dépendance ou incertitude ?","Pourquoi deux stratégies v1 peuvent-elles réagir différemment au même incident ?"],"complements":["Un mode dégradé peut être une abstention, une confirmation supplémentaire ou une exploitation restreinte : préserver le service n’est pas toujours l’objectif prioritaire.","Une mitigation déplace souvent une partie du risque vers du délai, de la maintenance, une nouvelle dépendance ou une incertitude résiduelle ; ce déplacement doit rester visible.","La qualité de la révision vient de sa justification causale — incident → information → décision → réponse — et non du nombre de composants ajoutés."]}}
],
"final":{"title":"Vous savez maintenant raisonner avant de connecter.","support":"Quatre réflexes à conserver pour la suite.","points":[{"title":"Partir de la décision","text":"Identifier l’information qui peut réellement changer l’action avant de chercher une source."},{"title":"Justifier l’observation","text":"Relier information, phénomène, observable, mesure, espace et temps sans confondre mesure et interprétation."},{"title":"Juger puis composer","text":"Évaluer une donnée relativement à son usage, puis combiner des sources avec rôles, limites et dépendances explicites."},{"title":"Réviser sous hypothèses","text":"Quand une hypothèse tombe, relier l’incident à la décision et choisir un mode dégradé défendable."}],"iotTitle":"Une partie de ce que vous avez manipulé porte un nom : l’Internet des objets (IoT).","iotText":"Capteurs, stations et autres objets physiques instrumentés et connectés relèvent de l’IoT. Mais l’environnement connecté que vous avez construit est plus large : il peut aussi intégrer satellite, services externes, historiques métier et observations humaines.","bridge":"Vous savez quoi observer. Comment transporter maintenant ces observations dispersées dans une vallée jusqu’à l’endroit où elles seront utiles — avec quelles portées, quels débits, quelle énergie et quelles dépendances ?"}
};</script><script src="../assets/projector.js"></script></body></html>
