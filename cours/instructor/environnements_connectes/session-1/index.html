.synthesis{margin-top:14px;border-top:2px solid var(--ink);padding-top:10px}.synthesis-head{align-items:center}.synthesis-head>div span{max-width:72ch}.reveal-actions{margin:0}.reveal{min-height:34px}.reveal-card{padding:13px 15px;line-height:1.45}

<script>
const checkpoints=[
{title:'Que voudriez-vous savoir ?',work:{q:'Vallée des Aldudes : quelles informations seraient réellement utiles avant de parler technologie ?',copy:'Les groupes choisissent puis hiérarchisent leurs besoins sans parler de capteurs.',intervention:{who:'Maialen · coordination territoriale',kind:'Priorité de mission',context:'Aucune stratégie d’observation n’est encore définie.',input:'Je veux savoir ce que nous devons être capables de connaître — et pourquoi certaines informations comptent plus que d’autres.',impact:'Prioriser les informations utiles avant de discuter des moyens.'},time:'4 min',items:[['1 · Sélectionner','5–7 informations parmi le corpus'],['2 · Prioriser','Top 3 + enjeu associé'],['Défense','Pourquoi ces trois-là ?']]},rest:{board:{type:'capture',id:'a1',title:'Priorités de la classe',prompt:'Saisir 4–8 informations récurrentes.'},questions:['Quelles priorités reviennent ?','Même donnée, même décision ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'50 capteurs gratuits deviennent disponibles. La stratégie doit-elle changer ?',anchors:[{title:'Une priorité est relative à une décision',items:['criticité de la décision','horizon temporel','coût d’une erreur']},{title:'La valeur d’une donnée dépend de son usage',items:['décisive ici','simple contexte ailleurs','inutile si elle ne change rien']},{title:'Plus de capteurs ne remplace pas la priorisation',items:['décision avant donnée','utile ≠ disponible','observer moins mais mieux']}],takeaway:'Décision → information nécessaire. Disponible ne signifie pas utile.',reference:'<b>Panorama :</b> eau/crue · routes/accès · ouvrages · forêt/versants · agriculture/pastoralisme · bâtiments/services · contexte. Le panorama est volontairement plus large que les choix proposés pendant l’activité : l’enjeu est de prioriser, pas d’épuiser le territoire.',reality:'Banca, Les Aldudes et Urepel composent la vallée. Le risque d’inondation associé à la Nive des Aldudes est documenté et constitue un bon exemple de besoin territorial où l’information doit être reliée à une décision.'}},
{title:'Partir de la décision',work:{q:'Si vous ne pouviez demander qu’une information en premier, laquelle voudriez-vous avoir avant d’agir ?',copy:'Les quatre décisions apparaissent une par une. Pour chacune, les groupes choisissent l’information qu’ils demanderaient en premier ; les autres restent éventuellement utiles comme contexte.',intervention:{who:'Peio · exploitation terrain',kind:'Contrainte d’usage',context:'Les groupes ont fixé trois priorités ; ils doivent maintenant montrer à quelles décisions concrètes elles servent.',input:'Pour fermer un accès, envoyer une équipe ou déclencher une vigilance, vous n’avez pas besoin de tout savoir. Si vous ne pouviez demander qu’une information en premier, laquelle voudriez-vous avoir avant d’agir ?',impact:'Distinguer l’information qui change immédiatement la décision de celles qui améliorent seulement le contexte.'},time:'4 min',items:[['1 · Décider','ROUTE → PONT → CRUE → PÂTURE'],['2 · Choisir','1 information demandée en premier'],['Navigation','Revenir sur une décision si nécessaire'],['Mode Défi','Retirer cette information et expliciter l’hypothèse']] }},
{title:'Ce que l’on peut réellement observer',work:{q:'Construire la chaîne entre décision et mesure.',copy:'Ordonner les cinq niveaux. Les cas crue, ouvrage, pâture et feu serviront ensuite à tester la chaîne pendant la restitution.',time:'4 min',items:[['Ordonner','Chaîne générale · 5 étapes'],['Puis en restitution','Tester la chaîne sur plusieurs situations'],['Défense','Justifier le passage d’un niveau au suivant']]},rest:{board:{type:'structure',id:'a3',title:'Chaîne collective',prompt:'Construire la chaîne à partir des propositions.'},questions:['Où les chaînes divergent-elles ?','Quand le besoin devient-il mesurable ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'Le niveau est mesuré au millimètre mais un affluent critique n’est pas observé.',anchors:[{title:'Ne pas mélanger les niveaux',items:['décision','information','phénomène','observable','mesure']},{title:'L’observable est la charnière',items:['ce qui peut être observé','avant le choix de l’instrument','mesure = résultat produit']},{title:'Précision locale ≠ vision complète',items:['représentativité','complétude spatiale','mauvais observable possible']}],takeaway:'Décision → information → phénomène → observable → mesure.',reference:'<b>Chaîne :</b> décision → information → phénomène → observable → mesure. Transferts : pont (accélération/vibration), pâture (état hydrique/végétation), feu (fumée/thermique). Une mesure très précise peut rester pauvre si l’observable est mal choisi.',reality:'La Nive des Aldudes est réellement suivie à Saint-Étienne-de-Baïgorry par une station hydrométrique mise en service en 1960, utilisée notamment pour le suivi d’étiage et la prévision des crues.'}},
{title:'D’où viennent les données ?',work:{q:'Quelles familles de sources observeraient utilement la vallée ?',copy:'Le travail porte sur quatre sources : station, satellite, drone et observation humaine. Le panorama des huit familles reste disponible en support, mais n’a pas besoin d’être ouvert pour réussir l’activité.',intervention:{who:'Inès · ingénierie systèmes',kind:'Revue des sources',context:'Les groupes savent ce qu’ils cherchent à observer ; plusieurs familles de sources peuvent contribuer, avec des couvertures et des rythmes différents.',input:'Une source très fréquente ne voit peut-être qu’un point ; une source très large ne revient pas forcément souvent.',impact:'Comparer ce que chaque source permet de voir — et ce qu’elle laisse dans l’ombre — avant de construire une combinaison.'},time:'5 min',items:[['Placer','4 sources sur espace × rythme'],['Comparer','choisir une paire complémentaire'],['Justifier','échelle / temporalité / recoupement / disponibilité']] }},
{title:'Observer, indiquer ou inférer ?',work:{q:'Analyser six mini-scénarios : direct, proxy/indicateur ou inférence, puis distinguer la provenance de la prévision météo.',copy:'Chaque carte donne un contexte, ce qui est produit et l’état recherché. Les groupes classent la relation dans trois bacs, puis traitent séparément la provenance externe.',time:'5 min',items:[['Lire','contexte + grandeur produite + état recherché'],['Ranger','direct / proxy / inférence'],['Séparer','provenance interne / externe']]},rest:{board:{type:'compare',id:'a5',title:'Où était le désaccord ?',prompt:'Compter les groupes pour l’exemple jugé le plus ambigu.',categories:['Capteur niveau','Indice végétation','Caméra + algorithme','Prévision météo']},questions:['Quel exemple divise le plus ?','Qu’est-ce qui est réellement mesuré ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'La relation entre un proxy et l’état recherché change après une modification du terrain.',anchors:[{title:'« Direct » dépend de la grandeur formulée',items:['hauteur locale : directe','risque de crue : interprété','catégorie ≠ qualité']},{title:'Rendre visibles les couches d’interprétation',items:['mesure directe','proxy / indicateur','inférence','provenance séparée']},{title:'Une mesure peut rester juste et devenir trompeuse',items:['proxy qui dérive','modèle hors domaine','contexte qui change']}],takeaway:'Direct ≠ proxy ≠ inférence. La provenance interne/externe est un autre axe à rendre visible.',reference:'<b>Référence :</b> hauteur locale = observation directe ; humidité sol = proxy possible du besoin hydrique ; probabilité de feu = inférence. Une prévision météo est une inférence et peut en plus être externe au système. Sur un pont : signal → indicateur → état suspecté → décision.',reality:'Transfert pont : un accéléromètre mesure une accélération ; un état de santé structurelle est ensuite inféré à partir d’indicateurs, de modèles et du contexte.'}},
{title:'Une valeur ne suffit pas',work:{q:'Transformer « 32 » en observation exploitable puis tester la comparabilité de deux observations.',copy:'Ajouter le contexte autour de la valeur, distinguer temps du phénomène, production du résultat et arrivée, puis comparer deux observations affichant toutes deux 32 °C mais décrivant des objets différents.',intervention:{who:'Samir · données & sécurité',kind:'Audit de donnée',context:'Des valeurs sont disponibles, mais elles ne peuvent pas encore être comparées proprement sans préciser où, quand et comment elles ont été produites.',input:'32 °C : où, quand, sur quoi, produit comment ?',impact:'Passer d’une valeur isolée à une observation contextualisée que l’on peut réellement interpréter et comparer.'},time:'6 min',items:[['1 · Contextualiser','5 éléments essentiels'],['2 · Horodater','Phénomène · résultat · arrivée'],['3 · Comparer','au moins 2 causes de non-comparabilité']] }},
{title:'Où et quand observer ?',work:{q:'Choisir un dispositif adapté à trois situations.',copy:'Crue rapide, ouvrage après choc et pâture étendue imposent des compromis différents. Le mini-calcul de fraîcheur devient un Mode Défi facultatif.',time:'5 min',items:[['Choisir','1 dispositif par situation'],['Défendre','vitesse · couverture · délai utile'],['Mode Défi','Âge maximal d’une donnée']]},rest:{board:{type:'compare',id:'a7',title:'Qu’est-ce qui domine ?',prompt:'Tally du critère jugé dominant par les groupes.',categories:['Fréquence','Couverture','Précision','Représentativité']},questions:['Quels phénomènes exigent surtout de la fréquence ?','Précision et représentativité sont-elles interchangeables ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'Deux capteurs éloignés donnent la même valeur. Peut-on généraliser à toute la vallée ?',anchors:[{title:'Le bon rythme dépend de la dynamique du phénomène',items:['fréquence','fraîcheur','délai utile pour agir']},{title:'Précision ≠ représentativité',items:['précis au point mesuré','variabilité spatiale possible','plus de points ≠ meilleur capteur']},{title:'Deux points concordants ne prouvent pas une zone homogène',items:['échantillonnage','couverture','variabilité non observée']}],takeaway:'Une observation a une géométrie et un temps : espace, fréquence, fraîcheur, représentativité.',reference:'<b>Repères :</b> précision ≠ représentativité ; fréquence ≠ fraîcheur ; résolution ≠ couverture. Sentinel‑2 : 10/20/60 m et revisite nominale 5 jours (2 satellites). LiDAR HD IGN : acquisition spatiale dense, pas un flux temps réel.',reality:'Sentinel-2 illustre le compromis : 10/20/60 m selon les bandes et 5 jours de revisite nominale pour la constellation à deux satellites.'}},
{title:'Une donnée est-elle « bonne » ?',work:{q:'Qu’est-ce qui fait basculer une même donnée quand l’usage change ?',copy:'Samir reprend trois jeux de données et change uniquement la décision à prendre. Les dimensions de qualité restent visibles mais ne deviennent cliquables qu’après le jugement acceptable/fragile ; chaque duel se termine par une comparaison des deux usages.',intervention:{who:'Samir · données',kind:'Mise à l’épreuve',context:'La mission possède désormais des observations contextualisées, mais Maialen demande si elles sont « assez bonnes ».',input:'Je ne veux pas une note globale. Gardez la même donnée et changez seulement l’usage.',impact:'Faire émerger la qualité comme aptitude à l’usage avant de formaliser ses dimensions.'},time:'6 min',items:[['1 · Juger','acceptable / fragile'],['2 · Qualifier','dimension décisive'],['3 · Comparer','ce que le changement d’usage a modifié']] }},
{title:'Construire une stratégie d’observation',work:{q:'Surveiller le risque de crue dans la vallée des Aldudes avec trois sources maximum.',copy:'Chaque source doit maintenant avoir un rôle informationnel explicite et une limite assumée. La combinaison reçoit ensuite un angle mort global avant gel de la v1.',intervention:{who:'Maialen · coordination territoriale',kind:'Arbitrage',context:'Les groupes connaissent maintenant les forces et limites des principales observations ; ils doivent composer sans chercher à tout couvrir.',input:'Trois sources maximum. Pour chacune : quelle information protège-t-elle et quelle limite acceptez-vous ?',impact:'Assembler quelques sources complémentaires, donner à chacune un rôle clair et reconnaître l’angle mort qui subsiste.'},time:'5 min',items:[['1 · Composer','2–3 sources maximum'],['2 · Qualifier','Rôle + limite par source'],['3 · Assumer','1 angle mort avant de figer v1']]},rest:{board:{type:'capture',id:'a9',title:'Stratégies de la classe',prompt:'Saisir les combinaisons ou principes distinctifs, pas toutes les phrases.'},questions:['Quelles limites sont réellement complémentaires ?','Où existe-t-il une fausse redondance ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'Trois sources utilisent la même donnée météo en amont. Sont-elles indépendantes ?',anchors:[{title:'Complémentarité = limites différentes',items:['autre échelle','autre temporalité','autre dépendance','validation croisée']},{title:'Diversité technologique ≠ indépendance',items:['même réseau','même fournisseur','même donnée amont','même modèle']},{title:'Une dépendance commune peut annuler la redondance',items:['chercher la cause commune','nommer l’angle mort','défendre le mode dégradé']}],takeaway:'Une stratégie combine des limites différentes et explicite ses dépendances.',reference:'<b>Qualité :</b> précision · fraîcheur · complétude · cohérence · représentativité · disponibilité.<br><b>Composition :</b> rôle informationnel de chaque source + limite assumée + dépendances communes + angle mort. Trois sources utilisant le même réseau ou la même donnée amont ne constituent pas trois voies indépendantes.',reality:'À Banca, le projet Olha a réellement été adapté avec un nouveau bâtiment hors zone à risque de crue ; la collectivité mentionne aussi travaux de berges et reconstruction de la station d’épuration.'}},
{title:'Incident : votre vision du réel est fausse',work:{q:'Votre stratégie v1 rencontre un incident : qu’est-ce qui doit réellement changer ?',copy:'Sélectionner un incident, puis produire un delta v1→v2 réellement visible : changement de sources et/ou règle d’exploitation. Garder ensuite trois repères : hypothèse cassée → information menacée → faiblesse restante.',intervention:{who:'Message exploitation',kind:'Incident',context:'Une première stratégie est arrêtée et ses limites sont visibles ; elle va maintenant être confrontée à une hypothèse qui ne tient plus.',input:'Une hypothèse de votre v1 vient de tomber.',impact:'Réviser uniquement ce que l’incident remet en cause et garder la trace du raisonnement qui justifie le passage de v1 à v2.'},time:'7 min',items:[['1 · Choisir','1 incident'],['2 · Réviser','sources et/ou règle d’exploitation'],['3 · Expliquer','hypothèse + information + faiblesse'],['STOP final','5 questions de mémoire avant la synthèse']]},rest:{board:{type:'compare',id:'a10',title:'Quel incident a le plus forcé la révision ?',prompt:'Comptage après engagement des groupes.',categories:['Source indisponible','Dérive capteur','Retard','Contradiction']},questions:['Quel changement a été structurel ?','Quelle hypothèse faisait le plus de travail ?'],questionLabels:['COMPARER','EXPLIQUER'],challenge:'La v2 traite l’incident, mais quelle nouvelle dépendance crée-t-elle ?',anchors:[{title:'Un changement structurel modifie une responsabilité ou une source',items:['pas seulement un seuil','pas seulement une couleur d’alerte','delta v1 → v2 explicable']},{title:'Les hypothèses portent une partie de la conception',items:['disponibilité','exactitude','fraîcheur','cohérence / indépendance']},{title:'Une mitigation déplace souvent le problème',items:['nouvelle dépendance','coût','délai','fragilité restante']}],takeaway:'Hypothèse changée → information menacée → modification → vulnérabilité restante.',reference:'<b>Révision :</b> hypothèse changée → information menacée → règle/responsabilité affectée → delta v2 → faiblesse restante. Une mitigation n’annule pas le risque ; elle déplace souvent coût, dépendance ou délai.',reality:'La robustesse n’est pas une propriété absolue : elle est relative aux incidents considérés et au comportement dégradé acceptable.'}}
];
let i=0,mode='work',boards={},reveals={};try{boards=JSON.parse(sessionStorage.getItem('ec-s1-projection')||'{}')}catch(_){boards={}}const scene=document.getElementById('scene');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function boardData(b){if(!boards[b.id])boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]};return boards[b.id]}
function save(){try{sessionStorage.setItem('ec-s1-projection',JSON.stringify(boards))}catch(_){}}
function boardHtml(b){const d=boardData(b);if(b.type==='capture')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Capture</span></div><div class="board-body"><form class="board-form" data-capture><input name="idea" maxlength="70" placeholder="Entrée courte"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="chips">${d.items.map((x,k)=>`<button class="chip" type="button" data-remove="${k}">${esc(x)} ×</button>`).join('')||'<span style="color:var(--muted)">Les contributions apparaissent ici.</span>'}</div></div></div>`;if(b.type==='compare')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Compare</span></div><div class="board-body"><div class="compare">${b.categories.map(c=>`<div class="compare-item"><strong>${c}</strong><div><div class="count">${d.counts[c]||0}</div><div class="count-actions"><button data-count="${esc(c)}" data-delta="-1">−</button><button data-count="${esc(c)}" data-delta="1">+</button></div></div></div>`).join('')}</div><button class="btn" type="button" data-clear style="margin-top:10px">Effacer</button></div></div>`;return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Structure</span></div><div class="board-body"><form class="board-form" data-node><input name="node" maxlength="35" placeholder="Élément de la chaîne"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="structure">${d.nodes.map((x,k)=>`${k?'<span class="arrow">→</span>':''}<button type="button" class="node" data-node-remove="${k}">${esc(x)}</button>`).join('')||'<span style="color:var(--muted)">Construisez la chaîne collectivement.</span>'}</div></div></div>`}
function avatarFor(w){const name=(w||'').split('·')[0].trim();if(name.toLowerCase().startsWith('message'))return '!';const parts=name.split(/\s+/).filter(Boolean);return parts.length>1?(parts[0][0]+parts[1][0]).toUpperCase():name.slice(0,2).toUpperCase()}
function work(c){const iv=c.work.intervention;let beat='';if(iv){const who=iv.who||'',parts=who.split('·').map(x=>x.trim()),name=parts.shift()||who,role=parts.join(' · ');beat=`<div class="story-beat"><div class="story-avatar">${avatarFor(who)}</div><div><div class="story-meta"><strong>${esc(name)}</strong>${role?`<span>${esc(role)}</span>`:''}<b>${esc(iv.kind||'Nouvelle contrainte')}</b></div><small class="story-input-label">NOUVELLE INFORMATION</small><p>${esc(iv.input)}</p></div></div>`}return `<div class="phase-kicker">TRAVAIL</div>${beat}<div class="projector-move">À VOUS</div><div class="work-simple"><div class="work-simple-main"><h2>${c.work.q}</h2><p>${c.work.copy}</p><span class="work-time">Temps cible · ${c.work.time}</span></div><div class="work-deliverables">${c.work.items.map(x=>`<div class="work-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`}
function discussionDeck(r){const qs=r.questions||[],labels=r.questionLabels||qs.map((_,k)=>`QUESTION ${k+1}`),compare=qs[0]?{label:labels[0]||'COMPARER',q:qs[0]}:null,cards=[...qs.slice(1).map((q,k)=>({label:labels[k+1]||`QUESTION ${k+2}`,q,anchor:r.anchors?.[k+1]})),{label:'ÉPROUVER',q:r.challenge,anchor:r.anchors?.[qs.length]}].filter(x=>x.q);return `<aside class="discussion-deck"><div class="discussion-deck-head"><div class="discussion-deck-kicker">RESTITUTION</div><h3>Comparer d’abord. Stabiliser ensuite.</h3><p>La comparaison est l’objet de la discussion : elle n’a pas de réponse à retourner. Les cartes suivantes servent seulement à fixer les distinctions ou règles qui doivent rester après l’échange.</p></div>${compare?`<div class="discussion-compare"><div><b>${esc(compare.label)}</b><span>DISCUSSION OUVERTE · NE PAS RETOURNER</span></div><strong>${esc(compare.q)}</strong><small>Faites circuler les réponses et les artefacts. Cherchez les divergences avant de formaliser.</small></div>`:''}${cards.length?`<div class="discussion-anchor-head"><b>APRÈS LA COMPARAISON</b><span>Retournez seulement ce qui mérite un ancrage explicite.</span></div><div class="discussion-card-grid">${cards.map((c,k)=>`<button class="discussion-flip" type="button" data-discuss-card="${k}" aria-expanded="false"><span class="discussion-flip-inner"><span class="discussion-face discussion-front"><b>${esc(c.label)}</b><strong>${esc(c.q)}</strong><small>Après échange · retourner →</small></span><span class="discussion-face discussion-back"><b>À GARDER</b><strong>${esc(c.anchor?.title||r.takeaway)}</strong>${c.anchor?.items?.length?`<div class="discussion-anchor-items">${c.anchor.items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}<small>Retourner ↺</small></span></span></button>`).join('')}</div>`:''}<div class="discussion-rule"><b>Comparer</b> fait émerger les écarts. <b>Préciser / Éprouver</b> servent à stabiliser le raisonnement. Le <b>Retour au réel</b> n’est ouvert que s’il apporte un transfert supplémentaire.</div></aside>`}
function rest(c){const r=c.rest,p=reveals[i]==='reality'?'reality':null;return `<div class="rest"><div class="eyebrow">RESTITUTION</div><div class="rest-grid"><div class="restitution-main">${boardHtml(r.board)}</div>${discussionDeck(r)}</div>${r.reality?`<div class="synthesis"><div class="synthesis-head"><div><strong>Retour au réel</strong><span>Une fois les ancrages sortis des cartes, reliez-les à un cas, une donnée ou une limite concrète.</span></div><div class="reveal-actions"><button class="reveal ${p==='reality'?'active':''}" data-reveal="reality">${p==='reality'?'Fermer':'Ouvrir le retour au réel'}</button></div></div>${p?`<div class="reveal-card reality">${r.reality}</div>`:''}</div>`:''}</div>`}
function render(){const c=checkpoints[i];if(mode==='rest'&&!c.rest)mode='work';scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">Activité ${i+1} / 10 · ${mode==='work'?'travail':'restitution'}</div><h1>${c.title}</h1></div><span class="mode">${mode==='work'?'TRAVAIL':'RESTITUTION'}</span></div><div class="shell stage">${mode==='work'?work(c):rest(c)}</div>`;document.getElementById('phaseCount').textContent=`${i+1}/10 · ${mode==='work'?'TRAVAIL':'RESTITUTION'}`;document.getElementById('progress').innerHTML=checkpoints.map((_,k)=>`<button class="dot ${k===i?'active':''}" data-jump="${k}">${k+1}</button>`).join('');document.getElementById('back').disabled=i===0&&mode==='work';document.getElementById('next').textContent=mode==='work'&&c.rest?'Lancer restitution →':i===9?'Fin de séance':'Activité suivante →'}
function next(){const c=checkpoints[i];if(mode==='work'&&c.rest){mode='rest'}else if(i<9){i++;mode='work'}render()}
function back(){if(mode==='rest')mode='work';else if(i>0){i--;mode=checkpoints[i].rest?'rest':'work'}render()}
scene.addEventListener('submit',e=>{e.preventDefault();const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b),fd=new FormData(e.target);if(e.target.matches('[data-capture]')){const v=(fd.get('idea')||'').trim();if(v&&!d.items.includes(v))d.items.push(v)}if(e.target.matches('[data-node]')){const v=(fd.get('node')||'').trim();if(v)d.nodes.push(v)}save();render()});
scene.addEventListener('click',e=>{const flip=e.target.closest('[data-discuss-card]');if(flip){flip.classList.toggle('flipped');flip.setAttribute('aria-expanded',flip.classList.contains('flipped')?'true':'false');return}if(e.target.dataset.reveal){reveals[i]=reveals[i]===e.target.dataset.reveal?null:e.target.dataset.reveal;render();return}const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b);if(e.target.dataset.remove!==undefined)d.items.splice(+e.target.dataset.remove,1);if(e.target.dataset.nodeRemove!==undefined)d.nodes.splice(+e.target.dataset.nodeRemove,1);if(e.target.dataset.count){d.counts[e.target.dataset.count]=Math.max(0,(d.counts[e.target.dataset.count]||0)+(+e.target.dataset.delta))}if(e.target.matches('[data-clear]')){if(confirm('Effacer ce tableau ?'))boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]}}save();render()});
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('newClass').onclick=()=>{if(confirm('Réinitialiser tous les tableaux de classe ?')){boards={};reveals={};try{sessionStorage.removeItem('ec-s1-projection')}catch(_){}i=0;mode='work';render()}};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('progress').onclick=e=>{if(e.target.dataset.jump!==undefined){i=+e.target.dataset.jump;mode='work';render()}};document.addEventListener('keydown',e=>{if(e.target.matches('input,button,select'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')back();if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});render();
</script></body></html>
