{title:'Que voudriez-vous savoir ?',work:{q:'Vallée des Aldudes : quelles informations seraient réellement utiles avant de parler technologie ?',copy:'Retenez 5–7 informations possibles, puis défendez un Top 3 relié aux enjeux du territoire.',intervention:{who:'Maialen · coordination territoriale',kind:'Priorité de mission',context:'Aucune stratégie d’observation n’est encore définie.',input:'Je veux savoir ce que nous devons être capables de connaître — et pourquoi certaines informations comptent plus que d’autres.',impact:'Prioriser les informations utiles avant de discuter des moyens.'},time:'4 min',items:[['1 · Sélectionner','5–7 informations parmi le corpus'],['2 · Prioriser','Top 3 + enjeu associé'],['Défense','Pourquoi ces trois-là ?']]},rest:{board:{type:'capture',id:'a1',title:'Priorités de la classe',prompt:'Quelles informations reviennent le plus souvent dans vos priorités ?'},questions:['Même vallée : pourquoi vos Top 3 diffèrent-ils ?','Quelle priorité deviendrait secondaire si l’objectif opérationnel changeait ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'50 capteurs gratuits deviennent disponibles. La stratégie doit-elle changer ?',anchors:[{title:'Une priorité dépend du cadre d’usage',items:['décision visée','horizon temporel','coût d’une erreur']},{title:'La valeur d’une donnée dépend de son usage',items:['décisive ici','simple contexte ailleurs','inutile si elle ne change rien']},{title:'Plus de capteurs ne remplace pas la priorisation',items:['décision avant donnée','utile ≠ disponible','observer moins mais mieux']}],takeaway:'Une priorité informationnelle dépend de l’usage, de l’horizon et du coût d’une erreur. Disponible ne signifie pas prioritaire.',reference:'<b>Panorama :</b> eau/crue · routes/accès · ouvrages · forêt/versants · agriculture/pastoralisme · bâtiments/services · contexte. Le panorama sert à ouvrir le champ ; la priorité reste provisoire tant que l’usage et l’horizon ne sont pas explicites.',reality:'Banca, Les Aldudes et {title:'Partir de la décision',work:{q:'Si vous ne pouviez demander qu’une information en premier, laquelle voudriez-vous avoir avant d’agir ?',copy:'Traitez les quatre décisions une par une. À chaque fois, demandez une seule information en premier et soyez prêts à expliquer ce qu’elle changerait dans l’action.',intervention:{who:'Peio · exploitation terrain',kind:'Contrainte d’usage',context:'A1 a ouvert le champ depuis le territoire. A2 inverse maintenant le raisonnement : une décision est imposée et il faut identifier l’information à demander en premier.',input:'Pour fermer un accès, envoyer une équipe ou déclencher une vigilance, vous n’avez pas besoin de tout savoir. Si vous ne pouviez demander qu’une information en premier, laquelle voudriez-vous avoir avant d’agir ?',impact:'Distinguer l’information qui change immédiatement la décision de celles qui améliorent seulement le contexte.'},time:'4 min',items:[['1 · Inverser','territoire → informations devient décision → besoin'],['2 · Choisir','1 information demandée en premier'],['Défendre','si elle change, l’action peut-elle changer ?'],['VoI','une information vaut surtout par ce qu’elle change dans la décision'],['Test rapide','CRUE : information retirée → agir / confirmer / différer']] }},
{title:'Du besoin à la mesure',work:{q:'Fermer l’accès ou le maintenir : de quelle information avez-vous besoin, quel phénomène la porte et quelle mesure peut l’ancrer ?',copy:'Complétez les cinq lignes du cas de Banca. Puis regardez la même chaîne dans les deux sens : d’abord pour concevoir l’observation, ensuite lorsque le système fonctionne.',intervention:{who:'Inès · ingénierie systèmes',kind:'Chaîne de justification',context:'A2 a identifié l’information prioritaire ; un prestataire saute maintenant directement vers « un capteur de hauteur d’eau ».',input:'Un capteur n’est pas une justification. Montrez pourquoi cette valeur peut éclairer la décision.',impact:'Relier décision → information → phénomène → observable → mesure sans sauter de niveau.'},time:'5 min',items:[['1 · Compléter','5 niveaux nommés · une réponse par ligne'],['2 · Comparer','même chaîne : conception vs exploitation'],['Question','pourquoi partir de la décision avant le capteur ?']]},rest:{board:{type:'structure',id:'a3',title:'Chaîne collective',prompt:'Quelle chaîne relie la décision de Banca à une mesure défendable ?'},questions:['À quel niveau avez-vous eu le plus de désaccord ?','Pourquoi un instrument très précis peut-il rester inutile pour la décision ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'Le niveau est mesuré au millimètre mais un affluent critique n’est pas observé.',anchors:[{title:'Chaque niveau répond à une question différente',items:['décision : quelle action ?','information : que faut-il savoir ?','phénomène / observable / mesure : comment l’ancrer dans le réel ?']},{title:'Le choix critique est souvent avant la technologie',items:['observable pertinent','échelle correcte','mesure reliée à la décision']},{title:'Conception et exploitation lisent la même chaîne en sens opposés',items:['concevoir : décision → mesure','exploiter : phénomène → décision','ne pas confondre logique de conception et flux d’information']}],takeaway:'Conception : décision → information → phénomène → observable → mesure. Exploitation : phénomène → observable → mesure → information interprétée → décision.',reference:'<b>Point clé :</b> la technologie arrive après le choix de l’observable. La chaîne sert à détecter les raccourcis « besoin → capteur » ou « valeur → décision » qui masquent une hypothèse.',reality:'La Nive des Aldudes est réellement suivie à Saint-Étienne-de-Baïgorry par une station hydrométrique utilisée notamment pour le suivi d’étiage et la prévision des crues.'}},
{title:'Profils d’observation',work:{q:'Pour chaque source : quelle étendue observe-t-elle, et à quel rythme l’observation est-elle renouvelée ?',copy:'Pour la station, le satellite, le drone et l’observation humaine, décrivez séparément la zone couverte et le rythme auquel une nouvelle observation peut être obtenue.',intervention:{who:'Inès · ingénierie systèmes',kind:'Revue des sources',context:'A3 a défini l’observable. Il faut maintenant caractériser le profil spatial et temporel de la source capable de le produire.',input:'Avant de comparer des technologies, dites-moi quelle portion du territoire elles voient et comment l’observation est renouvelée.',impact:'Prendre une décision de profil d’observation avant de discuter qualité globale, coût ou connectivité.'},time:'5 min',items:[['1 · Couverture','point / zone / large territoire'],['2 · Rythme','fréquent / périodique / à la demande'],['3 · Lire','comparer les quatre profils sans dire « meilleure source »']] }},
{title:'Observer, indiquer ou inférer ?',work:{q:'Décoder six promesses fournisseur : que produit réellement la source, et où commence l’interprétation ?',copy:'Pour chaque cas, distinguez ce qui est réellement produit de l’état recherché : observation directe, proxy / indicateur ou inférence. Traitez ensuite la provenance comme une question séparée.',intervention:{who:'Inès · ingénierie systèmes',kind:'Revue fournisseur',context:'Les familles de sources sont connues ; certaines brochures décrivent maintenant un produit comme s’il mesurait directement un risque ou un état.',input:'Quand on me dit « détecte le feu » ou « mesure la santé du pont », je veux savoir ce qui est réellement produit — et où commence l’interprétation.',impact:'Séparer grandeur produite, proxy/indicateur, inférence et provenance.'},time:'5 min',items:[['Lire','contexte + grandeur produite + état recherché'],['Ranger','direct / proxy / inférence'],['Séparer','provenance interne / externe']]},rest:{board:{type:'compare',id:'a5',title:'Où était le désaccord ?',prompt:'Sur quel exemple vos lectures divergent-elles le plus ?',categories:['Capteur niveau','Indice végétation','Caméra + algorithme','Prévision météo']},questions:['Quel exemple divise le plus ?','Qu’est-ce qui est réellement mesuré ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'La relation entre un proxy et l’état recherché change après une modification du terrain.',anchors:[{title:'« Direct » dépend de la grandeur formulée',items:['hauteur locale : directe','risque de crue : interprété','catégorie ≠ qualité']},{title:'Rendre visibles les couches d’interprétation',items:['mesure directe','proxy / indicateur','inférence','provenance séparée']},{title:'Une mesure peut rester juste et devenir trompeuse',items:['proxy qui dérive','modèle hors domaine','contexte qui change']}],takeaway:'Direct ≠ proxy ≠ inférence. La provenance interne/externe est un autre axe à rendre visible.',reference:'<b>Référence :</b> hauteur locale = observation directe ; humidité sol = proxy possible du besoin hydrique ; probabilité de feu = inférence. Une prévision météo est une inférence et peut en plus être externe au système. Sur un pont : signal → indicateur → état suspecté → décision.',reality:'Transfert pont : un accéléromètre mesure une accélération ; un état de santé structurelle est ensuite inféré à partir d’indicateurs, de modèles et du contexte.'}},
{title:'Une valeur ne suffit pas',work:{q:'À 14:30 le tableau de bord affiche 32 °C : qu’est-ce que ce nombre décrit réellement, et de quand date l’état du terrain ?',copy:'Reconstituez le contexte de 32 °C, distinguez l’instant observé, l’instant de production et l’instant d’arrivée, puis comparez deux observations numériquement identiques.',intervention:{who:'Samir · données & sécurité',kind:'Audit de donnée',context:'Des valeurs sont disponibles, mais elles ne peuvent pas encore être comparées proprement sans préciser où, quand et comment elles ont été produites.',input:'32 °C : où, quand, sur quoi, produit comment ?',impact:'Passer d’une valeur isolée à une observation contextualisée que l’on peut réellement interpréter et comparer.'},time:'6 min',items:[['1 · Contextualiser','32 → grandeur · unité · objet · temps · source'],['2 · Dater','terrain observé ? · résultat produit ? · application informée ?'],['3 · Comparer','deux 32 °C qui ne décrivent pas la même observation']] }},
{title:'Dimensionner l’observation',work:{q:'Quelle cadence et quelle granularité spatiale faut-il pour suivre le phénomène avant la décision ?',copy:'Pour chaque phénomène, choisissez une couverture et une cadence adaptées à sa dynamique. Terminez par le cas d’une acquisition toutes les 60 minutes : quel âge peut avoir la dernière observation ?',intervention:{who:'Peio · exploitation terrain',kind:'Dynamiques terrain',context:'A4 a caractérisé les profils des sources ; A6 a distingué temps du phénomène et temps d’arrivée. A7 dimensionne maintenant l’échantillonnage par rapport au monde physique.',input:'Crue en quelques minutes, choc localisé sur un ouvrage, pâture de 50 ha : le même plan d’observation ne peut pas convenir aux trois.',impact:'Relier cadence et couverture à la dynamique du phénomène et à l’horizon de décision.'},time:'5 min',items:[['Crue','point critique + amont · cadence minute'],['Ouvrage','observation ciblée déclenchée par événement'],['Pâture','couverture spatiale + plusieurs points'],['Mini-calcul','60 min de période → presque 60 min d’âge possible']]},rest:{board:{type:'compare',id:'a7',title:'Contrainte dominante',prompt:'Qu’est-ce qui a le plus contraint votre plan : vitesse du phénomène, couverture ou délai de décision ?',categories:['Dynamique temporelle','Variabilité spatiale','Événement localisé']},questions:['Qu’est-ce qui a dimensionné vos trois plans ?','Pourquoi précision locale et représentativité spatiale ne répondent-elles pas à la même question ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'Une mesure parfaite toutes les 60 min suffit-elle si le phénomène devient dangereux en 10 min ?',anchors:[{title:'La cadence doit être reliée à la dynamique',items:['phénomène rapide → observation renouvelée rapidement','âge possible ≈ période d’échantillonnage','délai de décision']},{title:'La couverture doit être reliée à l’objet visé',items:['point critique','ouvrage localisé','parcelle hétérogène']},{title:'Précision ≠ représentativité',items:['excellent au point','pauvre pour la zone','multiplier les points peut améliorer la représentation']}],takeaway:'Dimensionner l’observation = adapter cadence et couverture au phénomène et à la décision.',reference:'<b>Ordres de grandeur :</b> Sentinel‑2 : fauchée ≈290 km, pixels 10/20/60 m, revisite nominale 5 jours. LiDAR HD IGN : ≈10 points/m². Ces chiffres montrent pourquoi couverture, détail et fréquence sont des dimensions distinctes.',reality:'Une station hydrométrique produit une série temporelle locale ; l’imagerie satellite apporte une couverture large ; une inspection humaine apporte un contexte riche mais ponctuel.'}},
{title:'Qualité relative à la décision',work:{q:'Même donnée, deux usages : suffit-elle pour chacun, et quelle dimension explique le contraste ?',copy:'Pour chaque dossier, gardez la donnée identique et changez seulement l’usage : jugez si elle suffit dans les deux cas, puis identifiez la dimension qui explique la différence.',intervention:{who:'Samir · données',kind:'Revue avant décision',context:'A7 a montré qu’un plan peut être trop lent ou trop local. Il reste à savoir si la donnée obtenue est suffisante pour l’usage concret.',input:'Ne me dites pas « bonne donnée ». Dites-moi si elle suffit pour cette décision, à cet horizon et sur cet objet.',impact:'Faire émerger fraîcheur, représentativité et disponibilité comme critères relatifs à l’usage.'},time:'6 min',items:[['Dossier 1','relevé vieux de 3 semaines → fraîcheur'],['Dossier 2','point très précis / 50 ha → représentativité'],['Dossier 3','service indisponible 40 min → disponibilité'],['Geste','2 jugements + 1 dimension par dossier']] }},
{title:'Construire une stratégie d’observation',work:{q:'Surveiller le risque de crue dans la vallée des Aldudes avec trois sources maximum.',copy:'Composez une stratégie avec 2–3 sources maximum. Donnez à chacune un rôle et une limite, puis nommez l’angle mort qui subsiste avant de figer votre v1.',intervention:{who:'Maialen · coordination territoriale',kind:'Arbitrage',context:'Les groupes connaissent maintenant les forces et limites des principales observations ; ils doivent composer sans chercher à tout couvrir.',input:'Trois sources maximum. Pour chacune : quelle information protège-t-elle et quelle limite acceptez-vous ?',impact:'Assembler quelques sources complémentaires, donner à chacune un rôle clair et reconnaître l’angle mort qui subsiste.'},time:'5 min',items:[['1 · Composer','2–3 sources maximum'],['2 · Qualifier','Rôle + limite par source'],['3 · Assumer','1 angle mort avant de figer v1']]},rest:{board:{type:'capture',id:'a9',title:'Stratégies de la classe',prompt:'Quelles combinaisons de sources ou règles de conception ressortent de vos stratégies ?'},questions:['Quelles limites sont réellement complémentaires ?','Où existe-t-il une fausse redondance ?'],questionLabels:['COMPARER','PRÉCISER'],challenge:'Trois sources utilisent la même donnée météo en amont. Sont-elles indépendantes ?',anchors:[{title:'Complémentarité = limites différentes',items:['autre échelle','autre temporalité','autre dépendance','validation croisée']},{title:'Diversité technologique ≠ indépendance',items:['même réseau','même fournisseur','même donnée amont','même modèle']},{title:'Une dépendance commune peut annuler la redondance',items:['chercher la cause commune','nommer l’angle mort','défendre le mode dégradé']}],takeaway:'Une stratégie combine des limites différentes et explicite ses dépendances.',reference:'<b>Qualité :</b> précision · fraîcheur · complétude · cohérence · représentativité · disponibilité.<br><b>Composition :</b> rôle informationnel de chaque source + limite assumée + dépendances communes + angle mort. Trois sources utilisant le même réseau ou la même donnée amont ne constituent pas trois voies indépendantes.',reality:'À Banca, le projet Olha a réellement été adapté avec un nouveau bâtiment hors zone à risque de crue ; la collectivité mentionne aussi travaux de berges et reconstruction de la station d’épuration.'}},
{title:'Incident : décider en mode dégradé',work:{q:'L’incident rend-il encore la décision défendable — et quelle règle minimale faut-il ajouter à v1 ?',copy:'Choisissez un incident qui touche votre v1. Jugez son effet sur la décision de 14:45, identifiez l’hypothèse et l’information menacées, ajoutez une réponse minimale puis rendez visible le risque qui subsiste.',intervention:{who:'Message exploitation',kind:'Incident',context:'A9 a figé une stratégie v1. À 14:45, Peio doit décider si l’accès proche de la Nive peut rester ouvert.',input:'Un incident touche votre v1 juste avant la décision. Pouvez-vous encore décider si l’accès peut rester ouvert avec la même règle ?',impact:'Relier panne technique → information menacée → décision → réponse de fonctionnement.'},time:'7 min',items:[['1 · Incident','pertinent pour v1'],['2 · Décision','oui / sous condition / non'],['3 · Expliquer','hypothèse + information menacée'],['4 · Répondre','une règle minimale'],['5 · Assumer','risque résiduel']]},rest:{board:{type:'compare',id:'a10',title:'Effet de l’incident sur la décision',prompt:'Votre décision reste-t-elle défendable après l’incident ?',categories:['Décision encore possible','Possible sous condition','Décision à suspendre']},questions:['Pourquoi le même incident peut-il avoir un effet différent selon la stratégie v1 ?','À quel moment une panne technique devient-elle un problème de décision ?'],questionLabels:['COMPARER','EXPLIQUER'],challenge:'Votre réponse traite l’incident, mais quel coût, délai ou nouvelle dépendance ajoute-t-elle ?',anchors:[{title:'Le composant n’est pas le niveau final du raisonnement',items:['incident technique','information menacée','décision affectée']},{title:'Le mode dégradé est une décision de conception',items:['confirmer','écarter','attendre','déclarer inconnu']},{title:'Une mitigation déplace souvent le risque',items:['coût','délai','dépendance','incertitude résiduelle']}],takeaway:'Incident → effet sur la décision → hypothèse / information → réponse minimale → risque résiduel.',reference:'<b>Révision :</b> une v2 n’a pas à être parfaite. Elle doit expliquer quelle règle change lorsque l’information n’est plus suffisamment fiable pour la décision.',reality:'La robustesse est relative aux incidents considérés et au comportement dégradé acceptable.'}}
];
let i=0,mode='work',boards={},reveals={};try{boards=JSON.parse(sessionStorage.getItem('ec-s1-projection')||'{}')}catch(_){boards={}}const scene=document.getElementById('scene');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function boardData(b){if(!boards[b.id])boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]};return boards[b.id]}
function save(){try{sessionStorage.setItem('ec-s1-projection',JSON.stringify(boards))}catch(_){}}
function boardHtml(b){const d=boardData(b);if(b.type==='capture')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Tableau de classe</span></div><div class="board-body"><form class="board-form" data-capture><input name="idea" maxlength="70" placeholder="Entrée courte"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="chips">${d.items.map((x,k)=>`<button class="chip" type="button" data-remove="${k}">${esc(x)} ×</button>`).join('')||'<span style="color:var(--muted)">Les contributions apparaissent ici.</span>'}</div></div></div>`;if(b.type==='compare')return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Votes</span></div><div class="board-body"><div class="compare">${b.categories.map(c=>`<div class="compare-item"><strong>${c}</strong><div><div class="count">${d.counts[c]||0}</div><div class="count-actions"><button data-count="${esc(c)}" data-delta="-1">−</button><button data-count="${esc(c)}" data-delta="1">+</button></div></div></div>`).join('')}</div><button class="btn" type="button" data-clear style="margin-top:10px">Effacer</button></div></div>`;return `<div class="board"><div class="board-head"><div><strong>${b.title}</strong><small>${b.prompt}</small></div><span>Chaîne</span></div><div class="board-body"><form class="board-form" data-node><input name="node" maxlength="35" placeholder="Élément de la chaîne"><button class="btn primary">Ajouter</button><button class="btn" type="button" data-clear>Effacer</button></form><div class="structure">${d.nodes.map((x,k)=>`${k?'<span class="arrow">→</span>':''}<button type="button" class="node" data-node-remove="${k}">${esc(x)}</button>`).join('')||'<span style="color:var(--muted)">Construisez la chaîne collectivement.</span>'}</div></div></div>`}
function avatarFor(w){const name=(w||'').split('·')[0].trim();if(name.toLowerCase().startsWith('message'))return '!';const parts=name.split(/\s+/).filter(Boolean);return parts.length>1?(parts[0][0]+parts[1][0]).toUpperCase():name.slice(0,2).toUpperCase()}
function work(c){const iv=c.work.intervention;let beat='';if(iv){const who=iv.who||'',parts=who.split('·').map(x=>x.trim()),name=parts.shift()||who,role=parts.join(' · ');beat=`<div class="story-beat"><div class="story-avatar">${avatarFor(who)}</div><div><div class="story-meta"><strong>${esc(name)}</strong>${role?`<span>${esc(role)}</span>`:''}<b>${esc(iv.kind||'Nouvelle contrainte')}</b></div><small class="story-input-label">NOUVELLE INFORMATION</small><p>${esc(iv.input)}</p></div></div>`}return `<div class="phase-kicker">TRAVAIL</div>${beat}<div class="projector-move">À VOUS</div><div class="work-simple"><div class="work-simple-main"><h2>${c.work.q}</h2><p>${c.work.copy}</p><span class="work-time">Temps cible · ${c.work.time}</span></div><div class="work-deliverables">${c.work.items.map(x=>`<div class="work-item"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('')}</div></div>`}
function discussionDeck(r){const qs=r.questions||[],labels=r.questionLabels||qs.map((_,k)=>`QUESTION ${k+1}`),compare=qs[0]?{label:labels[0]||'COMPARER',q:qs[0]}:null,cards=[...qs.slice(1).map((q,k)=>({label:labels[k+1]||`QUESTION ${k+2}`,q,anchor:r.anchors?.[k+1]})),{label:'ÉPROUVER',q:r.challenge,anchor:r.anchors?.[qs.length]}].filter(x=>x.q);return `<aside class="discussion-deck"><div class="discussion-deck-head"><div class="discussion-deck-kicker">MISE EN COMMUN</div><h3>Comparer vos décisions</h3><p>Commencez par les écarts entre groupes, puis ouvrez les cartes qui permettent de trancher les distinctions importantes.</p></div>${compare?`<div class="discussion-compare"><div><b>${esc(compare.label)}</b><span>QUESTION DE DISCUSSION</span></div><strong>${esc(compare.q)}</strong><small>Mettez en regard vos choix et leurs justifications.</small></div>`:''}${cards.length?`<div class="discussion-anchor-head"><b>POINTS À TRANCHER</b><span>Ouvrez une carte après la discussion.</span></div><div class="discussion-card-grid">${cards.map((c,k)=>`<button class="discussion-flip" type="button" data-discuss-card="${k}" aria-expanded="false"><span class="discussion-flip-inner"><span class="discussion-face discussion-front"><b>${esc(c.label)}</b><strong>${esc(c.q)}</strong><small>Ouvrir →</small></span><span class="discussion-face discussion-back"><b>RÈGLE</b><strong>${esc(c.anchor?.title||r.takeaway)}</strong>${c.anchor?.items?.length?`<div class="discussion-anchor-items">${c.anchor.items.map(x=>`<span>${esc(x)}</span>`).join('')}</div>`:''}<small>Revenir à la question ↺</small></span></span></button>`).join('')}</div>`:''}</aside>`}
function rest(c){const r=c.rest,p=reveals[i]==='reality'?'reality':null;return `<div class="rest"><div class="eyebrow">MISE EN COMMUN</div><div class="rest-grid"><div class="restitution-main">${boardHtml(r.board)}</div>${discussionDeck(r)}</div>${r.reality?`<div class="synthesis"><div class="synthesis-head"><div><strong>Cas réel / ordre de grandeur</strong><span>Reliez maintenant la discussion à un exemple, une donnée ou une limite concrète.</span></div><div class="reveal-actions"><button class="reveal ${p==='reality'?'active':''}" data-reveal="reality">${p==='reality'?'Fermer':'Ouvrir le cas'}</button></div></div>${p?`<div class="reveal-card reality">${r.reality}</div>`:''}</div>`:''}</div>`}
function finalHtml(){return `<div class="final-wrap"><div class="final-head"><div><div class="eyebrow">SYNTHÈSE · ÉPISODE 1</div><h2>Observer avant de connecter</h2><p>Six règles résument les décisions prises pendant la mission et les limites qu’il faudra conserver dans la suite.</p></div><span class="final-badge">Dossier S1 figé</span></div><div class="final-grid">
<div class="final-card"><b>01 · Partir du besoin</b><strong>Décision → information nécessaire</strong><span>Disponible ne signifie pas utile. Une donnée n’a de valeur que si elle peut modifier une décision ou réduire une incertitude pertinente.</span></div>
<div class="final-card"><b>02 · Justifier la mesure</b><strong>Concevoir ↓ · exploiter ↑</strong><span>Conception : décision → information → phénomène → observable → mesure. Exploitation : phénomène → observable → mesure → information interprétée → décision.</span></div>
<div class="final-card"><b>03 · Profiler et dimensionner</b><strong>Couverture + cadence doivent suivre le phénomène</strong><span>Une source possède un profil spatial et temporel ; le plan d’observation doit ensuite être dimensionné selon la dynamique du phénomène et l’horizon de décision.</span></div>
<div class="final-card"><b>04 · Interpréter et contextualiser</b><strong>Direct / proxy / inférence · valeur + contexte + temps</strong><span>La relation à l’état recherché, la provenance et les temporalités sont des axes distincts à conserver avec l’observation.</span></div>
<div class="final-card"><b>05 · Qualifier</b><strong>Qualité = aptitude à l’usage · précision ≠ représentativité</strong><span>Fraîcheur, complétude, cohérence, représentativité et disponibilité deviennent critiques selon la décision et son coût d’erreur.</span></div>
<div class="final-card"><b>06 · Concevoir et réviser</b><strong>Rôles + limites + dépendances + angle mort</strong><span>Si une hypothèse tombe : information menacée → delta v2 explicable → faiblesse résiduelle assumée.</span></div>
</div><div class="final-bridge"><b>ÉPISODE 2 · COLLECTER / CONNECTER</b><strong>Ces observations sont dispersées dans une vallée montagneuse. Comment les transporter jusqu’à l’endroit où elles doivent être utilisées ?</strong><span>On comparera alors les technologies de communication sur des ordres de grandeur de portée, débit et énergie — avec le relief et le déploiement comme hypothèses, pas avec une « portée garantie ».</span></div></div>`}
function render(){if(mode==='final'){scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">Clôture de la séance</div><h1>Synthèse finale</h1></div><span class="mode">SYNTHÈSE</span></div><div class="shell stage">${finalHtml()}</div>`;document.getElementById('phaseCount').textContent='S1 · SYNTHÈSE';document.getElementById('progress').innerHTML=checkpoints.map((_,k)=>`<button class="dot done" data-jump="${k}">${k+1}</button>`).join('');document.getElementById('back').disabled=false;document.getElementById('next').textContent='Revenir au début ↺';return}const c=checkpoints[i];if(mode==='rest'&&!c.rest)mode='work';scene.innerHTML=`<div class="shell scene-head"><div><div class="eyebrow">Activité ${i+1} / 10 · ${mode==='work'?'travail':'mise en commun'}</div><h1>${c.title}</h1></div><span class="mode">${mode==='work'?'TRAVAIL':'MISE EN COMMUN'}</span></div><div class="shell stage">${mode==='work'?work(c):rest(c)}</div>`;document.getElementById('phaseCount').textContent=`${i+1}/10 · ${mode==='work'?'TRAVAIL':'MISE EN COMMUN'}`;document.getElementById('progress').innerHTML=checkpoints.map((_,k)=>`<button class="dot ${k===i?'active':''}" data-jump="${k}">${k+1}</button>`).join('');document.getElementById('back').disabled=i===0&&mode==='work';document.getElementById('next').textContent=mode==='work'&&c.rest?'Mettre en commun →':(i===9&&mode==='rest'?'Synthèse finale →':i===9?'Mettre en commun →':'Activité suivante →')}
function next(){if(mode==='final'){i=0;mode='work';render();return}const c=checkpoints[i];if(mode==='work'&&c.rest){mode='rest'}else if(i===9&&mode==='rest'){mode='final'}else if(i<9){i++;mode='work'}render()}
function back(){if(mode==='final'){i=9;mode='rest';render();return}if(mode==='rest')mode='work';else if(i>0){i--;mode=checkpoints[i].rest?'rest':'work'}render()}
scene.addEventListener('submit',e=>{e.preventDefault();const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b),fd=new FormData(e.target);if(e.target.matches('[data-capture]')){const v=(fd.get('idea')||'').trim();if(v&&!d.items.includes(v))d.items.push(v)}if(e.target.matches('[data-node]')){const v=(fd.get('node')||'').trim();if(v)d.nodes.push(v)}save();render()});
scene.addEventListener('click',e=>{const flip=e.target.closest('[data-discuss-card]');if(flip){flip.classList.toggle('flipped');flip.setAttribute('aria-expanded',flip.classList.contains('flipped')?'true':'false');return}if(e.target.dataset.reveal){reveals[i]=reveals[i]===e.target.dataset.reveal?null:e.target.dataset.reveal;render();return}const b=checkpoints[i].rest?.board;if(!b)return;const d=boardData(b);if(e.target.dataset.remove!==undefined)d.items.splice(+e.target.dataset.remove,1);if(e.target.dataset.nodeRemove!==undefined)d.nodes.splice(+e.target.dataset.nodeRemove,1);if(e.target.dataset.count){d.counts[e.target.dataset.count]=Math.max(0,(d.counts[e.target.dataset.count]||0)+(+e.target.dataset.delta))}if(e.target.matches('[data-clear]')){if(confirm('Effacer ce tableau ?'))boards[b.id]=b.type==='capture'?{items:[]}:b.type==='compare'?{counts:Object.fromEntries(b.categories.map(x=>[x,0]))}:{nodes:[]}}save();render()});
document.getElementById('next').onclick=next;document.getElementById('back').onclick=back;document.getElementById('newClass').onclick=()=>{if(confirm('Réinitialiser tous les tableaux de classe ?')){boards={};reveals={};try{sessionStorage.removeItem('ec-s1-projection')}catch(_){}i=0;mode='work';render()}};document.getElementById('fullscreen').onclick=()=>document.documentElement.requestFullscreen?.();document.getElementById('progress').onclick=e=>{if(e.target.dataset.jump!==undefined){i=+e.target.dataset.jump;mode='work';render()}};document.addEventListener('keydown',e=>{if(e.target.matches('input,button,select'))return;if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next()}if(e.key==='ArrowLeft')back();if(e.key.toLowerCase()==='f')document.documentElement.requestFullscreen?.()});render();
</script></body></html>
