<!doctype html><html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Projection · S1 · Environnements connectés</title><link rel="stylesheet" href="../assets/projector.css"></head><body><header class="topbar"><div class="shell topin"><div class="brand">Environnements connectés<small>Séance 1 · Observer la vallée des Aldudes</small></div><div class="progress" id="progress"></div><div class="top-actions"><button class="btn" id="fullscreen" type="button">Plein écran</button></div></div></header><main class="scene" id="scene"></main><div class="nav"><button class="btn" id="back" type="button">← Retour</button><span class="screen-count" id="screenCount"></span><button class="btn primary" id="next" type="button">Continuer →</button></div>
<script>window.PROJECTOR_DATA={"session":1,"activities":[{"title":"Que voudriez-vous savoir ?","workTime":"4 min","stopTime":"5 min","work":{"question":"Vallée des Aldudes : quelles informations seraient réellement utiles avant de parler technologie ?","support":"Ouvrez le champ, puis assumez une priorité. Vous devrez pouvoir relier chaque choix à un enjeu concret du territoire.","produce":["5–7 informations possibles, puis un Top 3.","Pour chaque priorité : l’enjeu qui justifie sa place."]},"stop":{"question":"Pourquoi deux équipes peuvent-elles définir des besoins d’information différents sur le même système ?","probeTitle":"Avant de chercher une solution, qu’est-ce qui détermine réellement ce qu’il faut connaître ?","probe":["Le même territoire doit-il être décrit de la même manière pour tous les usages ?","Une information devient-elle prioritaire simplement parce qu’elle est facile ou peu coûteuse à obtenir ?"],"complements":["Un même système physique admet plusieurs vues pertinentes : le besoin d’information dépend de l’objectif, de l’acteur, de l’échelle et de l’horizon considérés.","On ne cherche donc pas à observer « tout » : spécifier un besoin, c’est aussi accepter quelles questions resteront secondaires ou inconnues.","La disponibilité d’une technologie ne définit pas le besoin. Le cadrage du problème doit précéder le choix des moyens d’observation."]}},{"title":"Partir de la décision","workTime":"4 min","work":{"question":"Si vous ne pouviez demander qu’une information en premier, laquelle voudriez-vous avoir avant d’agir ?","support":"Pour chaque décision imposée, choisissez une seule information en premier et demandez-vous ce qu’elle pourrait réellement changer dans l’action.","produce":["Une information prioritaire pour chacune des quatre décisions.","Pour chaque choix : ce qui changerait dans l’action si cette information changeait."]}},{"title":"Du besoin à la mesure","workTime":"4 min","stopTime":"5 min","work":{"question":"Fermer l’accès ou le maintenir : comment relier cette décision à une mesure défendable ?","support":"Complétez la chaîne du cas de Banca avec les propositions mélangées. Puis lisez la même chaîne dans le sens du fonctionnement réel.","produce":["Décision → information → phénomène → observable → mesure.","Une explication : pourquoi le capteur ne doit-il pas être le point de départ du raisonnement ?"]},"stop":{"question":"Comment passe-t-on d’une décision à ce qu’un système peut réellement connaître du monde physique ?","probeTitle":"Deux filtres interviennent avant même de choisir un capteur.","probe":["Quelle information aurait réellement la capacité de modifier la décision ?","Quel observable rend cette information accessible — et qu’est-ce qui resterait malgré tout invisible ?"],"complements":["La valeur d’une information est relative à la décision : elle vient de l’incertitude pertinente qu’elle permet de réduire, pas de sa richesse intrinsèque.","Un système n’accède pas directement au phénomène : il n’en connaît que les manifestations qu’il a rendues observables. Ce qui n’est pas observable reste inconnu.","Le choix du capteur arrive après ces deux questions. La précision instrumentale ne répare ni une information sans valeur décisionnelle, ni un phénomène mal rendu observable."]}},{"title":"Profils d’observation","workTime":"5 min","work":{"question":"Pour chaque source : quelle étendue observe-t-elle, et à quel rythme l’observation peut-elle être renouvelée ?","support":"Décrivez séparément couverture et rythme pour une station, un satellite, un drone et une observation humaine. Ne cherchez pas encore une “meilleure” source.","produce":["Un profil couverture + rythme pour chacune des quatre sources.","Une comparaison : ce qu’une source voit mieux qu’une autre — et ce qu’elle voit moins bien."]}},{"title":"Observer, indiquer ou inférer ?","workTime":"5 min","stopTime":"5 min","work":{"question":"Dans six promesses fournisseur, qu’est-ce qui est réellement observé — et où commence l’interprétation ?","support":"Séparez la grandeur effectivement produite de l’état recherché. Classez direct / proxy / inférence, puis traitez la provenance séparément.","produce":["Une classification justifiée des six cas.","Pour chaque cas ambigu : ce qui est mesuré et ce qui est interprété."]},"stop":{"question":"Qu’est-ce qui change quand on passe d’une observation directe à un proxy puis à une inférence ?","probeTitle":"Le dispositif peut fonctionner parfaitement et pourtant produire une information trompeuse. Pourquoi ?","probe":["Quelles hypothèses supplémentaires apparaissent entre la grandeur mesurée et l’état que l’on affirme connaître ?","Comment ces hypothèses peuvent-elles cesser d’être valides sans qu’aucun capteur ne tombe en panne ?"],"complements":["Chaque transformation entre mesure et information ajoute des hypothèses : relation physique pour un proxy, modèle et domaine de validité pour une inférence.","La chaîne de confiance peut donc casser sans panne matérielle : dérive du terrain, changement d’usage ou sortie du domaine du modèle suffisent.","Provenance et interprétation sont deux axes distincts : une source externe ajoute une dépendance opérationnelle, pas une nouvelle nature sémantique."]}},{"title":"Une valeur ne suffit pas","workTime":"6 min","work":{"question":"À 14:30, le tableau de bord affiche 32 °C : que décrit réellement cette valeur, et de quand date l’état du terrain ?","support":"Reconstituez son contexte, distinguez les trois événements temporels, puis comparez deux observations numériquement identiques.","produce":["32 °C replacé dans son contexte : grandeur, unité, objet, temps et source.","Terrain observé / résultat produit / application informée : trois instants distincts.","Une raison pour laquelle deux valeurs égales peuvent être incomparables."]}},{"title":"Dimensionner l’observation","workTime":"5 min","stopTime":"5 min","work":{"question":"Quelle cadence et quelle granularité spatiale faut-il pour suivre le phénomène avant la décision ?","support":"Dimensionnez trois plans d’observation à partir de la dynamique du phénomène. Terminez par le cas d’une acquisition toutes les 60 minutes.","produce":["Pour crue, ouvrage et pâture : une couverture et une cadence justifiées.","Pour une période de 60 min : l’âge maximal plausible de la dernière observation."]},"stop":{"question":"Observer un phénomène, est-ce autre chose que l’échantillonner dans l’espace et dans le temps ?","probeTitle":"Quels paramètres décrivent réellement ce que votre système peut voir ?","probe":["Résolution spatiale, couverture, fréquence d’acquisition et latence peuvent-elles varier indépendamment ?","Pourquoi la dynamique du phénomène et le délai de décision doivent-ils dimensionner le plan avant le choix technologique ?"],"complements":["Toute observation est un échantillonnage spatio-temporel : on ne voit ni partout, ni en continu.","Couverture, résolution, période d’échantillonnage et latence sont des dimensions distinctes ; améliorer l’une n’améliore pas automatiquement les autres.","Le plan d’observation doit être dimensionné par la dynamique du phénomène et l’horizon de décision, puis seulement confronté aux capacités des technologies."]}},{"title":"Qualité relative à la décision","workTime":"6 min","work":{"question":"Même donnée, deux usages : suffit-elle pour chacun, et quelle dimension explique le contraste ?","support":"Traitez les trois dossiers l’un après l’autre. La donnée reste identique ; seule la décision change.","produce":["Deux jugements par dossier : acceptable ou fragile selon l’usage.","Une dimension de qualité qui explique le contraste."]}},{"title":"Construire une stratégie d’observation","workTime":"5 min","stopTime":"5 min","work":{"question":"Surveiller le risque de crue dans la vallée avec trois sources maximum : comment les rendre réellement complémentaires ?","support":"Composez une v1 parcimonieuse. Chaque source doit avoir un rôle, une limite et une raison d’être ; votre stratégie doit aussi assumer un angle mort.","produce":["2–3 sources maximum avec rôle + limite pour chacune.","Un angle mort ou une dépendance que votre v1 ne supprime pas."]},"stop":{"question":"S’il n’existe pas de « meilleure source » en général, qu’apporte réellement une stratégie multisource ?","probeTitle":"Complémentarité d’usage et indépendance des pannes sont deux choses différentes.","probe":["Deux sources qui sont fragiles sur la même dimension de qualité sont-elles vraiment complémentaires pour votre décision ?","Deux technologies différentes peuvent-elles malgré tout tomber en panne pour la même cause ?"],"complements":["La qualité restant relative à l’usage, une seconde source n’est utile que si elle apporte une information pertinente là où la première est insuffisante.","Diversité technologique ≠ indépendance des défaillances : plusieurs sources peuvent partager alimentation, réseau, fournisseur, modèle ou maintenance.","La robustesse multisource se raisonne donc à la fois sur la complémentarité informationnelle et sur les causes communes de panne, pas sur le nombre de technologies."]}},{"title":"Incident : décider en mode dégradé","workTime":"7 min","stopTime":"5 min","work":{"question":"Un incident touche votre v1 : la décision de 14:45 reste-t-elle défendable, et sous quelle règle minimale ?","support":"Partez de l’effet sur la décision, remontez vers l’hypothèse et l’information menacées, puis choisissez une seule réponse minimale et rendez son coût visible.","produce":["Incident → effet sur la décision → hypothèse / information menacée.","Une règle minimale de mode dégradé + le risque ou coût qui subsiste."]},"stop":{"question":"Qu’est-ce qu’un système robuste doit savoir faire lorsque ses hypothèses nominales ne tiennent plus ?","probeTitle":"La robustesse signifie-t-elle continuer à fonctionner normalement à tout prix ?","probe":["Déclarer « information insuffisante », différer ou réduire le service peuvent-ils être des comportements corrects ?","Une mitigation supprime-t-elle le risque, ou le déplace-t-elle vers du délai, du coût, une nouvelle dépendance ou une incertitude résiduelle ?"],"complements":["Un système robuste possède un comportement défini hors du régime nominal : continuer en mode restreint, confirmer, différer ou s’abstenir peuvent être des sorties correctes.","L’état « inconnu » n’est pas nécessairement un échec : il peut être préférable à une décision présentée comme certaine alors que l’information ne la justifie plus.","Une dégradation maîtrisée rend explicites l’hypothèse tombée, le service encore défendable et le risque résiduel ; elle ne prétend pas restaurer magiquement le nominal."]}}],"final":{"title":"Un environnement connecté est un système d’observation du monde physique.","support":"Il ne voit jamais le réel directement : il construit, pour une décision donnée, une représentation partielle du monde à partir d’observations et d’hypothèses.","points":[{"title":"Ce qui n’est pas observable reste inconnu","text":"Le système ne connaît que les manifestations du phénomène rendues observables par ses dispositifs. La précision d’un instrument ne compense pas un mauvais choix d’observable ou une zone hors champ."},{"title":"Toute observation est un échantillon","text":"Espace, temps, résolution, fréquence d’acquisition et latence limitent ce qui peut être affirmé. Observer davantage sur un axe ne signifie pas mieux observer sur tous les autres."},{"title":"Toute information interprétée porte des hypothèses","text":"Proxy et inférences ajoutent des relations ou des modèles entre mesure et état recherché. Leur validité — comme la qualité d’une donnée — doit être jugée relativement à l’usage."},{"title":"La robustesse dépend des dépendances et de la dégradation","text":"Multiplier les sources ne suffit pas si elles partagent les mêmes causes de panne. Un système robuste prévoit aussi ce qu’il fait lorsque l’information devient insuffisante ou incertaine."}],"iotTitle":"Les objets qui instrumentent et connectent le monde physique relèvent de l’Internet des objets (IoT).","iotText":"Capteurs, stations, caméras et équipements connectés constituent cette partie instrumentée. Un environnement connecté est plus large : il combine éventuellement ces objets avec imagerie, services externes, historiques métier et observations humaines.","bridge":"Séance 2 : comment transporter ces observations jusqu’au lieu où elles doivent être utilisées, avec des contraintes de portée, débit, énergie, relief, latence et disponibilité ?"}};</script><script src="../assets/projector.js"></script></body></html>
